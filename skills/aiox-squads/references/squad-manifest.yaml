schema_version: 1
router_skill: aiox-squads
course_root: cursos/AIOX-Advanced-Squads
agent_guide: cursos/AIOX-Advanced-Squads/AGENT-GUIDE.md
decision_map: cursos/AIOX-Advanced-Squads/Mapa-de-decisao.md
execution_guide: cursos/AIOX-Advanced-Squads/Guia-de-execucao.md
intro_lesson: cursos/AIOX-Advanced-Squads/aulas/00-como-usar-este-curso.md
library_layout:
  skills: skills/
  squads: squads/
  note: This repo is a distribution library, not a runnable monorepo runtime.
runtime_surfaces:
  claude_code:
    skill_invoke: Skill name after install under .claude/skills/{name}/SKILL.md —
      agent may load via skill tool or user types the skill name.
    agent: '@agent-name only if your harness maps @ to agent files; otherwise open
      agents/*.md path.'
    task: '*command when the agent definition exposes commands; otherwise describe
      the task by name from tasks/.'
    slash_pack: /Prefix:... only if the project registered the pack; never invent.
  codex:
    skill_invoke: Project/global skills by name if configured; else attach SKILL.md
      content.
    agent: Instruct model to adopt persona from squads/{id}/agents/{entry}.md
    task: Reference task file path; do not assume * prefix.
    slash_pack: Not assumed.
  generic:
    skill_invoke: Paste or load SKILL.md / AGENT-GUIDE.md
    agent: 'System prompt: adopt entry agent file'
    task: Natural language task name from tasks/
    slash_pack: N/A
routing_procedure:
- 1. Classify user intent (decide / research / reverse-engineer / build / sell / operate).
- 2. Match intents[] and avoid_when in this manifest; if tie, open Mapa-de-decisao.md.
- 3. Open the lesson file for the chosen squad.
- 4. If squad not installed in the active project, follow if_not_installed before
  executing.
- 5. Build briefing from the lesson template; confirm external side effects.
- 6. Activate via runtime-appropriate surface only.
- 7. Require evidence checklist before claiming done.
squads:
- id: advisory-board
  lesson: cursos/AIOX-Advanced-Squads/aulas/01-advisory-board.md
  lesson_id: 01-advisory-board
  maturity: partial
  agents_count: 11
  tasks_count: 8
  workflows_count: 2
  entry_agent: board-chair
  skill_entries:
  - advisory-board
  intents:
  - decisão
  - board
  - groupthink
  - conselho
  - mesa redonda
  - trade-off estratégico
  avoid_when: descoberta factual pura (use research) ou execução já decidida
  install_path: squads/advisory-board/
  activation:
    claude_code:
      skill: /advisory-board
      agent: '@board-chair'
      task_prefix: '*'
      note: Slash de skill só existe se a skill estiver em .claude/skills do projeto.
    codex:
      skill: advisory-board
      prompt: Load squad at squads/advisory-board/ and adopt agent board-chair. Follow
        config.yaml.
      note: Codex usa skills do projeto/config; não assume $skill nem /prefixo AIOX.
    generic_prompt: You are operating the AIOX squad "advisory-board". Read squads/advisory-board/config.yaml
      and agents/board-chair.md. Ask for a mission briefing if missing. Do not invent
      CLI commands.
  if_not_installed:
  - Copy squads/advisory-board/ into the target project squads/ directory.
  - Optionally copy skill(s) ['advisory-board'] into the IDE skills path.
  - Open the lesson cursos/AIOX-Advanced-Squads/aulas/01-advisory-board.md for briefing
    template and evidence checklist.
  - Do not fabricate slash commands that are not registered in the runtime.
  aliases:
  - advisory board
  - advisory-board
  signals:
  - decisão
  - board
  - groupthink

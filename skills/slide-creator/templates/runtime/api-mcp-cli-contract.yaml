# Capability ownership note (per @cso GF-03):
# This contract documents the squad-owned slide-creator capability projected
# across three surfaces (CLI/REST/MCP). Per Constitution Art XI
# (Squad-First Portability), the squad owns the canonical behaviour;
# CLI/REST/MCP are projections of that single capability, not competing APIs.
canonical_capability:
  squad: slide-creator
  capability: deck_generation_and_edit_pipeline
  versioning:
    runtime_version: 0.1.0
    job_state_schema_version: 1.0.0
    api_mcp_cli_contract_version: 5
    runtime_info_ref: packages/slides-core/src/runtime-info.ts
  projections:
    - surface: cli
      entrypoint: scripts/aiox/slides-cli.mjs
    - surface: rest
      entrypoint: apps/squad-engine/src/routes/rest/slides.route.ts
    - surface: mcp
      entrypoint: packages/slides-mcp/src/server.ts

shared_job_lifecycle:
  states:
    - queued
    - running
    - reflecting
    - rendering
    - packaging  # GAP-RT-004+005 (PR-W3b) — delivery package assembly stage
    - completed
    - failed
    - cancelled
  notes:
    - >
      State 'running' represents collapsed planning+drafting from v1. To
      regain phase-level granularity, the runtime emits stage_started events
      with phase substrings (normalize_briefing / compose_deck_spec /
      critique_loop / compile_native_ir) at each pipeline boundary. See
      packages/slides-core/src/pipeline.ts.
    - >
      State 'packaging' implemented in PR-W3b (Wave 3). The runtime derives
      story-arc.yaml / slide-function-map.yaml / design-direction.yaml from
      DeckSpec and writes the 11-field delivery-manifest.yaml. See
      packages/slides-core/src/packaging/. Non-fatal: missing required files
      are reported in the manifest, not thrown.
  required_job_fields:
    - schema_version
    - run_id
    - status
    - created_at
    - updated_at
    - provider
    - artifacts
    - progress
    - errors
    - reflection_iterations
    # Promoted from deferred_fields per Wave 2 PR-4b (GAP-RT-001+002 + GAP-RT-012):
    - command  # GAP-RT-002 — see packages/slides-core/src/types/index.ts
    - mode  # GAP-RT-002
    - inputs  # GAP-RT-002 — enables deterministic replay
    - source_of_truth_policy  # GAP-RT-012 — wired at edit/export gates
  deferred_fields: []
    # All v2 deferred fields (command, mode, inputs, source_of_truth_policy)
    # promoted to required_job_fields in v3 (PR-4b Wave 2):
    #   - command, mode, inputs: GAP-RT-001+002 closed
    #   - source_of_truth_policy: GAP-RT-012 closed (SOT gate wired at edit/export)
    # Next deferred bucket would track render-lock (GAP-RT-013, Wave 3).
  event_types:
    - job_created
    - stage_started
    - artifact_written
    - validation_passed
    - validation_failed
    - export_verified
    - package_assembled  # GAP-RT-004 (PR-W3b) — emitted after delivery-manifest write
    - job_completed
    - job_failed
  deferred_event_types: []
    # package_assembled promoted to event_types in PR-W3b (Wave 3).
    # No remaining deferred event types.

cli_commands:
  - id: slides version
    purpose: >
      Return canonical runtime identity, semantic version, contract version,
      and registered CLI/REST/MCP surfaces.
    runtime_ref: scripts/aiox/slides-cli.mjs#cmdVersion
    required_inputs: []
    required_outputs: [runtime_info]
  - id: slides generate
    purpose: >
      Run the full AIOX slides pipeline: briefing → DeckSpec → reflection →
      Native IR → PPTX. Produces a run_id and artifact paths.
    runtime_ref: scripts/aiox/slides-cli.mjs#cmdGenerate
    required_inputs: [prompt, audience, objective]
    optional_inputs: [slide_count, delivery_format, provider_mode, provider_model]
    required_outputs: [job_state, deck_spec, native_ir, pptx]
  - id: slides review
    purpose: >
      Run one or more critique loop iterations on an existing run's DeckSpec.
    runtime_ref: scripts/aiox/slides-cli.mjs#cmdReview
    required_inputs: [run_id]
    optional_inputs: [iterations]
    required_outputs: [job_state, critique_report]
  - id: slides export
    purpose: >
      Re-emit PPTX from the cached Native IR for a given run_id.
    runtime_ref: scripts/aiox/slides-cli.mjs#cmdExport
    required_inputs: [run_id]
    optional_inputs: [format]
    required_outputs: [export_artifact_path]
  - id: slides edit
    purpose: >
      Apply a scoped prompt-to-edit on a slide (or region/element). Returns
      the diff; the operation is recorded in edit-operations.jsonl.
    runtime_ref: scripts/aiox/slides-cli.mjs#cmdEdit
    required_inputs: [run_id, slide_id, intent]
    optional_inputs: [region, node_id]
    required_outputs: [edit_operation, edit_history_entry]
  - id: slides edit:history
    aliases: [edit-history]
    purpose: >
      List the edit history for a run_id (chronological operation log).
    runtime_ref: scripts/aiox/slides-cli.mjs#cmdEditHistory
    required_inputs: [run_id]
    required_outputs: [edit_history]
  - id: slides edit:undo
    aliases: [edit-undo]
    purpose: >
      Undo the most recent edit operation for a run_id.
    runtime_ref: scripts/aiox/slides-cli.mjs#cmdEditUndo
    required_inputs: [run_id]
    required_outputs: [undone_operation]
  - id: slides edit:redo
    aliases: [edit-redo]
    purpose: >
      Re-apply the most recently undone edit operation.
    runtime_ref: scripts/aiox/slides-cli.mjs#cmdEditRedo
    required_inputs: [run_id]
    required_outputs: [redone_operation]
  - id: slides show
    purpose: >
      Return the job-state snapshot for a run_id, including artifact paths.
    runtime_ref: scripts/aiox/slides-cli.mjs#cmdShow
    required_inputs: [run_id]
    required_outputs: [job_state]


version: 9
name: api-mcp-cli-contract
purpose: >
  Define a self-contained automation surface for slide-creator so deck
  generation, critique, edit, export, and ingestion can be exposed via CLI,
  REST-style API, and MCP tools with the same job-state semantics. This
  contract documents the shipping runtime; fields not yet implemented are
  marked status: deferred per extraction-no-fallbacks.


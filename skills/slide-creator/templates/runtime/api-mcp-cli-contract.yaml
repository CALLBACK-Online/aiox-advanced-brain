mcp_tools:
  - id: slides.version
    runtime_ref: packages/slides-mcp/src/server.ts
    purpose: >
      Return canonical runtime identity, semantic version, contract version,
      and registered CLI/REST/MCP surfaces.
    safety_boundary: Read-only; no provider input and no project docs reads.
    required_artifacts: [runtime_info]
  - id: slides.generate
    runtime_ref: packages/slides-mcp/src/server.ts:32
    purpose: >
      Run the full AIOX slides pipeline: briefing → DeckSpec → reflection →
      Native IR → PPTX. Produces a run_id and artifact paths.
    safety_boundary: >
      Never reads or echoes secrets. Provider credentials are read by
      slides-core from environment, never from tool arguments.
    required_artifacts: [job_state]
  - id: slides.review
    runtime_ref: packages/slides-mcp/src/server.ts:83
    purpose: Run one or more critique loop iterations on an existing run's DeckSpec.
    safety_boundary: Read-only over the DeckSpec; emits critique report only.
    required_artifacts: [job_state]
  - id: slides.export
    runtime_ref: packages/slides-mcp/src/server.ts:110
    purpose: Re-emit PPTX from the cached Native IR for a given run_id.
    safety_boundary: >
      Cannot claim success without writing an export artifact path that
      slides-core can readback. NOTE: export verification gate
      (existsSync + size check + thumbnail) is GAP-RT-003, status: deferred.
    required_artifacts: [export_artifact_path]
  - id: slides.edit
    runtime_ref: packages/slides-mcp/src/server.ts:128
    purpose: >
      Apply a scoped prompt-to-edit on a slide (or region/element). Returns
      the diff; the operation is recorded in edit-operations.jsonl.
    safety_boundary: >
      Cannot bypass source-of-truth policy or render-lock — see
      safety_rules. Both are status: deferred per GF-04 until GAP-RT-012
      and GAP-RT-013 close.
    required_artifacts: [edit_operation]
  - id: slides.edit.history
    runtime_ref: packages/slides-mcp/src/server.ts
    purpose: Return chronological edit history for an existing run_id.
    safety_boundary: Read-only over edit-operations.jsonl.
    required_artifacts: [edit_history]
  - id: slides.edit.undo
    runtime_ref: packages/slides-mcp/src/server.ts
    purpose: Undo the most recent applied edit and recompile Native IR when present.
    safety_boundary: Mutates only deck-spec snapshot state and derived Native IR for the target run.
    required_artifacts: [undone_operation]
  - id: slides.edit.redo
    runtime_ref: packages/slides-mcp/src/server.ts
    purpose: Redo the most recently undone edit and recompile Native IR when present.
    safety_boundary: Mutates only deck-spec snapshot state and derived Native IR for the target run.
    required_artifacts: [redone_operation]
  - id: slides.show
    runtime_ref: packages/slides-mcp/src/server.ts:151
    purpose: Return the job-state snapshot for a run_id, including artifact paths.
    safety_boundary: Read-only.
    required_artifacts: [job_state]

deferred_mcp_tools:
  - id: slides.plan
    status: deferred
    gap_ref: GAP-RT-001
    rationale: Awaiting lifecycle granularity (see deferred_cli_commands.slides plan).
  - id: slides.package
    status: deferred
    gap_ref: GAP-RT-004
    rationale: Awaiting delivery-package-contract.
  - id: slides.validate
    status: deferred
    gap_ref: GAP-RT-004
    rationale: Awaiting package-validation-report writer.

safety_rules:
  - rule: CLI, API, and MCP must write the same job-state schema.
    enforced: true
    rationale: Single canonical capability projected across three surfaces (per Constitution Art XI).
  - rule: Edit commands must preserve unselected regions and produce before/after diffs.
    enforced: true
    rationale: editSlide emits EditOperation with diff_summary per packages/slides-core/src/types/index.ts:96-106.
  - rule: API responses must distinguish generated artifact, verified artifact, and planned artifact.
    enforced: true
    rationale: Artifacts carry status enum [planned, created, verified, failed] in job-state.
  - rule: MCP tools cannot read or echo provider secrets.
    enforced: true
    rationale: Provider credentials are read from env by slides-core, never from tool arguments (packages/slides-mcp/src/server.ts safety boundary).
  - rule: MCP tools cannot bypass source-of-truth policy.
    enforced: true
    gap_ref: GAP-RT-012
    runtime_ref:
      - packages/slides-core/src/evidence/source-of-truth.ts
      - packages/slides-core/src/pipeline.ts#editSlide
      - packages/slides-core/src/pipeline.ts#exportPptx
      - apps/squad-engine/src/routes/rest/slides.route.ts  # 422 on SourceOfTruthViolation
    rationale: >
      SOT policy gate (enforceSourceOfTruth) reads JobState.source_of_truth_policy
      and rejects data-driven claims (stat/trend/comparison/quote) without
      evidence_refs when policy=evidence_required. Wired at edit and export
      boundaries (PR-4b GAP-RT-012). REST surface returns 422
      SourceOfTruthViolation; MCP surface throws structured error.
  - rule: MCP tools cannot bypass render-lock.
    enforced: partial
    gap_ref: GAP-RT-013
    runtime_ref:
      - packages/slides-core/src/render-lock/enforce.ts
      - packages/slides-core/src/render-lock/types.ts
      - packages/slides-core/src/pipeline.ts#editSlide
      - packages/slides-core/src/pipeline.ts#generate
    rationale: >
      Render-lock module wired at generate() (writes render-lock.yaml),
      editSlide() (consults before mutation) and exportPptx() (final
      defense before render). enforceRenderLock throws RenderLockViolation
      on theme/typography drift and textual forbidden-feature matches. REST
      surface returns 412 Precondition Failed; MCP surface throws structured
      tool error with code "render_lock_violation". Scope is partial:
      forbidden-token textual detection is implemented; per-slot override
      checks and deep PPTX validation remain deferred to renderer integration
      in Wave 4.
  - rule: Export commands must return a blocker when verification fails.
    enforced: true
    gap_ref: GAP-RT-003
    runtime_ref:
      - packages/slides-core/src/export/verify.ts
      - packages/slides-core/src/pipeline.ts#exportPptx
    rationale: >
      packages/slides-core/src/export/verify.ts verifies existence, non-zero
      size, readable header, and PPTX (zip) signature post-render and emits
      `export-report.yaml` atomically (tmp → rename per
      concurrent-writer-atomic-write rule). exportPptx() throws
      ExportVerificationError on any failed check; generate() records the
      failure into JobState.errors and omits export_report_path so callers
      can detect partial success without surfacing a fake "completed" job.
  - rule: Batch jobs must be resumable or fail with structured errors.
    enforced: true
    gap_ref: GAP-RT-014
    runtime_ref:
      - packages/slides-core/src/batch/index.ts
    rationale: >
      runBatch() persists a per-sub-job checkpoint atomically after every
      state change; re-running the same batch_id skips terminal sub-jobs
      (completed → skipped_resumed). Failures aggregate into structured
      errors[] (code+message+sub_id) and the batch continues
      (continue_on_error per jobs.yaml). runRegression() enforces
      block_if_missing:[failure_modes] with a structured
      regression_missing_failure_modes error (continue_on_error:false).
      Closed in PR-W3e (Wave 3).

quality_gates:
  pass_if:
    - every_api_route_maps_to_cli_or_mcp_runtime
    - every_mcp_tool_has_safety_boundary
    - shared_job_lifecycle_has_terminal_states
    - each_command_declares_required_inputs_and_outputs
    - every_deferred_field_or_route_references_a_gap_id
    - export_success_writes_verified_export_report   # GAP-RT-003 closed in PR-4b
    - every_edit_records_diff_type_and_qa_rerun_set   # GAP-RT-009 closed; GAP-RT-010 partial (classification done; gate execution deferred to QA pipeline integration, Wave 4)
    - generate_writes_delivery_manifest_and_stage_artifacts   # GAP-RT-004+005 closed in PR-W3b
  block_if:
    - automation_surface_without_job_state
    - write_tool_without_safety_boundary
    - api_route_without_runtime_ref
    - deferred_item_without_gap_ref
    - safety_rule_marked_enforced_without_runtime_backing

deferred_quality_gates:
  - gate: api_route_without_cli_equivalent
    status: deferred
    gap_ref: GAP-RT-EXTRA-001
    rationale: >
      /slides/ingest exists in REST but not CLI; pursuing strict parity is
      Wave-2 follow-up. Until then, allowed asymmetry is documented in
      deferred_cli_commands.
  # GAP-RT-003 closed in PR-4b (Wave 2). The export verification gate is now
  # enforced via packages/slides-core/src/export/verify.ts and emits an
  # export-report.yaml sidecar per export. Gate promoted to active list.

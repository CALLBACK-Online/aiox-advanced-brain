version: 2
status: alternate_topology
topology: html_browser_render
current_runtime_topology: ir_native_pptxgenjs
activation_condition: >
  When slides are HTML/CSS-authored by humans (not programmatically
  generated). The canonical runtime ships DeckSpec → compileNativeIR →
  PptxGenJS (no browser, deterministic, native PPTX editable). This contract
  preserves the HTML→browser→PPTX topology as a documented alternative for
  the HTML-authored-deck future use case; it is NOT active in the shipping
  runtime.

changelog:
  - version: 2
    date: 2026-05-19
    summary: >
      Marked as alternate topology per Decision #2 Option A (UNANIMOUS 6/6).
      Native IR via PptxGenJS is canonical. This contract preserved for
      future HTML-authored deck use case; activation_condition explicit.
    references:
      - docs/architecture/roundtable-slide-creator-alignment-2026-05-19.md
      - docs/architecture/ADR-SLDC-CT-002-html-to-pptx-alternate.md
      - docs/audits/slide-creator-runtime-audit-2026-05.md  # CT-9
      - packages/slides-renderer/src/pptx/render.ts  # canonical render path
  - version: 1
    date: 2026-04
    summary: >
      Original aspirational HTML→browser→PPTX contract. Predates Native IR
      pipeline shipping. Marked alternate after CT-9 audit confirmed zero
      runtime references (Wave-1 audit 2026-05).

runtime_jobs:
  - id: html_to_pptx_render_contract
    mode: render_export
    status: alternate_topology
    activation_condition: >
      Activated only when slides are authored as HTML/CSS before PowerPoint
      export. Not used by the canonical generate / export pipeline.
    pick_when:
      - Slides are authored as HTML/CSS before PowerPoint export.
      - User needs editable PPTX/PDF after visual-first slide design.
      - A wireframe or browser-rendered deck must become a deliverable deck.
    inputs:
      - html_slide_pages
      - slide_aspect_ratio
      - theme_tokens
      - export_format
    steps:
      - render_each_slide_in_browser
      - lock_deck_dimensions_from_first_slide
      - extract_placeholders_and_named_regions
      - convert_text_images_shapes_tables_and_backgrounds
      - rasterize_css_that_pptx_cannot_represent
      - check_overflow_and_bottom_margin
      - export_pptx_or_pdf
      - inspect_rendered_output
    outputs:
      - converted_pptx
      - converted_pdf
      - placeholder_map
      - overflow_report
      - rasterization_report
    failure_policy:
      continue_on_error: false
      block_if_missing:
        - slide_aspect_ratio
        - html_slide_pages
    absorbed_from:
      - PPTAgent/deeppresenter/html2pptx/html2pptx.js
      - powerpoint-skill/check_overlaps.py
      - Presenton/presentation-export

conversion_rules:
  dimensions:
    - First slide defines canonical width and height.
    - Every later slide must match dimensions or declare an intentional format change.
    - Do not allow viewport-dependent text scaling to change slide geometry.
  placeholders:
    selector: ".placeholder"
    required_metadata:
      - name
      - x
      - y
      - width
      - height
    use_when:
      - A later agent or user may replace chart, image, quote, logo, or table content.
  text:
    - Preserve font family, weight, size, alignment, color, and line spacing when supported.
    - Block export if text exceeds region bounds and cannot be reduced without losing hierarchy.
    - Keep at least 0.5in bottom safety margin for presenter display and PDF export.
  rasterization:
    rasterize_when:
      - gradient_or_shadow_is_core_to_visual
      - complex_css_has_no_pptx_equivalent
      - browser_render_is_more_faithful_than_native_shape
    do_not_rasterize_when:
      - text_must_remain_editable
      - chart_data_must_remain_editable
      - simple_shape_can_be_native
  tables:
    - Use native table only when editing matters and styling is simple.
    - Use image snapshot when table is a designed artifact or contains complex visual formatting.

qa_requirements:
  - No slide may export with clipped title, chart, CTA, or source label.
  - HTML screenshot and exported PDF/PPTX preview must be visually comparable.
  - Export report must list every rasterized element and why it was rasterized.

# --------------------------------------------------------------------------
# Alternate topology notes (per ADR-SLDC-CT-002, 2026-05-19)
# --------------------------------------------------------------------------
# The canonical shipping pipeline does NOT consume this contract.
# Runtime render path: packages/slides-renderer/src/pptx/render.ts
#                       (DeckSpec → compileNativeIR → PptxGenJS)
#
# To reactivate this topology in a future iteration, a build-out story must:
#   1. Add a Chromium-backed render service (or headless browser worker).
#   2. Re-classify html_to_pptx_render_equivalence from
#      runtime-gap-absorption-corpus.yaml#render_pptx.alternate_topology_optional
#      back to .must_build, paired with an ADR superseding ADR-SLDC-CT-002.
#   3. Wire a new selector at generate-time to choose Native IR vs html-to-pptx
#      based on input_kind (programmatic vs. HTML-authored).
# --------------------------------------------------------------------------

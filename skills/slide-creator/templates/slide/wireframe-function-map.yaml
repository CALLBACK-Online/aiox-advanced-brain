  total_wireframes: 58
  mapped: 58
  unmapped: 0
  pure_contract_functions: >
    function-library entries with 0 wireframes are valid (pure narrative
    functions composed from primitives, not a dedicated wireframe). They are
    NOT a gap. Examples: reframe_contrast, offer_stack — composed via slots,
    no standalone wireframe.

extractor_integration:
  note: >
    PR-2 schema extractor (templates/scripts/extract-wireframe-schemas.js)
    should resolve function_ref via this map's wireframes[].primary_function
    instead of filename↔id heuristic. This eliminates the 734 false-positive
    x-aiox.warnings. Re-running the extractor after wiring this map turns
    warnings → resolved function_ref. Tracked as PR-W3i closure.

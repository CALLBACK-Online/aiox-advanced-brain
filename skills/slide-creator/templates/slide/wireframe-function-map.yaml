version: 1
name: wireframe-function-map
purpose: >
  Explicit N:M map between wireframes/*.html (58 concrete visual layouts) and
  function-library.yaml slide_templates (60 narrative function entries).

  ROOT-CAUSE FIX for PR-W3i / finding F-2: the PR-2 schema extractor produced
  734 "warnings" by cross-referencing wireframe FILENAME against
  function-library ID expecting a 1:1 match. The relationship is N:M by
  design — a narrative function (hook_hero_claim) can render via several
  wireframes; a wireframe (gallery) can serve several functions. The warnings
  were false positives from a wrong join key, NOT untyped wireframes.

  This map is the canonical join. The schema extractor (PR-2) and any
  selective-regen / QA-rerun routing should resolve wireframe→function via
  THIS file, not via filename heuristics.

contract:
  join_semantics: N:M
  authoritative_for:
    - wireframe → function resolution (schema extractor PR-2)
    - function → candidate wireframes (selective regen)
  rules:
    - Every wireframe MUST map to >= 1 function-library id.
    - A function-library id MAY have 0 wireframes (pure-contract function)
      OR many.
    - primary_function is the dominant narrative use; also_serves lists
      secondary uses. Both reference function-library.yaml#slide_templates[].id.
    - If a wireframe genuinely fits no existing function, that is a
      function-library GAP (add the function), NOT a reason to invent a
      filename-keyed entry. extraction-no-fallbacks applies.

# 58 wireframes mapped. primary_function + also_serves reference
# function-library.yaml#slide_templates[].id (semantic narrative ids).

  - id: pixel-art
    label: "Pixel Art"
    description: "8-bit / 16-bit retro game aesthetic. Sharp pixel grid, limited palette, no anti-aliasing. Used for gaming decks, retro tech decks, nostalgic content, and game-flavored education/entertainment."
    use_cases:
      - gaming_decks
      - retro_tech_decks
      - nostalgic_content
      - game_flavored_education
    keywords: [pixel, 8bit, 16bit, nes, snes, arcade, retro_game, nostalgic, playful]
    visual_characteristics:
      line_quality: "Pixel-stepped — outlines built from individual pixels, no smooth lines"
      texture: "None beyond the pixel grid itself"
      depth: "Achieved through palette layering (lighter top pixels, darker bottom for shading)"
      material: "Pixel grid"
      mood: "Nostalgic, retro-game, playful"
    ai_prompt_hints:
      - "Strict pixel-grid alignment, no anti-aliasing"
      - "Limited retro palette — typically 16-32 distinct colors total"
      - "Optional 1-pixel outlines in darker shades of fill color"
    upstream_ref: "https://github.com/hugohe3/ppt-master/blob/3dab7baa30d9aab6bd8607f1ed06a3d1a5c4c9af/skills/ppt-master/references/image-renderings/pixel-art.md"


      - childrens_content
      - storybook_brand_narratives
      - healing_themes
      - fairy_tale_whimsical
    keywords: [ghibli, disney, hand_drawn, dreamy, magical, storybook, comforting, atmospheric]
    visual_characteristics:
      line_quality: "Soft hand-drawn outlines or no outlines, with painterly fills inside"
      texture: "Subtle painterly brush quality + atmospheric softness"
      depth: "Strong atmospheric perspective — distant elements paler and softer"
      material: "Hand-painted animation cel"
      mood: "Dreamy, magical, comforting, storybook"
    ai_prompt_hints:
      - "Warm slightly desaturated palette — pastel skies, soft greens, warm earth tones"
      - "Dreamy lighting — soft window light, golden-hour glow, gentle morning haze"
      - "Stylized friendly cartoon characters — large expressive eyes, simplified anatomy"
    upstream_ref: "https://github.com/hugohe3/ppt-master/blob/3dab7baa30d9aab6bd8607f1ed06a3d1a5c4c9af/skills/ppt-master/references/image-renderings/fantasy-animation.md"

  - id: flat
    label: "Flat"
    description: "Modern flat design with bolder geometric blocks than vector-illustration. More design-forward, slightly more decorative confidence. Used when a deck wants to feel brand-aware rather than purely utilitarian."
    use_cases:
      - product_launch_decks
      - marketing_decks
      - brand_aware_decks
    keywords: [flat, geometric, brand_aware, designed, intentional, color_blocks]
    visual_characteristics:
      line_quality: "Often no outlines; when used, thin uniform stroke as accent only"
      texture: "None — flat color blocks"
      depth: "Through layered overlap and color contrast, not shadow"
      material: "Flat — color is brand identity, not material"
      mood: "Designed, intentional, slightly more expressive than vector-illustration"
    ai_prompt_hints:
      - "Bold geometric blocks — circles, rectangles, triangles, rounded squares"
      - "Confident solid color blocks with deliberate juxtaposition"
      - "Subtle layered overlap creates flat depth without shadows"
    upstream_ref: "https://github.com/hugohe3/ppt-master/blob/3dab7baa30d9aab6bd8607f1ed06a3d1a5c4c9af/skills/ppt-master/references/image-renderings/flat.md"

  - id: glassmorphism
    label: "Glassmorphism"
    description: "Frosted-glass / soft-UI aesthetic — translucent layered panels, blurred background, soft shadows, depth via transparency. The modern app UI rendering — used for modern SaaS, fintech, health-tech, premium app showcases, product launches."
    use_cases:
      - modern_saas
      - fintech
      - health_tech
      - premium_app_showcases
      - product_launches
    keywords: [glass, frosted, translucent, fintech, premium, polished, futuristic, apple_style]
    visual_characteristics:
      line_quality: "Thin 1px highlight strokes on panel top/left edges (glass refraction cue)"
      texture: "Frosted blur on panels (gaussian blur ~10-15px over background)"
      depth: "Real layered depth — large soft drop shadows, parallax-suggesting offsets"
      material: "Translucent polished glass on soft gradient background"
      mood: "Premium, polished, futuristic-friendly, optimistic"
    ai_prompt_hints:
      - "Layered semi-transparent panels (~40-60% opacity) with frosted glass blur"
      - "Soft pastel-cool background gradient blurs through panels"
      - "Large soft drop shadows under panels (15-25% opacity, generous spread)"
      - "Mid-light tones recommended — heavy saturation feels off"
    upstream_ref: "https://github.com/hugohe3/ppt-master/blob/3dab7baa30d9aab6bd8607f1ed06a3d1a5c4c9af/skills/ppt-master/references/image-renderings/glassmorphism.md"

  - id: ink-notes
    label: "Ink Notes"
    description: "Pure white paper, black ink, sparse semantic color accents — the Mike Rohde sketchnote tradition. Sharper, more professional, more manifesto than sketch-notes. Used for methodology, Before-After essays, mindset-shift narratives, technical manifestos, professional visual-note style."
    use_cases:
      - methodology_decks
      - before_after_essays
      - mindset_shift_narratives
      - technical_manifestos
      - professional_visual_notes
    keywords: [sketchnote, mike_rohde, ink, manifesto, professional, sparse_color]
    visual_characteristics:
      line_quality: "Black ink with slight wobble; confident medium weight"
      texture: "Pure white background; no paper grain"
      depth: "Flat"
      material: "Pen-on-paper"
      mood: "Professional, considered, manifesto"
    ai_prompt_hints:
      - "Pure white #FFFFFF background, black ink dominates ~85% of visible content"
      - "1-2 semantic accent colors (coral red risk, muted teal positive, dusty lavender neutral)"
      - "Accent colors cover less than 10% of canvas combined"
    upstream_ref: "https://github.com/hugohe3/ppt-master/blob/3dab7baa30d9aab6bd8607f1ed06a3d1a5c4c9af/skills/ppt-master/references/image-renderings/ink-notes.md"

  - id: minimalist-swiss
    label: "Minimalist Swiss"
    description: "Swiss-grid / Bauhaus-adjacent visual discipline. Grid-locked geometry, generous negative space, sans-serif typographic character, no decoration. The most restrained rendering — used for high-end consulting, architecture, design firms, luxury brands, type foundries."
    use_cases:
      - high_end_consulting
      - architecture_firms
      - design_firms
      - luxury_brands
      - type_foundries
    keywords: [swiss, bauhaus, grid, helvetica, vignelli, muller_brockmann, austere, academic]
    visual_characteristics:
      line_quality: "Single uniform stroke weight; mathematically straight or perfectly circular"
      texture: "None — flat fills only"
      depth: "None — strictly 2D; no shadows, no perspective"
      material: "None — color is conceptual zone"
      mood: "Rigorous, considered, austere, academic"
    ai_prompt_hints:
      - "Composition built on visible or implied modular grid"
      - "Single accent appears at one rule-of-thirds intersection only"
      - "No gradients, no shadows, no texture, no decoration"
    upstream_ref: "https://github.com/hugohe3/ppt-master/blob/3dab7baa30d9aab6bd8607f1ed06a3d1a5c4c9af/skills/ppt-master/references/image-renderings/minimalist-swiss.md"


styles:
  - id: 3d-isometric
    label: "3D Isometric"
    description: "Isometric 3D forms with controlled depth — boxes, layers, devices, stacks rendered in 30°/30°/30° projection. The dominant choice for tech architecture, product structure, and system composition visuals."
    use_cases:
      - tech_architecture
      - product_structure
      - system_composition
      - saas_product_diagrams
      - cloud_architecture
    keywords: [isometric, 3d, modular, tech, stackable, cloud, architecture, blocks]
    visual_characteristics:
      line_quality: "Thin uniform edges, or no edges relying on color contrast"
      texture: "None on surfaces — flat fills"
      depth: "True isometric projection (30°/30°/30°), tonal shading on shadowed faces, optional 8% drop shadow under floating elements"
      material: "Flat with tonal shading — not glossy, not photorealistic"
      mood: "Technical, modular, contemporary"
    ai_prompt_hints:
      - "30°/30°/30° true isometric projection"
      - "Flat solid fills with 15% darker shadowed-face tonal shift"
      - "Soft 8% drop shadow under floating elements"
    upstream_ref: "https://github.com/hugohe3/ppt-master/blob/3dab7baa30d9aab6bd8607f1ed06a3d1a5c4c9af/skills/ppt-master/references/image-renderings/3d-isometric.md"

  - id: blueprint
    label: "Blueprint"
    description: "Technical schematic aesthetic — clean lines on a grid, monospace cues, restrained color. Conveys engineering precision and analytical depth. Used for architecture diagrams, AI systems, engineering decks, technical deep-dives."
    use_cases:
      - architecture_diagrams
      - ai_system_design
      - engineering_decks
      - technical_deep_dives
    keywords: [schematic, grid, engineering, precision, monochrome, analytical]
    visual_characteristics:
      line_quality: "Crisp uniform stroke, often 1-1.5px feel; perfectly straight or precisely curved"
      texture: "None; optional very-low-opacity grid background"
      depth: "Flat — schematic, not perspectival"
      material: "None — abstract schematic"
      mood: "Analytical, engineering-precise, restrained"
    ai_prompt_hints:
      - "Crisp 1.5px uniform stroke schematic lines"
      - "Subtle grid pattern at 5-8% opacity reinforces blueprint feel"
      - "Right-angle routing with small dot anchors at junctions"
    upstream_ref: "https://github.com/hugohe3/ppt-master/blob/3dab7baa30d9aab6bd8607f1ed06a3d1a5c4c9af/skills/ppt-master/references/image-renderings/blueprint.md"

  - id: chalkboard
    label: "Chalkboard"
    description: "Chalk on a dark green or black board — classroom aesthetic. Used in teaching-focused decks, tutorials, school / academic content, retro educational atmosphere."
    use_cases:
      - teaching_focused_decks
      - tutorials
      - school_academic_content
      - retro_educational
    keywords: [classroom, chalk, slate, instructional, nostalgic, pedagogy]
    visual_characteristics:
      line_quality: "Soft chalk strokes with slightly diffused edges, dry-medium look"
      texture: "Visible chalk-dust grain at 15-25% opacity across the board"
      depth: "Flat"
      material: "Slate board (dark green or near-black) + chalk"
      mood: "Nostalgic, instructional, classroom-warm"
    ai_prompt_hints:
      - "Dark slate green #1F3A2E or near-black #1A1A1A background"
      - "White chalk dominates with sparing pastel accents (yellow, soft pink, light cyan)"
      - "Chalk-dust grain at 15-25% opacity"
    upstream_ref: "https://github.com/hugohe3/ppt-master/blob/3dab7baa30d9aab6bd8607f1ed06a3d1a5c4c9af/skills/ppt-master/references/image-renderings/chalkboard.md"

  - id: corporate-photo
    label: "Corporate Photo"
    description: "Editorial photography style — real subjects, natural composition, professional grading. The only rendering where photorealism is intentional. Used for team photos, lifestyle shots, product photography, real-world scenarios."
    use_cases:
      - team_photos
      - lifestyle_shots
      - product_photography
      - real_world_scenarios
    keywords: [photography, editorial, photorealism, depth_of_field, magazine_quality]
    visual_characteristics:
      line_quality: "N/A — photographic"
      texture: "Natural — skin, fabric, environment textures preserved"
      depth: "True depth-of-field — subject sharp, background subtly blurred"
      material: "Real-world physical materials, professionally lit"
      mood: "Authentic, premium, magazine-editorial"
    overrides_global_rules:
      - "OVERRIDES image-generator.md §5.2 (simplified silhouettes / no realistic faces) for this rendering only"
    ai_prompt_hints:
      - "Rule of thirds, leading lines, deliberate foreground/background separation"
      - "Natural or studio-soft lighting, never harsh"
      - "Color grading matches deck palette temperament"
    upstream_ref: "https://github.com/hugohe3/ppt-master/blob/3dab7baa30d9aab6bd8607f1ed06a3d1a5c4c9af/skills/ppt-master/references/image-renderings/corporate-photo.md"

  - id: digital-dashboard
    label: "Digital Dashboard"
    description: "Polished UI / data-visualization aesthetic. The image looks like a screenshot of a product or analytics dashboard — clean cards, soft shadows, restrained type, chart-like visual elements. Used in SaaS demos, data product showcases, B2B analytics decks."
    use_cases:
      - saas_demos
      - data_product_showcases
      - b2b_analytics_decks
    keywords: [ui, dashboard, cards, kpi, charts, saas, analytics, product_screenshot]
    visual_characteristics:
      line_quality: "No outlines on cards; chart elements use thin uniform strokes (1-1.5px feel)"
      texture: "None — clean digital surfaces"
      depth: "Uniform 8% soft drop shadows under cards; no inset/raised effects"
      material: "Flat with deliberate elevation hierarchy via shadows"
      mood: "Polished, restrained, product-fluent"
    ai_prompt_hints:
      - "Rounded corners 8-12px radius on cards"
      - "Uniform 8% opacity soft drop shadows with slight Y-offset"
      - "Chart elements stylized — recognizable without specific data values"
    upstream_ref: "https://github.com/hugohe3/ppt-master/blob/3dab7baa30d9aab6bd8607f1ed06a3d1a5c4c9af/skills/ppt-master/references/image-renderings/digital-dashboard.md"

  - id: editorial
    label: "Editorial"

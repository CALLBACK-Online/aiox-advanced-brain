    upstream_ref: "https://github.com/hugohe3/ppt-master/blob/3dab7baa30d9aab6bd8607f1ed06a3d1a5c4c9af/skills/ppt-master/references/image-renderings/nature.md"

  - id: paper-cut
    label: "Paper Cut"

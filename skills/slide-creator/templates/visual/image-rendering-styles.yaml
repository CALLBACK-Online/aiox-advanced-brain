      - journalism
      - explainers
      - opinion_pieces
      - sophisticated_b2b
    keywords: [magazine, editorial, sophisticated, restrained, premium, intelligent]
    visual_characteristics:
      line_quality: "Refined — thin precise rules as dividers; clean filled shapes"
      texture: "Minimal — optional very subtle paper grain at 5-10% opacity"
      depth: "Flat with intentional layering; no shadows"
      material: "None — abstract editorial composition"
      mood: "Refined, intelligent, premium-restrained"
    ai_prompt_hints:
      - "One dominant focal area, deliberate alignment to invisible columns"
      - "Restrained palette — one rich brand tone, one neutral, one subtle accent"
      - "Duotone or limited-color treatment reinforces magazine feel"
    upstream_ref: "https://github.com/hugohe3/ppt-master/blob/3dab7baa30d9aab6bd8607f1ed06a3d1a5c4c9af/skills/ppt-master/references/image-renderings/editorial.md"


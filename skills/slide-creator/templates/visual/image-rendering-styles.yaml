  - id: vector-illustration
    label: "Vector Illustration"
    description: "The default safe rendering for general PPT decks. Clean flat vector art with bold shapes, deliberate geometry, and confident negative space. Scales reliably across 15+ slide decks without visual fatigue."
    use_cases:
      - general_ppt_decks
      - product_saas_contexts
      - design_system_aesthetic
    keywords: [default, safe, vector, flat, design_system, professional, scalable]
    visual_characteristics:
      line_quality: "Clean vector outlines, uniform stroke weight, sharp corners or consistent rounded radius"
      texture: "None — flat fills only. No noise, no paper grain, no painterly artifacts"
      depth: "Optional 8% soft drop shadow under elevated elements; no perspective rendering"
      material: "None — color is information, not material simulation"
      mood: "Neutral-positive, professional, designed"
    ai_prompt_hints:
      - "Crisp 1.5-2px equivalent stroke weight consistent across all elements"
      - "Flat blocks of color — no gradients within shapes"
      - "Grid-aware composition with deliberate negative space"
    upstream_ref: "https://github.com/hugohe3/ppt-master/blob/3dab7baa30d9aab6bd8607f1ed06a3d1a5c4c9af/skills/ppt-master/references/image-renderings/vector-illustration.md"


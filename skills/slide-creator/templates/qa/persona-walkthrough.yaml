version: 1
name: persona-walkthrough-gate
purpose: >
  Post-render persona walkthrough of the deck to catch red flags before delivery.
  Simulates 2-3 personas reading the deck linearly and reports specific friction
  points (jargão, falta de help, ordem ilógica, missing context for newcomers).
authority: ".claude/rules/design-absolute-bans.md (cross-fit)"
absorbed_from: "impeccable.style v3.1.1 — /critique persona red-flag review (reference/personas.md, critique.md)"
created: "2026-05-19"

selection_rules:
  min_personas: 2
  max_personas: 3
  rule: |
    Auto-select 2-3 personas based on deck.register, audience, and surface type.
    If briefing-normalized.audience is specific (e.g. "Founders Series B"),
    add 1 project-specific persona to the canonical pool.

canonical_personas:

  alex_power_user:
    archetype: "Power user / experienced operator"
    primary_attributes:
      - "Already knows the domain"
      - "Wants speed, density, keyboard-first"
      - "Skims for novelty, skips known context"
    red_flag_checklist:
      - id: alex_01_no_density
        check: "Deck dilutes known context across 3+ slides instead of compressing"
        severity: P2
      - id: alex_02_no_novelty_marker
        check: "No clear marker telling them what's NEW or DIFFERENT"
        severity: P1
      - id: alex_03_forced_onboarding
        check: "Forced step-by-step explanation of basics they already know"
        severity: P1
      - id: alex_04_no_data_for_pros
        check: "Numbers/benchmarks are absent or watered down for novices"
        severity: P2

  jordan_first_timer:
    archetype: "First-timer / domain newcomer"
    primary_attributes:
      - "Needs context, definitions, scaffolding"
      - "Will abandon at first jargon block"
      - "Reads linearly, doesn't skip ahead"
    red_flag_checklist:
      - id: jordan_01_jargon_unexplained
        check: "Slide uses technical term without first-use definition"
        severity: P0
      - id: jordan_02_acronym_unexpanded
        check: "Acronym appears without expansion at first use (TLA, MAU, ICP, etc)"
        severity: P0
      - id: jordan_03_missing_why
        check: "Slide jumps to 'how' without explaining 'why this matters'"
        severity: P1
      - id: jordan_04_no_visual_anchor
        check: "Section opens with 5+ lines of text and no visual"
        severity: P2

  sam_skeptic:
    archetype: "Skeptical evaluator / decision gate"
    primary_attributes:
      - "Demands proof for every claim"
      - "Looks for hidden costs / fine print"
      - "Has alternative options in mind"
    red_flag_checklist:
      - id: sam_01_unsupported_claim
        check: "Claim slide has no evidence, citation, or proof block"
        severity: P0
      - id: sam_02_no_comparison
        check: "No comparison vs alternatives (status quo, competitor, prior solution)"
        severity: P1
      - id: sam_03_hidden_cost
        check: "Cost/effort discussion missing or buried in appendix"
        severity: P1
      - id: sam_04_no_risk_reversal
        check: "Offer has no guarantee / refund / pilot terms"
        severity: P1

  maria_executive:
    archetype: "Time-constrained executive"
    primary_attributes:
      - "Reads cover + last slide first"
      - "Will skim middle, skip appendix"
      - "Wants outcome + ask in <30s"
    red_flag_checklist:
      - id: maria_01_no_action_title
        check: "Slide titles describe topic, not outcome ('Sales pipeline' vs 'Sales pipeline grew 47% in Q3')"
        severity: P0
      - id: maria_02_buried_ask
        check: "Final CTA is implicit or appears after slide 12"
        severity: P0
      - id: maria_03_no_executive_summary
        check: "No 1-slide executive summary at the top OR last-slide recap"
        severity: P1
      - id: maria_04_density_unread
        check: "Slide has > 80 visible words across 3+ blocks"
        severity: P2

  luis_practitioner:
    archetype: "Hands-on practitioner who has to implement"
    primary_attributes:
      - "Wants concrete steps, owners, dates"
      - "Skeptical of abstraction"
      - "Needs decision authority + budget context"
    red_flag_checklist:
      - id: luis_01_abstract_action
        check: "CTA is 'start exploring' / 'consider X' instead of '{verb} by {date}'"
        severity: P0
      - id: luis_02_no_owner
        check: "Plan/roadmap slide lacks named owner or RACI"
        severity: P1
      - id: luis_03_no_budget_proxy
        check: "Resource cost (time, team-size, $) absent from implementation slides"
        severity: P1

  noah_translator:
    # RT-FIX-5 (@design-chief 2026-05-19): added linguistic-diverse persona
    # AIOX/AllFluence/AIOX decks misturam PT-BR + EN + jargão técnico.
    # Frases tipo "We empower founders to unlock seamless DevOps" passam por todas
    # 5 personas anteriores. Esta persona é o último filtro de language clarity.
    archetype: "Non-native English reader / translator / PT-BR-first audience"
    primary_attributes:
      - "Português é primeira língua, lê inglês com atrito"
      - "Para em jargão não-traduzido"
      - "Confunde cognatos falsos (assist/assistir, pretend/pretender)"
      - "Não conhece referências culturais US/UK específicas"
    red_flag_checklist:
      - id: noah_01_untranslated_jargon
        check: "Slide mixes EN technical terms in PT-BR copy without inline parenthetical translation (e.g., 'fazer onboarding' OK; 'unleash empowerment' NOT OK)"
        severity: P0
      - id: noah_02_mixed_language_unintentional
        check: "Same paragraph switches between PT-BR and EN without semantic reason (not bilingual deck, just sloppy)"
        severity: P1
      - id: noah_03_false_cognates_unflagged
        check: "Uses 'assist/assist' (assistir = watch, not help), 'pretend/pretender' (pretender = intend, not fake), 'realize/realizar' (realizar = perform, not understand) — pattern of false cognates"
        severity: P1
      - id: noah_04_cultural_reference_unanchored
        check: "Cultural reference (sports, holidays, slang) specific to single country/region without context (e.g., 'Hail Mary moment', 'Black Friday tactics' without explanation)"
        severity: P2
      - id: noah_05_idiom_literal_translation
        check: "Idiom translated literally (e.g., 'puxar o tapete' literally rendered as 'pull the rug' in EN copy, or vice versa)"
        severity: P1
      - id: noah_06_acronym_in_other_language
        check: "Acronym expands to different words in PT-BR vs EN context (e.g., 'CRM' OK both; 'TLA' = Three-Letter Acronym US-specific) and uses second meaning without flagging"
        severity: P2

selection_table:
  # Default selections per workflow_mode. RT-FIX-5 2026-05-19: noah_translator
  # added as conditional persona for PT-BR-first audiences or bilingual decks.
  brand_pitch_deck: [maria_executive, sam_skeptic, jordan_first_timer]
  product_strategy: [alex_power_user, sam_skeptic, maria_executive]
  board_update:     [maria_executive, sam_skeptic]
  sales_pitch:      [sam_skeptic, maria_executive, jordan_first_timer]
  webinar:          [jordan_first_timer, alex_power_user, maria_executive]
  educational_course: [jordan_first_timer, luis_practitioner]
  dashboard_review: [alex_power_user, luis_practitioner]
  financial_deck:   [sam_skeptic, maria_executive]
  marketing_campaign: [jordan_first_timer, maria_executive]
  benchmark_deck:   [sam_skeptic, alex_power_user]

conditional_personas:
  # RT-FIX-5 2026-05-19: Auto-add noah_translator when audience or output suggests
  # multilingual / PT-BR-first reading context.
  noah_translator:
    auto_add_when:
      - "briefing.audience contains 'PT-BR' OR 'brasil' OR 'brazilian'"
      - "briefing.audience contains 'multilingual' OR 'bilíngue' OR 'bilingual'"
      - "deck.output_language in ['pt-BR', 'pt-br', 'portuguese']"
      - "operator language profile is PT-BR (from .aiox/active-operator.yaml)"
    add_to_selected_personas: true
    max_persona_count_override: 4   # bypass default 3 cap when noah added

walkthrough_protocol:
  step_01_load_personas: "Read selection_table.<workflow_mode>, fallback to [maria_executive, sam_skeptic, jordan_first_timer] if unknown"
  step_02_load_project_personas: "If briefing.audience contains explicit persona description, generate 1 project-specific persona with custom red-flag list"
  step_03_simulate_walkthrough: |
    For each persona, traverse deck in order (cover → CTA).
    For each slide, run all red_flag_checklist items.
    Emit findings as: { persona_id, slide_id, red_flag_id, severity, evidence, fix_suggestion }
  step_04_summarize: |
    Group findings by persona. Report:
    - Total red flags per persona
    - P0 count (blocks delivery)
    - Top 3 most actionable fixes per persona
  step_05_gate_decision:
    block_if_any_persona_has:
      - "P0 count >= 2"
      - "OR P0 + P1 count >= 4"
    warn_if:
      - "Any persona has 1 P0 OR 3+ P1"
    pass_if:
      - "All personas have 0 P0 AND <= 2 P1"

output_schema:
  file: "qa/persona-walkthrough-report.yaml"
  schema_example:
    persona_walkthrough:
      personas_selected: [maria_executive, sam_skeptic, jordan_first_timer]
      project_persona: null
      total_red_flags: 7
      p0_count: 1
      p1_count: 4
      p2_count: 2
      blocking: false
      warnings: 2
      findings:
        - persona_id: maria_executive
          slide_id: s07
          red_flag_id: maria_01_no_action_title
          severity: P0
          evidence: "Slide title: 'Our approach' (topic, not outcome)"
          fix_suggestion: "Rewrite as 'Our approach cuts onboarding time 3 weeks'"
      top_fixes:
        - "Rewrite slide titles as action titles (3 slides affected)"
        - "Add executive summary slide as s02"
        - "Move CTA from s14 to s12 (above the fold for skimmers)"

score_weight: 18
severity: P1

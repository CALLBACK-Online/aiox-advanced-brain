# Each spoke creates a similar file with their own values.

spoke: allfluence
locale: br
workspace_path: "workspace/businesses/allfluence/"

financial_data:
  revenue: "R$7.5M"
  gross_margin: "~53%"
  maas_margin: "50-60%"

team_members:
  - name: "Pedro Valerio"
    role: admin
    permissions: "*"
  - name: "Marcus Prado"
    role: coo
    permissions: "financial, operations"

stack:
  backend: "FastAPI (Python)"
  frontend: "React 19 + TypeScript + TW4"
  database: "Supabase (PostgreSQL)"
  deploy: "Railway + Vercel"

business_type: "TTCX (TikTok Creative Exchange Partner)"

# =============================================================================
# Squad I/O Declaration — c-level
# =============================================================================
# Contrato formal do squad com o workspace e o resto do sistema.
# Managed by CSO. Schema v2.0.
#
# Purpose:
#   1. Gap-Zero Enforcement: *enforce c-level → PASS/BLOCK/WARN
#   2. Cascading STALE: mudanca em input → marca outputs como STALE
#   3. Backup Before Write: tasks que sobrescrevem fazem versao antes
#   4. Task → File Traceability: qual task toca qual arquivo
#   5. Agent → Database Mapping: qual agent carrega qual contexto
#   6. Cross-Domain Wiring: conexoes com apps/, infrastructure/, packages/
# =============================================================================

schema_version: "2.0.0"
squad: c-level
description: "Squad C-Level — executivos estrategicos que estruturam o workspace da empresa"
owner: coo-orchestrator
last_audited: "2026-04-13"
audited_by: sinkra-upgrade-squad
artifacts_produced:
  - business-profile
  - diagnostic-report
  - cross-domain-handoff
  - workspace-health-report
  - workspace-instantiation
  - strategic-assessment

# =============================================================================
# INPUTS — Arquivos que o squad CONSOME
# =============================================================================
# usage types:
#   database  — agent carrega como contexto persistente
#   reference — task le para informar decisoes
#   template  — task usa como base para gerar output
#   trigger   — mudanca nesse arquivo dispara re-execucao

inputs:
  workspace:
    # L0 — Identity (este squad PRODUZ estes, mas tambem os le como input para tasks downstream)
    - path: workspace/{spoke}/L0-identity/company-dna.yaml
      doc_id: L0-001
      min_state: POPULATED
      usage: [reference, database]
      consumed_by_tasks: [elicit-icp-yaml, elicit-brand-yaml, elicit-pricing-strategy, add-product]
      consumed_by_agents: [cmo-architect, vision-chief, coo-orchestrator]

    - path: workspace/{spoke}/L0-identity/founder-dna.yaml
      doc_id: L0-002
      min_state: POPULATED
      usage: [reference, database]
      consumed_by_tasks: [elicit-credentials, elicit-brand-yaml]
      consumed_by_agents: [vision-chief, cmo-architect]

    # L1 — Strategy (inputs para tasks que dependem de docs ja populados)
    - path: workspace/{spoke}/L1-strategy/icp.yaml
      doc_id: L1-001
      min_state: POPULATED
      usage: [reference]
      consumed_by_tasks: [elicit-pricing-strategy, elicit-brand-yaml, add-product]
      consumed_by_agents: [cmo-architect]

    - path: workspace/{spoke}/L1-strategy/bmc.yaml
      doc_id: L1-002
      min_state: POPULATED
      usage: [reference]
      consumed_by_tasks: [elicit-pricing-strategy]
      consumed_by_agents: [cmo-architect]

    - path: workspace/{spoke}/L1-strategy/lean-canvas.yaml
      doc_id: L1-003
      min_state: POPULATED
      usage: [reference]
      consumed_by_tasks: [elicit-pricing-strategy]
      consumed_by_agents: [cmo-architect]

    - path: workspace/{spoke}/L1-strategy/offerbook.yaml
      doc_id: L1-004
      min_state: POPULATED
      usage: [reference]
      consumed_by_tasks: [elicit-pricing-strategy, add-product]
      consumed_by_agents: [cmo-architect]

  # Governance
  registry:
    - path: workspace/{spoke}/document-registry.yaml
      usage: [reference, trigger]
      consumed_by_tasks: [workspace-health-check]
      consumed_by_agents: [cso, coo-orchestrator]

# =============================================================================
# OUTPUTS — Arquivos que o squad PRODUZ ou ATUALIZA
# =============================================================================
# action types:
#   create   — cria arquivo novo (falha se ja existe)
#   update   — sobrescreve arquivo existente
#   upsert   — cria se nao existe, atualiza se existe
#   version  — cria nova versao, mantem historico
#
# backup: true = faz copia antes de sobrescrever (workspace/.backups/)

outputs:
  workspace:
    # L0 — Identity
    - path: workspace/{spoke}/L0-identity/company-dna.yaml
      doc_id: L0-001
      action: upsert
      backup: true
      produced_by_tasks: [elicit-vision]
      produced_by_agents: [vision-chief]
      registry_state_after: POPULATED

    - path: workspace/{spoke}/L0-identity/founder-dna.yaml
      doc_id: L0-002
      action: upsert
      backup: true
      produced_by_tasks: [elicit-founder-dna]
      produced_by_agents: [vision-chief]
      registry_state_after: POPULATED

    - path: workspace/{spoke}/L0-identity/core-processes.yaml
      doc_id: L0-004
      action: upsert
      backup: true
      produced_by_tasks: [elicit-operations]
      produced_by_agents: [coo-orchestrator]
      registry_state_after: POPULATED

    # L1 — Strategy
    - path: workspace/{spoke}/L1-strategy/icp.yaml
      doc_id: L1-001
      action: upsert
      backup: true
      produced_by_tasks: [elicit-icp-yaml]
      produced_by_agents: [cmo-architect]
      registry_state_after: POPULATED

    - path: workspace/{spoke}/L1-strategy/pricing-strategy.yaml
      doc_id: L1-005
      action: upsert
      backup: true
      produced_by_tasks: [elicit-pricing-strategy]
      produced_by_agents: [cmo-architect]
      registry_state_after: POPULATED

    # L2 — Tactical (brand via CMO, handoff to brand-squad for deep work)
    - path: workspace/{spoke}/L2-tactical/brand/brandbook.yaml
      doc_id: L2-001
      action: upsert
      backup: true
      produced_by_tasks: [elicit-brand-yaml]
      produced_by_agents: [cmo-architect]
      registry_state_after: DRAFT
      note: "CMO cria DRAFT inicial, brand-squad promove para POPULATED"

  registry:
    - path: workspace/{spoke}/document-registry.yaml
      action: update
      backup: false
      produced_by_tasks: [workspace-health-check]
      produced_by_agents: [cso, coo-orchestrator]
      note: "Registry e atualizado apos cada elicitacao"

# =============================================================================
# AGENTS — Mapeamento agent → tasks → databases
# =============================================================================

agents:
  - id: coo-orchestrator
    role: "Chief Operating Officer - Orchestrator"
    is_lead: true
    tasks: [bootstrap, load-workspace-context, add-business, setup-workspace, scaffold-templates, setup-business-profile, elicit-operations, elicit-company-profile, elicit-team-structure, workspace-health-check, classify-squad-workspace-fit, etl-local-extract, etl-web-scrape, etl-web-research, etl-generate-artifacts, etl-deep-pass, etl-batch-runner, resolve-squad-workspace-readiness]
    databases:
      - squads/c-level/config.yaml
      - squads/c-level/workflows/workspace-governance.yaml
    reads_at_runtime:
      - workspace/{spoke}/document-registry.yaml

  - id: vision-chief
    role: "Chief Executive Officer"
    tasks: [elicit-vision, elicit-founder-dna, elicit-credentials]
    databases:
      - squads/c-level/examples/business-profile-sample-output.yaml
    reads_at_runtime:
      - workspace/{spoke}/L0-identity/company-dna.yaml
      - workspace/{spoke}/L0-identity/founder-dna.yaml

  - id: cmo-architect
    role: "Chief Marketing Officer"
    tasks: [elicit-icp, elicit-icp-yaml, elicit-brand-yaml, elicit-pricing-strategy, add-product, elicit-product-portfolio, diagnose-offer]
    databases: []
    reads_at_runtime:
      - workspace/{spoke}/L0-identity/company-dna.yaml
      - workspace/{spoke}/L1-strategy/icp.yaml
      - workspace/{spoke}/L1-strategy/bmc.yaml
      - workspace/{spoke}/L1-strategy/lean-canvas.yaml
      - workspace/{spoke}/L1-strategy/offerbook.yaml

  - id: cto-architect
    role: "Chief Technology Officer"
    tasks: [elicit-tech-strategy]
    databases: []
    reads_at_runtime: []

  - id: cio-engineer
    role: "Chief Information Officer"
    tasks: [elicit-tech-stack]
    databases: []
    reads_at_runtime: []

  - id: caio-architect
    role: "Chief AI Officer"
    tasks: [elicit-ai-strategy]
    databases: []
    reads_at_runtime: []

  - id: cso
    role: "Chief Sinkra Officer"
    tasks: [workspace-health-check]
    databases:
      - squads/c-level/config.yaml
    reads_at_runtime:
      - workspace/{spoke}/document-registry.yaml

  - id: vision-strategist
    role: "Vision Strategist (legacy alias)"
    tasks: []
    databases: []
    reads_at_runtime:
      - workspace/{spoke}/L0-identity/company-dna.yaml
      - workspace/{spoke}/L0-identity/founder-dna.yaml
    note: "Alias mantido apenas para compatibilidade; ownership primário migrou para vision-chief"

  - id: cfo-architect
    role: "Chief Financial Officer"
    tasks: []
    databases:
      - squads/c-level/config.yaml
    reads_at_runtime: []
    note: "Financial governance domain — artifact_contracts declared in config.yaml"

  - id: workspace-chief
    role: "Workspace Operations Orchestrator"
    tasks: [elicit-culture, diagnose-business, growth-levers, next-best-action, progress-check, render-context]
    databases:
      - squads/c-level/config.yaml
      - squads/c-level/data/quality-gates.yaml
    reads_at_runtime:
      - workspace/{spoke}/document-registry.yaml
      - workspace/{spoke}/L0-identity/company-dna.yaml
      - workspace/{spoke}/L1-strategy/icp.yaml

# =============================================================================
# TASKS — Mapeamento task → inputs → outputs
# =============================================================================

tasks:
  # --- Bootstrap & Setup ---
  - id: bootstrap
    agent: coo-orchestrator
    inputs: []
    outputs:
      - path: .user/user.md
        action: create
    backup: false
    description: "Cria user.md e estrutura inicial"

  - id: scaffold-templates
    agent: coo-orchestrator
    inputs: []
    outputs:
      - path: "workspace/{spoke}/L0-identity/*.yaml"
        action: create
        note: "Cria PLACEHOLDERs a partir de templates"
      - path: "workspace/{spoke}/L1-strategy/*.yaml"
        action: create
      - path: "workspace/{spoke}/L2-tactical/**/*.yaml"
        action: create
    backup: false
    description: "Scaffolda templates YAML para todo o workspace"

  # --- L0 Elicitation ---
  - id: elicit-vision
    agent: vision-chief
    inputs:
      - path: workspace/{spoke}/L0-identity/company-dna.yaml
        min_state: PLACEHOLDER
        usage: template
    outputs:
      - path: workspace/{spoke}/L0-identity/company-dna.yaml
        doc_id: L0-001
        action: upsert
        backup: true
        registry_state_after: POPULATED
    description: "CEO elicita missao, visao, valores → company-dna.yaml"

  - id: elicit-founder-dna
    agent: vision-chief
    inputs:
      - path: workspace/{spoke}/L0-identity/founder-dna.yaml
        min_state: PLACEHOLDER
        usage: template
      - path: workspace/{spoke}/L0-identity/company-dna.yaml
        min_state: POPULATED
        usage: reference
        optional: true
    outputs:
      - path: workspace/{spoke}/L0-identity/founder-dna.yaml
        doc_id: L0-002
        action: upsert
        backup: true
        registry_state_after: POPULATED
    description: "CEO elicita DNA do fundador → founder-dna.yaml"

  - id: elicit-credentials
    agent: vision-chief
    inputs:
      - path: workspace/{spoke}/L0-identity/founder-dna.yaml
        min_state: POPULATED
        usage: reference
    outputs:
      - path: workspace/{spoke}/L0-identity/credentials.yaml
        action: upsert
        backup: true
        registry_state_after: POPULATED
    description: "CEO elicita credenciais e provas de autoridade"
    note: "Output canônico de credenciais em L0-identity"

  - id: elicit-operations
    agent: coo-orchestrator
    inputs:
      - path: workspace/{spoke}/L0-identity/company-dna.yaml
        min_state: POPULATED
        usage: reference
    outputs:
      - path: workspace/{spoke}/L0-identity/core-processes.yaml
        doc_id: L0-004
        action: upsert
        backup: true
        registry_state_after: POPULATED
    description: "COO elicita estrutura operacional → core-processes.yaml"

  # --- L1 Elicitation ---
  - id: elicit-icp-yaml
    agent: cmo-architect
    inputs:
      - path: workspace/{spoke}/L0-identity/company-dna.yaml
        min_state: POPULATED
        usage: reference
      - path: workspace/{spoke}/L1-strategy/icp.yaml
        min_state: PLACEHOLDER
        usage: template
    outputs:
      - path: workspace/{spoke}/L1-strategy/icp.yaml
        doc_id: L1-001
        action: upsert
        backup: true
        registry_state_after: POPULATED
      - path: workspace/{spoke}/L1-strategy/diagnosis.yaml
        action: upsert
        backup: true
        registry_state_after: POPULATED
    description: "CMO elicita ICP completo com diagnosis gate → icp.yaml"

  - id: elicit-pricing-strategy
    agent: cmo-architect
    inputs:
      - path: workspace/{spoke}/L1-strategy/bmc.yaml
        min_state: POPULATED
        usage: reference
      - path: workspace/{spoke}/L1-strategy/lean-canvas.yaml
        min_state: POPULATED
        usage: reference
      - path: workspace/{spoke}/L1-strategy/offerbook.yaml
        min_state: POPULATED
        usage: reference
      - path: workspace/{spoke}/L1-strategy/icp.yaml
        min_state: POPULATED
        usage: reference
      - path: workspace/{spoke}/L1-strategy/pricing-strategy.yaml
        min_state: PLACEHOLDER
        usage: template
    outputs:
      - path: workspace/{spoke}/L1-strategy/pricing-strategy.yaml
        doc_id: L1-005
        action: upsert
        backup: true
        registry_state_after: POPULATED
    description: "CMO elicita estrategia de pricing → pricing-strategy.yaml"

  - id: elicit-brand-yaml
    agent: cmo-architect
    inputs:
      - path: workspace/{spoke}/L0-identity/company-dna.yaml
        min_state: POPULATED
        usage: reference
      - path: workspace/{spoke}/L0-identity/founder-dna.yaml
        min_state: POPULATED
        usage: reference
      - path: workspace/{spoke}/L1-strategy/icp.yaml
        min_state: POPULATED
        usage: reference
    outputs:
      - path: workspace/{spoke}/L2-tactical/brand/brandbook.yaml
        doc_id: L2-001
        action: upsert
        backup: true
        registry_state_after: DRAFT
    description: "CMO elicita brand guidelines → brandbook.yaml (DRAFT)"

  - id: elicit-icp
    agent: cmo-architect
    inputs:
      - path: workspace/{spoke}/L0-identity/company-dna.yaml
        min_state: POPULATED
        usage: reference
    outputs: []
    description: "CMO elicita ICP, proposta de valor, brand e messaging (legacy markdown output)"
    note: "Predecessor of elicit-icp-yaml. Kept for backwards compatibility."

  - id: elicit-tech-strategy
    agent: cto-architect
    inputs:
      - path: workspace/{spoke}/L0-identity/company-dna.yaml
        min_state: POPULATED
        usage: reference
        optional: true
    outputs: []
    description: "CTO elicita estrategia tecnologica"
    note: "Output path TBD — nao tem doc no registry ainda"

  - id: elicit-tech-stack
    agent: cio-engineer
    inputs: []
    outputs: []
    description: "CIO elicita tech stack operacional"
    note: "Output path TBD — nao tem doc no registry ainda"

  - id: elicit-ai-strategy
    agent: caio-architect
    inputs: []
    outputs: []
    description: "CAIO elicita estrategia de IA"
    note: "Output path TBD — nao tem doc no registry ainda"

  # --- Governance ---
  - id: workspace-health-check
    agent: coo-orchestrator
    inputs:
      - path: workspace/{spoke}/document-registry.yaml
        usage: reference
    outputs:
      - path: docs/qa/workspace-health/YYYY-MM-DD-health-report.md
        action: upsert
        backup: false
    description: "Auditoria de saude do workspace"

  # --- Composite ---
  - id: add-product
    agent: cmo-architect
    inputs:
      - path: workspace/{spoke}/L0-identity/company-dna.yaml
        min_state: POPULATED
        usage: reference
      - path: workspace/{spoke}/L1-strategy/icp.yaml
        min_state: POPULATED
        usage: reference
      - path: workspace/{spoke}/L1-strategy/offerbook.yaml
        min_state: POPULATED
        usage: reference
    outputs:
      - path: "workspace/{spoke}/L3-product/{product_slug}/offerbook.yaml"
        doc_id: L3-001
        action: create
        backup: false
        registry_state_after: DRAFT
    description: "Adiciona novo produto com posicionamento proprio"

  # --- Missing tasks (added 2026-04-13 during sinkra-upgrade-squad) ---
  - id: load-workspace-context
    agent: coo-orchestrator
    inputs:
      - path: workspace/{spoke}/document-registry.yaml
        usage: reference
    outputs:
      - path: "workspace/{spoke}/L4-operational/evidence/workspace-context-summary.yaml"
        action: upsert
        backup: false
    description: "Carrega contexto do workspace antes de orquestrar handoffs"

  - id: classify-squad-workspace-fit
    agent: coo-orchestrator
    inputs:
      - path: workspace/{spoke}/document-registry.yaml
        usage: reference
    outputs:
      - path: squads/c-level/outputs/squad-workspace-fit.yaml
        action: upsert
        backup: false
    description: "Decide se um squad deve integrar com workspace e em qual nivel"

  - id: add-business
    agent: coo-orchestrator
    inputs: []
    outputs:
      - path: "workspace/{spoke}/document-registry.yaml"
        action: create
    description: "Adiciona novo negocio ao workspace"

  - id: setup-workspace
    agent: coo-orchestrator
    inputs: []
    outputs: []
    description: "Configura workspace completo (executa todas as elicitacoes)"

  - id: setup-business-profile
    agent: coo-orchestrator
    inputs:
      - path: workspace/{spoke}/L0-identity/company-dna.yaml
        min_state: PLACEHOLDER
        usage: template
    outputs:
      - path: "workspace/{spoke}/L0-identity/authority-story.yaml"
        action: upsert
        backup: true
      - path: "workspace/{spoke}/L4-operational/evidence/cross-reference-validation.yaml"
        action: upsert
        backup: false
      - path: "workspace/{spoke}/L4-operational/evidence/completeness-report.md"
        action: upsert
        backup: false
    description: "Pipeline completo de perfil de negocio (7 fases, 7 YAMLs + validacao final)"

  - id: elicit-company-profile
    agent: coo-orchestrator
    inputs:
      - path: workspace/{spoke}/L0-identity/company-dna.yaml
        min_state: PLACEHOLDER
        usage: template
    outputs:
      - path: workspace/{spoke}/L0-identity/company-dna.yaml
        doc_id: L0-001
        action: upsert
        backup: true
        registry_state_after: POPULATED
    description: "COO elicita perfil completo da empresa"

  - id: elicit-team-structure
    agent: coo-orchestrator
    inputs:
      - path: workspace/{spoke}/L0-identity/company-dna.yaml
        min_state: POPULATED
        usage: reference
    outputs:
      - path: workspace/{spoke}/L1-strategy/team-structure.yaml
        action: upsert
        backup: true
        registry_state_after: POPULATED
    description: "COO elicita estrutura de time"

  - id: elicit-product-portfolio
    agent: cmo-architect
    inputs:
      - path: workspace/{spoke}/L0-identity/company-dna.yaml
        min_state: POPULATED
        usage: reference
      - path: workspace/{spoke}/L1-strategy/icp.yaml
        min_state: POPULATED
        usage: reference
    outputs:
      - path: workspace/{spoke}/L1-strategy/product-portfolio.yaml
        action: upsert
        backup: true
    description: "Elicita portfolio completo de produtos"

  - id: etl-local-extract
    agent: coo-orchestrator
    inputs:
      - path: "workspace/{spoke}/"
        usage: reference
      - path: squads/c-level/data/imersao-business-map.yaml
        usage: reference
    outputs:
      - path: "workspace/{spoke}/L4-operational/evidence/source-registry.yaml"
        action: upsert
    description: "Extrai contexto profundo de fontes locais mapeadas"

  - id: etl-web-scrape
    agent: coo-orchestrator
    inputs:
      - path: "workspace/{spoke}/L0-identity/company-dna.yaml"
        min_state: POPULATED
        usage: reference
    outputs:
      - path: "workspace/{spoke}/L2-tactical/brand/brandbook.yaml"
        action: upsert
      - path: "workspace/{spoke}/L4-operational/evidence/etl-run-envelope.yaml"
        action: upsert
    description: "Faz scrape de website e extrai sinais de brand e estrutura"

  - id: etl-web-research
    agent: coo-orchestrator
    inputs:
      - path: "workspace/{spoke}/L0-identity/company-dna.yaml"
        min_state: POPULATED
        usage: reference
    outputs:
      - path: "workspace/{spoke}/L0-identity/credentials.yaml"
        action: upsert
      - path: "workspace/{spoke}/L0-identity/authority-story.yaml"
        action: upsert
      - path: "workspace/{spoke}/L3-product/{product}/proof.yaml"
        action: upsert
      - path: "workspace/{spoke}/L3-product/{product}/testimonials.yaml"
        action: upsert
      - path: "workspace/{spoke}/L4-operational/evidence/etl-run-envelope.yaml"
        action: upsert
    description: "Enriquecimento externo com midia, social, prova e UGC"

  - id: etl-generate-artifacts
    agent: coo-orchestrator
    inputs:
      - path: "workspace/{spoke}/"
        usage: reference
    outputs:
      - path: "workspace/{spoke}/L2-tactical/brand/brandbook.yaml"
        action: upsert
      - path: "workspace/{spoke}/L2-tactical/brand/domain-decision.yaml"
        action: upsert
      - path: "workspace/{spoke}/L3-product/{product}/offerbook.yaml"
        action: upsert
      - path: "workspace/{spoke}/L3-product/{product}/proof.yaml"
        action: upsert
      - path: "workspace/{spoke}/L3-product/{product}/testimonials.yaml"
        action: upsert
      - path: "workspace/{spoke}/L3-product/{product}/narrative/*.yaml"
        action: upsert
      - path: "workspace/{spoke}/L2-tactical/movement/**/*.yaml"
        action: upsert
      - path: "workspace/{spoke}/L4-operational/evidence/completeness-manifest.yaml"
        action: upsert
      - path: "workspace/{spoke}/L4-operational/evidence/source-registry.yaml"
        action: upsert
      - path: "workspace/{spoke}/L4-operational/evidence/etl-run-envelope.yaml"
        action: upsert
    description: "Converte contexto enriquecido em artefatos canonicos"

  - id: etl-deep-pass
    agent: coo-orchestrator
    inputs:
      - path: "workspace/{spoke}/"
        usage: reference
      - path: squads/c-level/data/imersao-business-map.yaml
        usage: reference
    outputs:
      - path: "workspace/{spoke}/L4-operational/evidence/etl-run-envelope.yaml"
        action: upsert
    description: "Orquestra as 4 layers do ETL Deep Pass com quality gates"

  - id: etl-batch-runner
    agent: coo-orchestrator
    inputs: []
    outputs:
      - path: "workspace/businesses/_batch/etl-deep-pass-batch-status.yaml"
        action: upsert
        backup: false
    description: "Executa ETL Deep Pass em lote para multiplos businesses"

  - id: cross-reference-validation
    agent: coo-orchestrator
    inputs:
      - path: "workspace/{spoke}/L0-identity/company-dna.yaml"
        usage: reference
      - path: "workspace/{spoke}/L0-identity/founder-dna.yaml"
        usage: reference
      - path: "workspace/{spoke}/L1-strategy/icp.yaml"
        usage: reference
      - path: "workspace/{spoke}/L2-tactical/brand/brandbook.yaml"
        usage: reference
    outputs:
      - path: "workspace/{spoke}/L4-operational/evidence/cross-reference-validation.yaml"
        action: upsert
        backup: false
    description: "Valida alinhamento entre company, founder, ICP e brand antes do fechamento do pipeline"

  - id: authority-story-synthesis
    agent: coo-orchestrator
    inputs:
      - path: "workspace/{spoke}/L0-identity/founder-dna.yaml"
        usage: reference
      - path: "workspace/{spoke}/L0-identity/credentials.yaml"
        usage: reference
    outputs:
      - path: "workspace/{spoke}/L0-identity/authority-story.yaml"
        action: upsert
        backup: true
    description: "Sintetiza authority-story.yaml a partir de founder-dna e credentials"

  - id: completeness-report
    agent: coo-orchestrator
    inputs:
      - path: "workspace/{spoke}/"
        usage: reference
    outputs:
      - path: "workspace/{spoke}/L4-operational/evidence/completeness-report.md"
        action: upsert
        backup: false
    description: "Consolida a completude final do pipeline de perfil"

  - id: elicit-culture
    agent: workspace-chief
    inputs:
      - path: workspace/{spoke}/L0-identity/company-dna.yaml
        min_state: POPULATED
        usage: reference
    outputs:
      - path: "workspace/{spoke}/L2-tactical/culture/*.yaml"
        action: upsert
    description: "Elicita cultura organizacional e materializa templates canonicos"

  - id: diagnose-business
    agent: workspace-chief
    inputs:
      - path: "workspace/{spoke}/"
        usage: reference
    outputs:
      - path: "docs/diagnostics/YYYY-MM-DD-{slug}-diagnostic.md"
        action: create
    description: "Diagnostico estrategico do business em 10 dimensoes"

  - id: diagnose-offer
    agent: cmo-architect
    inputs:
      - path: "workspace/{spoke}/L3-product/"
        usage: reference
    outputs:
      - path: "docs/diagnostics/YYYY-MM-DD-{slug}-{product}-offer-diagnostic.md"
        action: create
    description: "Diagnostico de oferta por produto e readiness comercial"

  - id: growth-levers
    agent: workspace-chief
    inputs:
      - path: "docs/diagnostics/YYYY-MM-DD-{slug}-diagnostic.md"
        usage: reference
    outputs:
      - path: "docs/diagnostics/YYYY-MM-DD-{slug}-growth-levers.md"
        action: create
    description: "Identifica as principais alavancas de crescimento do business"

  - id: next-best-action
    agent: workspace-chief
    inputs:
      - path: "workspace/{spoke}/"
        usage: reference
    outputs: []
    description: "Recomenda a proxima acao de maior impacto"

  - id: progress-check
    agent: workspace-chief
    inputs:
      - path: "docs/diagnostics/"
        usage: reference
    outputs:
      - path: "docs/diagnostics/YYYY-MM-DD-{slug}-progress.md"
        action: create
    description: "Compara evolucao do business contra diagnosticos anteriores"

  - id: render-context
    agent: workspace-chief
    inputs:
      - path: "workspace/{spoke}/"
        usage: reference
    outputs: []
    description: "Renderiza snapshot executivo do contexto atual do workspace"

  - id: resolve-squad-workspace-readiness
    agent: coo-orchestrator
    inputs:
      - path: workspace/{spoke}/document-registry.yaml
        usage: reference
    outputs:
      - path: "squads/c-level/outputs/workspace-readiness-report.yaml"
        action: upsert
        backup: false
    description: "Resolve readiness de um squad externo para integrar com workspace"

# =============================================================================
# CROSS-DOMAIN WIRING — Conexoes com apps/, infrastructure/, packages/
# =============================================================================

cross_domain:
  apps: []
  # c-level nao toca apps diretamente.
  # Futuramente: apps/web pode consumir brand tokens gerados aqui.

  infrastructure: []
  # c-level nao toca infrastructure diretamente.

  packages:
    - path: packages/db/supabase/
      relationship: indirect
      note: "Docs do workspace alimentam schemas via pipeline separado"

# =============================================================================
# ENFORCEMENT RULES — Regras para *enforce c-level
# =============================================================================

enforcement:
  # Inputs minimos para o squad inteiro poder operar
  required_inputs:
    - doc_id: L0-001
      min_state: PLACEHOLDER
      note: "Squad pode iniciar com PLACEHOLDER (scaffold), mas elicitacoes L1+ precisam POPULATED"

  # Per-task enforcement (mais granular que squad-level)
  task_gates:
    elicit-icp-yaml:
      requires: [{doc_id: L0-001, min_state: POPULATED}]
    elicit-pricing-strategy:
      requires:
        - {doc_id: L1-002, min_state: POPULATED}
        - {doc_id: L1-004, min_state: POPULATED}
    elicit-brand-yaml:
      requires:
        - {doc_id: L0-001, min_state: POPULATED}
        - {doc_id: L0-002, min_state: POPULATED}
        - {doc_id: L1-001, min_state: POPULATED}
    add-product:
      requires:
        - {doc_id: L1-001, min_state: POPULATED}
        - {doc_id: L1-004, min_state: POPULATED}

# =============================================================================
# GAPS & OBSERVATIONS (CSO Audit Notes)
# =============================================================================

audit_notes:
  date: "2026-03-09"
  auditor: cso
  findings:
    - severity: medium
      finding: "Tasks elicit-tech-strategy, elicit-tech-stack, elicit-ai-strategy nao tem output paths definidos no registry"
      recommendation: "Criar docs L0/L1 para tech-strategy, tech-stack, ai-strategy e registrar no document-registry"

    - severity: info
      finding: "Task elicit-credentials agora publica em L0-identity/credentials.yaml e phase 6 sintetiza authority-story.yaml"
      recommendation: "Sincronizar document-registry templates legados para refletir o contrato atual"

    - severity: medium
      finding: "config.yaml do squad teve paths antigos corrigidos para modelo 5-layer [Story 39.18]"
      recommendation: "RESOLVED — paths atualizados para workspace/{spoke}/L{N}-*"

    - severity: low
      finding: "elicit-icp (md output) e elicit-icp-yaml (yaml output) sao tasks duplicadas com outputs diferentes"
      recommendation: "Deprecar elicit-icp (.md) em favor de elicit-icp-yaml (.yaml)"

    - severity: info
      finding: "Squad nao toca apps/ ou infrastructure/ diretamente — correto para squad estrategico"

# =============================================================================
# SCHEMA REFERENCE
# =============================================================================
# squad-io.yaml schema v2.0
#
# inputs.workspace[]:
#   path: string         — caminho relativo ao repo root
#   doc_id: string       — ID no document-registry (se aplicavel)
#   min_state: enum      — PLACEHOLDER|DRAFT|POPULATED|VALIDATED|APPROVED
#   usage: string[]      — [database|reference|template|trigger]
#   consumed_by_tasks: string[]
#   consumed_by_agents: string[]
#   optional: boolean    — default false
#
# outputs.workspace[]:
#   path: string
#   doc_id: string
#   action: enum         — create|update|upsert|version
#   backup: boolean      — faz backup antes de sobrescrever
#   produced_by_tasks: string[]
#   produced_by_agents: string[]
#   registry_state_after: enum
#   note: string
#
# agents[]:
#   id: string
#   role: string
#   is_lead: boolean
#   tasks: string[]
#   databases: string[]  — arquivos carregados como contexto persistente
#   reads_at_runtime: string[] — arquivos lidos durante execucao
#
# tasks[]:
#   id: string
#   agent: string
#   inputs[]: {path, min_state, usage, optional}
#   outputs[]: {path, doc_id, action, backup, registry_state_after}
#   description: string
#
# cross_domain:
#   apps[]: {path, relationship, tasks, note}
#   infrastructure[]: {path, relationship, tasks, note}
#   packages[]: {path, relationship, tasks, note}
#
# enforcement:
#   required_inputs[]: {doc_id, min_state}
#   task_gates: {task_id: {requires: [{doc_id, min_state}]}}
# =============================================================================

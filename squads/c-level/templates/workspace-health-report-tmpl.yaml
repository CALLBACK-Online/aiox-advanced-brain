---
_meta:
  artifact_id: workspace-health-report
  version: "1.0.0"
  lifecycle_states: [draft, validated, approved]
  owner_squad: c-level
  owner_agent: workspace-chief

health_report:
  date: "{date}"
  business_slug: "{slug}"
  auditor: "{agent_id}"

  # Structure Validation
  structure:
    directories_expected: 0
    directories_found: 0
    missing_directories: []
    extra_directories: []
    score: 0  # 0-100

  # Schema Compliance
  schema:
    files_validated: 0
    files_compliant: 0
    violations: []
    score: 0  # 0-100

  # Content Freshness
  freshness:
    files_checked: 0
    files_stale: 0  # beyond TTL
    stale_files: []
    score: 0  # 0-100

  # Domain Coverage
  coverage:
    domains_expected: ["company", "operations", "products", "tech", "ai"]
    domains_populated: []
    domains_empty: []
    score: 0  # 0-100

  # Completeness
  completeness:
    required_artifacts: 0
    artifacts_present: 0
    artifacts_above_threshold: 0  # >= 85% complete
    missing_artifacts: []
    score: 0  # 0-100

  # Summary
  overall_score: 0  # weighted avg
  health_status: "{health_status}"  # critical | warning | healthy | excellent
  recommendations: []

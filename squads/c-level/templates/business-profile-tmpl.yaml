---
_meta:
  artifact_id: business-profile
  version: "1.0.0"
  lifecycle_states: [draft, validated, approved]
  owner_squad: c-level
  owner_agent: workspace-chief
  completeness_threshold: 0.85

business_profile:
  # Identity
  company_name: "{company_name}"
  slug: "{slug}"
  industry: "{industry}"
  founded: "{founded_year}"
  stage: "{stage}"  # startup | growth | scale | enterprise

  # Founder DNA (extracted by vision-strategist)
  founder:
    name: "{founder_name}"
    role: "{founder_role}"
    vision: "{founder_vision}"
    values: []
    superpower: "{founder_superpower}"

  # Market (extracted by cmo-architect)
  icp:
    segment: "{segment}"  # Enterprise | Mid-Market | SMB | Individual | Agency
    decision_maker: "{decision_maker}"
    pain_points: []
    desired_outcomes: []

  # Brand (extracted by cmo-architect)
  brand:
    positioning: "{positioning}"
    tone_of_voice: "{tone}"
    differentiator: "{differentiator}"

  # Technology (extracted by cto-architect)
  tech:
    stack: []
    architecture: "{architecture_type}"
    maturity: "{tech_maturity}"  # mvp | stable | scaling | enterprise

  # Operations (extracted by workspace-chief)
  operations:
    team_size: "{team_size}"
    revenue_range: "{revenue_range}"
    key_processes: []

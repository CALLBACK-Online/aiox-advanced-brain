pack:
  name: c-level
  version: "1.0.0"
  description: |
    Squad C-Level - Executivos estratégicos que estruturam o workspace da empresa.
    Responsável por elicitação profunda, geração de documentos de referência,
    e organização completa do workspace com visão executiva.

    Preserva a abstração canônica `workspace/{spoke}` do SINKRA.
    No Sinkra Hub atual, cada `spoke` é materializado em `workspace/businesses/{slug}` com 5 layers (L0-L4).
  icon: "👔"
  author: Synkra AIOX

license: MIT
entry_agent: coo-orchestrator
tested: true

# Squad metadata
metadata:
  # MIGRATION-SCHEMA-001 backfill
  name: c-level
  status: active
  domain: c-level
  version: "1.0.0"
  score: 7.4
  category: strategy
  tags:
    - executive
    - workspace
    - company-structure
    - elicitation
    - strategy
    - multi-business
    - 5-layer
  maturity: beta

merge_history:
  - date: "2026-04-03"
    source_squad: "workspace-governance-legacy"
    decision: "deduplicated_into_c-level"
    preserved_at: "squads/c-level/_archive/workspace-governance-merged/"

workspace_integration:
  level: workspace_first
  model: hub-multi-business-5-layer
  rationale: >-
    C-Level coordena a estrutura canônica de `workspace`, então precisa validar
    bootstrap, templates e contexto antes de qualquer elicitação.
    A abstração canônica continua sendo `workspace/{spoke}`; no hub atual,
    esse spoke é resolvido para `workspace/businesses/{slug}/L0-identity` até `workspace/businesses/{slug}/L4-operational`.
  read_paths:
    - workspace/_system/config.yaml
    - workspace/businesses/
    - workspace/_templates/business-template/
    - workspace/scripts/
    - squads/c-level/
  write_paths:
    - workspace/businesses/
    - docs/qa/workspace-health/
  documents_owned:
    # STORY-MIG-1.3: c-level is canonical owner of strategic foundation documents
    - id: icp
      path: "L1-strategy/icp.yaml"
      description: Ideal Customer Profile — strategic definition, not execution squad scope
    - id: bmc
      path: "L1-strategy/bmc.yaml"
      description: Business Model Canvas — strategic foundation, owned by c-level executives
  bootstrap:
    required: true
    script: "scripts/bootstrap-c-level-workspace.sh"
  essentials_validation:
    required: true
    script: "scripts/validate-c-level-essentials.sh"

workspace_governance:
  workspace_bus_policy:
    principle: "Squads consomem contratos do workspace, nunca a identidade de outros squads"
    enforcement: advisory
    rules:
      - cross_squad_shared_inputs_must_use_workspace_contracts
      - canonical_shared_outputs_must_declare_workspace_path
      - readiness_checks_validate_artifact_contracts_not_producer_identity
  readiness:
    squads:
      design-ops:
        aliases:
          - design-ops
        resolver_kind: design_system
        default_context: design_system
        allowed_contexts:
          - design_system
        fallback_integration_level: controlled_runtime_consumer
      design-system:
        aliases:
          - design
        resolver_kind: design_system
        default_context: design_system
        allowed_contexts:
          - design_system
        fallback_integration_level: controlled_runtime_consumer
      copy:
        resolver_kind: product
        default_context: product
        allowed_contexts:
          - product
        fallback_integration_level: workspace_first
      aiox-ads:
        resolver_kind: product
        default_context: product
        allowed_contexts:
          - product
        fallback_integration_level: controlled_runtime_consumer
      aiox-sop:
        resolver_kind: operations
        default_context: operations
        allowed_contexts:
          - operations
        fallback_integration_level: controlled_runtime_consumer
      brand:
        resolver_kind: brand
        default_context: brand
        allowed_contexts:
          - brand
        fallback_integration_level: workspace_first
      hormozi:
        resolver_kind: product
        default_context: product
        allowed_contexts:
          - product
        fallback_integration_level: controlled_runtime_consumer
      movement:
        resolver_kind: movement
        default_context: movement
        allowed_contexts:
          - movement
        fallback_integration_level: workspace_first
      storytelling:
        resolver_kind: product
        default_context: product
        allowed_contexts:
          - product
        fallback_integration_level: controlled_runtime_consumer
      squad-creator-pro:
        resolver_kind: operations
        default_context: operations
        allowed_contexts:
          - operations
        fallback_integration_level: controlled_runtime_consumer
      gerador-pop:
        resolver_kind: operations
        default_context: operations
        allowed_contexts:
          - operations
        fallback_integration_level: controlled_runtime_consumer
  product_readiness:
    narrative_artifacts:
      product:
        - id: brandscript
          path: L3-product/{product}/narrative/brandscript.yaml
        - id: product_story
          path: L3-product/{product}/narrative/product-story.yaml
        - id: pitch_narrative
          path: L3-product/{product}/narrative/pitch-narrative.yaml
        - id: objection_destroyers
          path: L3-product/{product}/narrative/objection-destroyers.yaml
    consumers:
      copy:
        required_shared_sources:
          # EPIC-124 pilot migration: artifact_ref added; path retained for backward compat
          - id: icp
            artifact_ref: icp
            path: L1-strategy/icp.yaml
          - id: brandbook
            artifact_ref: brand-platform
            path: L2-tactical/brand/brandbook.yaml
          - id: offerbook_index
            artifact_ref: offerbook
            path: L1-strategy/offerbook.yaml
        required_product_sources:
          - id: offerbook
            artifact_ref: product-offerbook
            path: L3-product/{product}/offerbook.yaml
          - id: proof
            artifact_ref: product-proof
            path: L3-product/{product}/proof.yaml
          - id: testimonials
            artifact_ref: product-testimonials
            path: L3-product/{product}/testimonials.yaml
      aiox-ads:
        required_shared_sources:
          - id: company_profile
            path: L0-identity/company-dna.yaml
          - id: icp
            path: L1-strategy/icp.yaml
          - id: brandbook
            path: L2-tactical/brand/brandbook.yaml
          - id: domain_decision
            path: L2-tactical/brand/domain-decision.yaml
        required_product_sources:
          - id: offerbook
            path: L3-product/{product}/offerbook.yaml
          - id: proof
            path: L3-product/{product}/proof.yaml
          - id: testimonials
            path: L3-product/{product}/testimonials.yaml
          - id: objection_destroyers
            path: L3-product/{product}/narrative/objection-destroyers.yaml
      hormozi:
        required_shared_sources:
          - id: brandbook
            path: L2-tactical/brand/brandbook.yaml
          - id: offerbook_index
            path: L1-strategy/offerbook.yaml
        required_product_sources:
          - id: offerbook
            path: L3-product/{product}/offerbook.yaml
          - id: proof
            path: L3-product/{product}/proof.yaml
      storytelling:
        required_shared_sources:
          - id: icp
            path: L1-strategy/icp.yaml
          - id: brandbook
            path: L2-tactical/brand/brandbook.yaml
        required_product_sources:
          - id: offerbook
            path: L3-product/{product}/offerbook.yaml
          - id: proof
            path: L3-product/{product}/proof.yaml


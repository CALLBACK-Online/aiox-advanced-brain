  - id: exec-content-production
    file: manifests/exec-content-production.manifest.yaml
    description: Manifest de contexto para produção de conteúdo
    owner: cmo-architect
  - id: exec-marketing
    file: manifests/exec-marketing.manifest.yaml
    description: Manifest de contexto para estratégia e execução de marketing
    owner: cmo-architect

# Workspace structure this squad manages (5-layer SINKRA com binding hub)
workspace_structure:
  root: workspace/{spoke}/
  concrete_root: workspace/businesses/{business}/
  model: hub-multi-business-5-layer

  # External files (not in workspace/)
  external_files:
    - path: workspace/_system/config.yaml
      owner: coo-orchestrator
      description: Configuração global do hub e registry de businesses
      required: true

    - path: CLAUDE.md
      owner: coo-orchestrator
      description: Project instructions (Claude Code)

  # Registry (source of truth)
  registry:
    path: workspace/businesses/{business}/document-registry.yaml
    owner: cso
    description: Fonte única de verdade para todos documentos do workspace

  # 5-Layer architecture
  layers:
    L0-identity:
      path: workspace/businesses/{business}/L0-identity/
      ttl: 365d
      owner: vision-chief + coo-orchestrator
      files:
        - company-dna.yaml (CEO/COO)
        - founder-dna.yaml (CEO)
        - legal/legal-foundation.yaml (COO)

    L1-strategy:
      path: workspace/businesses/{business}/L1-strategy/
      ttl: 90d
      owner: cmo-architect + coo-orchestrator
      files:
        - icp.yaml (CMO)
        - bmc.yaml (CMO)
        - lean-canvas.yaml (CMO)
        - offerbook.yaml (CMO)
        - pricing-strategy.yaml (CMO)

    L2-tactical:
      path: workspace/businesses/{business}/L2-tactical/
      ttl: 60d
      owner: cmo-architect + cto-architect
      files:
        - brand/brandbook.yaml (CMO)
        - design/design-system-config.yaml (Design System)
        - movement/movement-manifest.yaml (CMO)

    L3-product:
      path: workspace/businesses/{business}/L3-product/
      ttl: 30d
      owner: cmo-architect + coo-orchestrator
      files:
        - "{product-slug}/offerbook.yaml"
        - "{product-slug}/proof.yaml"
        - "{product-slug}/narrative/*.yaml"

    L4-operational:
      path: workspace/businesses/{business}/L4-operational/
      ttl: 7d
      owner: coo-orchestrator
      files:
        - campaigns/ (COO)
        - content/ (CMO)
        - evidence/ (COO)

  # Templates
  templates:
    path: workspace/_templates/
    owner: coo-orchestrator
    description: Templates para scaffolding de workspace

domain_model:
  strategic:
    label: Strategic
    owner: vision-chief + workspace-chief
  tactical:
    label: Tactical
    owner: cmo-architect
  operational:
    label: Operational
    owner: coo-orchestrator
canonical_domains: [Strategic, Tactical, Operational]

composition_mapping:
  token: data/token-registry.yaml
  atom: tasks/
  molecule:
    primary: checklists/
    co_located_in_tasks:
      - etl-deep-pass
      - diagnose-business
      - elicit-culture
    note: >
      These 3 tasks declare atomic_layer=Molecule because they orchestrate
      multiple sub-tasks. They co-locate in tasks/ (atom directory) for
      filesystem simplicity. Their Molecule classification is semantic,
      not filesystem-based. This is an intentional deviation documented
      per DEV-2026-002.
  organism: workflows/
  manifest: manifests/
  template: templates/
  instance: workspace/{spoke}/

logging:
  level: info
  audit_trail: docs/qa/workspace-health/
  error_behavior: fail_fast_with_report

metrics:
  tracking_enabled: true
  kpis:
    - workspace_health_pass_rate
    - business_profile_completion_rate
    - etl_deep_pass_delta_score
    - diagnostic_handoff_readiness

# Dependencies
dependencies:
  squads: []
  tools:
    - name: elicitation
      description: Framework de elicitação estruturada

# SINKRA v3.1 (Story 54.11 + Story 60.11 Hub Migration)
bu_mapping: "hub-framework"
artifact_contracts:
  - artifact_id: "strategic-assessment"
    template_path: "templates/strategic-assessment-tmpl.md"
    lifecycle_states: [draft, validated, approved]
  - artifact_id: "workspace-instantiation"
    template_path: "templates/workspace-template.md"
    lifecycle_states: [draft, validated, approved]
  - artifact_id: "business-profile"
    template_path: "templates/business-profile-tmpl.yaml"
    lifecycle_states: [draft, validated, approved]
  - artifact_id: "diagnostic-report"
    template_path: "templates/diagnostic-report-tmpl.yaml"
    lifecycle_states: [draft, validated, approved]
  - artifact_id: "cross-domain-handoff"
    template_path: "templates/cross-domain-handoff-tmpl.yaml"
    lifecycle_states: [draft, validated, approved]
  - artifact_id: "workspace-health-report"
    template_path: "templates/workspace-health-report-tmpl.yaml"
    lifecycle_states: [draft, validated, approved]
supported_modes:
  - PLANEJAR
  - VALIDAR
  - GERENCIAR
  - ENTENDER



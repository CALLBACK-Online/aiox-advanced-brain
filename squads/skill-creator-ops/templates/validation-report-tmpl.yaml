  - check: "description informative"
    status: "{PASS|FAIL}"
    detail: "{detail_if_fail}"

  - check: "version semver valid"
    status: "{PASS|FAIL}"
    value: "{version_value}"

  - check: "owner_squad exists"
    status: "{PASS|FAIL}"
    value: "{owner_squad_value}"

  - check: "sinkra_tier valid"
    status: "{PASS|FAIL}"
    value: "{tier_value}"

  - check: "context, agent, user-invocable present"
    status: "{PASS|FAIL}"

  - check: "SKILL.md exists"
    status: "{PASS|FAIL}"

  - check: "structure matches declared tier"
    status: "{PASS|WARNING|FAIL}"
    detail: "{detail}"

  - check: "no junk files"
    status: "{PASS|FAIL}"

  - check: "scripts valid"
    status: "{PASS|FAIL|N_A}"

  - check: "registered in skill-registry.yaml"
    status: "{PASS|FAIL}"

  - check: "version matches registry"
    status: "{PASS|FAIL|SKIP}"

findings: []

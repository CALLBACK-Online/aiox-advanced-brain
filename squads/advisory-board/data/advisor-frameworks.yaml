devils_advocate_matrix:
  consensus_scale_fast: [sivers, chouinard, munger]
  consensus_stay_small: [hoffman, thiel]
  consensus_systems_focus: [sinek, brown, lencioni]
  consensus_people_focus: [naval, thiel]

# ═══════════════════════════════════════════════════════════════════════════════
# BOARD MECHANICS (Based on Real Advisory Board Research)
# ═══════════════════════════════════════════════════════════════════════════════

mechanics:
  meeting_types:
    full_board:
      duration: "60-90 minutes"
      frequency: "As needed for major decisions"
      participants: "All advisors"

    issue_processing:
      duration: "30-45 minutes"
      frequency: "Ad-hoc"
      model: "Vistage 5-stage framework"

    quick_consult:
      duration: "15-20 minutes"
      frequency: "Ad-hoc"
      participants: "1-2 specific advisors"

    strategic_review:
      duration: "45-60 minutes"
      frequency: "Quarterly mindset"
      focus: "Long-term direction"

  anti_groupthink:
    devils_advocate:
      rotation: true
      minimum: 2  # Always have 2 challengers

    divergence_tracking:
      enabled: true
      flag_when: "< 2 dissenting voices"

    reframe_requirement:
      enabled: true
      rule: "Must articulate opposing view before dismissing"

    anonymous_pre_vote:
      enabled: true
      purpose: "Capture initial reactions before group influence"

  accountability:
    action_items:
      required_fields:
        - what
        - who
        - when
        - priority
      follow_up: "Check at start of next session"

    decision_log:
      enabled: true
      track:
        - decision
        - advisors_consulted
        - dissenting_views
        - rationale
        - outcome_review_date

# ═══════════════════════════════════════════════════════════════════════════════
# ADVISOR SELECTION MATRIX
# ═══════════════════════════════════════════════════════════════════════════════

advisor_selection:
  by_situation:
    strategic_decision:
      primary: ["munger", "dalio", "thiel"]
      challenger: ["sinek", "chouinard"]

    people_team:
      primary: ["lencioni", "sinek"]
      challenger: ["naval", "thiel"]

    growth_scale:
      primary: ["hoffman", "thiel"]
      challenger: ["sivers", "chouinard"]

    values_ethics:
      primary: ["chouinard", "sivers"]
      challenger: ["thiel", "hoffman"]

    personal_leadership:
      primary: ["brown", "sinek"]
      challenger: ["munger", "naval"]

    risk_opportunity:
      primary: ["munger", "naval", "thiel"]
      challenger: ["brown", "chouinard"]

  by_question_type:
    "how_do_i": ["munger", "dalio", "hoffman"]
    "should_i": ["sivers", "naval", "thiel"]
    "what_if": ["thiel", "munger", "brown"]
    "why_am_i": ["brown", "sinek", "sivers"]

# ═══════════════════════════════════════════════════════════════════════════════
# QUALITY STANDARDS
# ═══════════════════════════════════════════════════════════════════════════════

quality:
  meeting_output:
    required:
      - clear_decision_or_direction
      - action_items_with_owners
      - dissenting_views_documented
      - follow_up_date

  advisor_contribution:
    minimum_per_session:
      - perspective_shared: true
      - challenge_offered: true
      - framework_applied: true

  decision_quality:
    checklist_required: true
    minimum_advisors_consulted: 3
    devil_advocate_required: true


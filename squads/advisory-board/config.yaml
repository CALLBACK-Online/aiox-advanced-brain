# Advisory Board Squad Configuration
# Personal Board of Directors for Strategic Decisions
# Version: 1.1.0

pack:
  name: advisory-board
  title: "Advisory Board - Personal Board of Directors"
  version: "1.1.0"
  description: |
    Squad de conselheiros estratégicos pessoais baseado no DNA Mental™ de Alan Nicolas.
    Combina 4 mentes alinhadas + 6 mentes complementares para decisões robustas.
    Implementa mecânicas reais de advisory boards: Issue Processing (Vistage),
    Devil's Advocate, Anti-Groupthink, e Accountability Loops.

  domain: "strategic-advisory"
  target_user: "Alan Nicolas / Founders seeking strategic counsel"

  slash_prefix: "Board"
  pattern_prefix: "AB"

  created: "2026-02-03"
  author: "squad-architect"

metadata:
  status: active
  version: "1.2.0"
  score: 8.5
  upgraded_at: "2026-04-13"
  upgrade_story: "107.4"

# Identity-Bound Squad — PII allowed per ADR-SQUAD-PII-POLICY (2026-05-05)
# Built on Alan Nicolas's DNA Mental™ profile. The Advisory Board persona
# loader reads alan-nicolas-profile.yaml as identity source.
identity_bound: true
identity_source:
  type: person
  refs:
    - "upstream identity record: alan-nicolas"
    - .aiox/advisory-board/alan-nicolas-profile.yaml

settings:
  activation:
    show_context_report: true
    show_preload_report: true
    show_quick_commands: true
    quick_commands_limit: 6
  preload:
    context_task: "tasks/load-advisory-context.md"
    resolver_script: "scripts/resolve-advisory-context.cjs"
    profile_path: ".aiox/advisory-board/alan-nicolas-profile.yaml"
    sessions_root: "docs/advisory/"
    session_selector: "latest_by_filename_desc"
    output_path: "outputs/advisory-board/context/advisory-context-brief.json"
    privacy_contract: "local_gitignored_only"

handoffs:
  - squad: legal
    agent: legal-chief
    trigger: "Questões jurídicas identificadas nas deliberações do board"
  - squad: contabilidade
    agent: contabil-chief
    trigger: "Análise financeira e tributária necessária para decisões do board"
  - squad: franchise
    agent: franchise-chief
    trigger: "Revisão estratégica de modelo de franchising"

agents:
  - id: board-chair
    path: agents/board-chair.md
  - id: charlie-munger
    path: agents/charlie-munger.md
  - id: naval-ravikant
    path: agents/naval-ravikant.md

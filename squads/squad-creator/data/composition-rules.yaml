# Composition Rules — squad-creator
# Defines containment matrix, composition mechanisms, and instantiation rules
# for squads generated by this meta-squad.
#
# Reference: squads/sinkra-squad/data/composition-rules.yaml (gold standard)
# Created: 2026-04-12 (gap analysis vs sinkra-squad)

schema_version: "1.0.0"
squad: "squad-creator"
description: >
  Regras de composicao que o squad-creator aplica ao GERAR novos squads.
  Define como tokens, atoms, molecules, organisms, templates e instances
  devem ser compostos e validados.

# ═══════════════════════════════════════════════════════════════════
# CONTAINMENT MATRIX
# ═══════════════════════════════════════════════════════════════════
# Defines what each hierarchy level can contain and cannot contain.

containment_matrix:
  Token:
    can_contain: []
    contained_by: [Atom, Molecule]
    indivisible: true
    validation: "Must belong to exactly 1 family. Must have token_name and token_type."

  Atom:
    can_contain: [Token]
    contained_by: [Molecule, Organism]
    max_executors: 1
    validation: "Must have exactly 1 responsavel_type. Must have all 8 SINKRA fields."
    rule: "An Atom is the smallest executable unit. It cannot delegate to other Atoms."

  Molecule:
    can_contain: [Atom]
    contained_by: [Organism]
    min_atoms: 2
    max_atoms: 10
    validation: "Must declare atoms[] list. All referenced atoms must exist as task files."
    rule: "A Molecule groups 2+ Atoms in a reusable pattern. Composed tasks are Molecules."

  Organism:
    can_contain: [Molecule, Atom]
    contained_by: [Template]
    has_state_machine: true
    validation: "Must have a corresponding workflow file. State machine must be declared."
    rule: "An Organism is a complete pipeline with state transitions."

  Template:
    can_contain: [Organism]
    contained_by: [Instance]
    parameterized: true
    validation: "Must have placeholders ({variable}) for customization."
    rule: "A Template is an Organism with unresolved parameters."

  Instance:
    can_contain: [Template]
    contained_by: []
    immutable_after_creation: true
    validation: "All parameters resolved. Lifecycle tracking enabled."
    rule: "An Instance is a Template with all parameters resolved and persisted."

# ═══════════════════════════════════════════════════════════════════
# COMPOSITION MECHANISMS
# ═══════════════════════════════════════════════════════════════════

mechanisms:
  sequencing:
    description: "Atoms execute in declared order within a Molecule"
    enforcement: "Workflow step ordering. depends_on declarations."
    applies_to: [Molecule]

  aggregation:
    description: "Molecules combine into an Organism with state machine governance"
    enforcement: "Organism must have state_machine: true in config"
    applies_to: [Organism]

  parameterization:
    description: "Templates have {placeholders} resolved at instantiation time"
    enforcement: "Template files must use {variable} syntax. Instance resolves all."
    applies_to: [Template, Instance]

  checkpoint_gating:
    description: "Transitions between hierarchy levels require checkpoint passage"
    enforcement: "quality_gates[] in workflows. CP_PHASE_N checkpoints."
    applies_to: [Molecule, Organism]

  domain_transition:
    description: "Cross-domain handoffs require explicit declaration"
    enforcement: "domain_transition block in workflow phases"
    applies_to: [Organism]

  deviation_tracking:
    description: "Any departure from these rules must be logged in deviation-register.yaml"
    enforcement: "deviation-register.yaml entries with justification"
    applies_to: [all]

# ═══════════════════════════════════════════════════════════════════
# INSTANTIATION RULES
# ═══════════════════════════════════════════════════════════════════

instantiation:
  trigger: "*create or *upgrade command"
  persistence: ".aiox/squad-runtime/{squad-name}/"
  lifecycle_states:
    - CREATED
    - EM_EXECUCAO
    - COMPLETA
    - PAUSADA
    - BLOQUEADA
    - CANCELADA
    - ARQUIVADA
  immutable_after: COMPLETA
  requires:
    - config.yaml with pack.name
    - at least 1 agent in agents/
    - at least 1 task in tasks/
    - journey-log entry

# ═══════════════════════════════════════════════════════════════════
# VALIDATION RULES (applied by validate-squad and qa-after-creation)
# ═══════════════════════════════════════════════════════════════════

validation_rules:
  atom_integrity:
    check: "Every Atom has exactly 1 executor type"
    gate: "SC_QA_SCHEMA"
    severity: blocking

  molecule_completeness:
    check: "Every Molecule references only existing Atom files"
    gate: "SC_QA_REFERENCES"
    severity: blocking

  token_reconciliation:
    check: "Declared token count matches process-token-map entries"
    gate: "SC_QA_TOKENS"
    severity: warning

  hierarchy_consistency:
    check: "atomic_layer declarations match composition_mapping placement"
    gate: "SC_QA_STRUCTURE"
    severity: blocking

  domain_coverage:
    check: "Every task has a domain classification"
    gate: "SC_QA_COMPLETENESS"
    severity: warning

metadata:
  created_at: "2026-04-12"
  last_updated: "2026-04-12"
  source: "Gap analysis vs sinkra-squad gold standard"
  referenced_by:
    - config.yaml (sinkra_refs)
    - wf-qa-after-creation.yaml
    - wf-create-squad.yaml (generation rules)

# ═══════════════════════════════════════════════════════════════════
# Squad-Creator Infrastructure Map v2.0.0
# Comprehensive operational map of integrations, scripts, CI/CD,
# tool dependencies, resource constraints, and known gaps.
# ═══════════════════════════════════════════════════════════════════

meta:
  id: squad-creator-infrastructure-map
  version: 2.0.0
  purpose: "Mapa operacional completo das integracoes, scripts, superficies de execucao, CI/CD, tool dependencies e gaps do squad-creator."
  updated_at: "2026-04-12"
  source_config: "squads/squad-creator/config.yaml v6.0.0"

# ═══════════════════════════════════════════════════════════════════
# 1. SERVICE CATALOG (existing, expanded)
# ═══════════════════════════════════════════════════════════════════

service_catalog:
  skill-surface-projection:
    service_ref: local-skill-surface-runtime
    connection: "skills/"
    integration: "Sincronização de slash skills canônicas"
  runtime-state:
    service_ref: local-squad-runtime
    connection: ".aiox/squad-runtime/"
    integration: "Persistencia de estado, lifecycle e journey log"
  project context:
    service_ref: docs-read-gateway
    connection: "docs/"
    integration: "Leitura de contexto e templates corporativos"
  ecosystem-registry:
    service_ref: squad-registry-store
    connection: "squads/aiox-squad/data/ecosystem-registry.yaml"
    integration: "Consulta e atualização de catálogo"

integrations:
  - name: project_reader
    connection: "docs/"
    endpoint: local-filesystem
    mode: read_only
  - name: squad_runtime_state
    connection: ".aiox/squad-runtime/"
    endpoint: local-filesystem
    mode: read_write
  - name: skill_surface_projection
    connection: "skills/"
    endpoint: local-filesystem
    mode: read_write
  - name: ecosystem_registry
    connection: "squads/aiox-squad/data/ecosystem-registry.yaml"
    endpoint: local-filesystem
    mode: read_write
  - name: token_registry
    connection: "squads/aiox-squad/data/token-registry.yaml"
    endpoint: local-filesystem
    mode: read_only
  - name: runner_registry
    connection: "infrastructure/scripts/runner-lib/runner-registry.yaml"
    endpoint: local-filesystem
    mode: read_only
    note: "validate-squad registered as runner id in runner-registry.yaml"

# ═══════════════════════════════════════════════════════════════════
# 3. SCRIPTS INVENTORY
# ═══════════════════════════════════════════════════════════════════
#
# Each script is mapped to its runtime, referenced-by surface, and
# whether it is actively consumed by a workflow/task or orphaned.
#
# Reuse ratio calculated at bottom of this section.
#

scripts_inventory:

  # --- Validation scripts (Python) ---

  - id: checklist_validator.py
    runtime: python
    purpose: "Valida estrutura e completude de checklists de squad"
    referenced_by:
      - task: validate-squad-preflight
        invocation: "python3 scripts/checklist_validator.py squads/{squad_name}/checklists/ --all --output json"

  - id: coherence-validator.py
    runtime: python
    purpose: "Cross-reference coherence entre config, agents, tasks, workflows"
    referenced_by:
      - task: validate-squad-preflight
        invocation: "python3 scripts/coherence-validator.py --output json"
      - workflow: wf-create-squad
        invocation: "python scripts/coherence-validator.py"
    note: "Delegates to squad-creator-pro/scripts/coherence-validator.py if pro mode detected"

  - id: dependency_check.py
    runtime: python
    purpose: "Valida referencias internas e externas de dependencias"
    referenced_by:
      - task: validate-squad-preflight
        invocation: "python3 scripts/dependency_check.py squads/{squad_name}/ --output json"

  - id: naming_validator.py
    runtime: python
    purpose: "Valida convencoes de nomenclatura (kebab-case, prefixos)"
    referenced_by:
      - task: validate-squad-preflight
        invocation: "python3 scripts/naming_validator.py squads/{squad_name}/ --output json"

  - id: scoring.py
    runtime: python
    purpose: "Calcula score ponderado de qualidade do squad"
    referenced_by:
      - task: validate-squad-preflight
        invocation: "python3 scripts/scoring.py squads/{squad_name}/ --output json"
    note: "Delegates to squad-creator-pro/scripts/scoring.py if pro mode detected"

  - id: security_scanner.py
    runtime: python
    purpose: "Detecta API keys, secrets, e problemas de seguranca"
    referenced_by:
      - task: validate-squad-preflight
        invocation: "python3 scripts/security_scanner.py squads/{squad_name}/ --output json"

  - id: yaml_validator.py
    runtime: python
    purpose: "Valida YAML frontmatter de agents, tasks, e config"
    referenced_by:
      - task: validate-squad-preflight
        note: "Invoked indirectly via validate-squad pipeline"

  - id: inventory.py
    runtime: python
    purpose: "Scan completo de estrutura de squad para inventory"
    referenced_by:
      - task: upgrade-squad-inventory
        note: "Provides filesystem inventory data for upgrade workflow"

  - id: validate-squad-quality.py
    runtime: python
    purpose: "Quality scoring pipeline para squads"
    referenced_by:
      - workflow: wf-qa-after-creation
        note: "Part of mol-qa-pipeline"

  - id: validate-squad-structure.py
    runtime: python
    purpose: "Validacao de estrutura AIOX completa (dirs, artifact_contracts, duality)"
    referenced_by:
      - ci: validate-squads
        note: "Registered in infrastructure/scripts/runner-lib/squad-routing.yaml as entry for squad-creator"
      - command: "npm run validate:squad-structure"

  - id: squad-analytics.py
    runtime: python
    purpose: "Metricas e analytics do ecossistema de squads"
    referenced_by:
      - workflow: wf-ecosystem-analysis
        note: "Provides data for ecosystem health reports"

  - id: squad_utils.py
    runtime: python
    purpose: "Utility functions compartilhadas entre scripts Python"
    referenced_by:
      - script: "multiple Python scripts (shared lib)"
        note: "Imported by other .py scripts in this directory"

  - id: on-specialist-complete.py
    runtime: python
    purpose: "Hook callback quando um agente especialista completa uma task"
    referenced_by:
      - workflow: wf-create-squad
        note: "Callback hook for specialist agent completion in composed tasks"

  - id: refresh-registry.py
    runtime: python
    purpose: "Atualiza ecosystem-registry.yaml com dados atuais dos squads"
    referenced_by:
      - task: next-squad
        note: "Referenced in next-squad task for registry refresh"
      - workflow: wf-next-squad

  - id: sync-ide-skills.py
    runtime: python
    purpose: "Sincroniza agents publicaveis para superficies IDE (skills/)"
    referenced_by:
      - task: install-skills
        invocation: "python3 scripts/sync-ide-skills.py squad {squad_name}"
      - task: install-skills-prepare
      - task: install-skills-finalize
      - task: create-agent-publish
        invocation: "python3 scripts/sync-ide-skills.py agent {agent_id} --squad {squad_name}"
      - workflow: wf-install-skills
      - workflow: wf-sync-ide-skills

  - id: update-aiox-sync-config.py
    runtime: python
    purpose: "Atualiza .aiox-sync.yaml com novo squad/agent registrado"
    referenced_by:
      - task: create-agent-publish
        invocation: "python3 scripts/update-aiox-sync-config.py --squad {squad_name}"
      - task: create-squad-publish
        invocation: "python3 scripts/update-aiox-sync-config.py --squad {squad_name}"

  - id: update-claude-command-registry.py
    runtime: python
    purpose: "Atualiza command registry do Claude com novos comandos de squad"
    referenced_by:
      - task: create-agent-publish
        invocation: "python3 scripts/update-claude-command-registry.py"
      - task: create-squad-publish
        invocation: "python3 scripts/update-claude-command-registry.py"

  # --- Validation scripts (Bash) ---

  - id: validate-squad.sh
    runtime: bash
    purpose: "Entry point principal de validacao de squad (orquestra sub-validators)"
    referenced_by:
      - runner: validate-squad
        note: "Registered in infrastructure/scripts/runner-lib/runner-registry.yaml"
      - task: qa-check-completeness
      - task: validate-squad (composed)

  - id: validate-squad-deep.sh
    runtime: bash
    purpose: "Deep review com LLM (Opus/Haiku) para analise qualitativa"
    referenced_by:
      - task: validate-squad-deep-review
        invocation: "bash scripts/validate-squad-deep.sh squads/{squad_name}/ [--model opus|haiku] [--verbose]"

  - id: validate-all.sh
    runtime: bash
    purpose: "Executa todos os validators em sequencia"
    referenced_by:
      - workflow: wf-qa-after-creation
        note: "Umbrella validation for post-creation QA"

  - id: validate-report.sh
    runtime: bash
    purpose: "Gera relatorio consolidado de validacao"
    referenced_by:
      - workflow: wf-improve-workflow-from-report
        note: "validate-report phase"

  - id: validate-tokens.sh
    runtime: bash
    purpose: "Valida reconciliacao de tokens entre squad e token-registry central"
    referenced_by:
      - workflow: wf-qa-after-creation
        invocation: "scripts/validate-tokens.sh"
      - config: "process_token_contract.validation_script"

  - id: verify-squad-completeness.sh
    runtime: bash
    purpose: "Verifica completude estrutural de squad (dirs, files obrigatorios)"
    referenced_by:
      - workflow: wf-qa-after-creation
        note: "Part of completeness check pipeline"

  - id: rename-squad.sh
    runtime: bash
    purpose: "Script de rename estrutural de squad (map, structural, propagate, validate)"
    referenced_by:
      - workflow: wf-rename-squad
        note: "Underlying script for 4-phase rename workflow"

  - id: audit-autonomy.sh
    runtime: bash
    purpose: "Audita nivel de autonomia dos agents de um squad"
    referenced_by:
      - workflow: wf-ecosystem-analysis
        invocation: "bash scripts/audit-autonomy.sh"

  - id: audit-output-quality.sh
    runtime: bash
    purpose: "Audita qualidade dos outputs gerados por squads"
    referenced_by:
      - workflow: wf-ecosystem-analysis
        invocation: "bash scripts/audit-output-quality.sh content-engine carousel"

  - id: auto-healing-gate.sh
    runtime: bash
    purpose: "Gate de auto-healing que diagnostica e corrige erros operacionais"
    referenced_by:
      - workflow: wf-ecosystem-analysis
        invocation: "bash scripts/auto-healing-gate.sh"
      - workflow: wf-auto-heal

  # --- Generation scripts (Node.js) ---

  - id: generate-squad-greeting.js
    runtime: node
    purpose: "Gera script de greeting para ativacao de squad"
    referenced_by:
      - task: create-greeting-script-validate
        invocation: "node scripts/generate-squad-greeting.js {squad} {agent}"
      - workflow: wf-create-greeting-script

  - id: generate-squad-guide.js
    runtime: node
    purpose: "Gera guia de uso do squad (SQUAD-GUIDE.md)"
    referenced_by:
      - workflow: wf-create-squad
        note: "Post-creation documentation generation"

  - id: scaffold-squad.cjs
    runtime: node
    purpose: "Scaffolding estrutural de diretorio de squad a partir de templates"
    referenced_by:
      - workflow: wf-create-squad
        note: "Core scaffolding step in create-squad-build"

  - id: sync-chief-codex-skill.js
    runtime: node
    purpose: "Sincroniza skill do chief agent para surface Codex"
    referenced_by:
      - task: sync-chief-codex-skill
        invocation: "node scripts/sync-chief-codex-skill.js --squad {squad_name}"
      - task: create-agent-publish

  - id: export-antigravity-workflows.cjs
    runtime: node
    purpose: "Exporta workflows em formato antigravidade para visualizacao"
    referenced_by:
      - note: "Utility for workflow export/visualization"
      - status: orphan_candidate
        reason: "No direct task/workflow reference found in active pipeline"

  # --- Lib scripts (Node.js) ---

  - id: lib/config-loader.js
    runtime: node
    purpose: "Carrega e parsea config.yaml de squads"
    referenced_by:
      - script: "multiple Node.js scripts (shared lib)"

  - id: lib/squad-runtime-paths.cjs
    runtime: node
    purpose: "Resolve paths de runtime (.aiox/squad-runtime/) para squads"
    referenced_by:
      - script: "multiple Node.js scripts (shared lib)"

  - id: lib/validate-runtime-state.cjs
    runtime: node
    purpose: "Valida estado de runtime de squad (instance, artifact state)"
    referenced_by:
      - workflow: wf-setup-runtime
      - workflow: wf-operational-test

  # --- Kaizen scripts (Bash) ---

  - id: kaizen/kaizen-trigger.sh
    runtime: bash
    purpose: "Trigger para ciclo kaizen de self-improvement"
    referenced_by:
      - workflow: wf-self-improve
        note: "Entry point for kaizen self-improvement cycle"

  # --- Test scripts ---

  - id: tests/__init__.py
    runtime: python
    purpose: "Python test package init"
    referenced_by:
      - test_suite: true

  - id: tests/test_adapters.py
    runtime: python
    purpose: "Testa adapter functions"
    referenced_by:
      - test_suite: true

  - id: tests/test_assess_sources.sh
    runtime: bash
    purpose: "Testa avaliacao de fontes"
    referenced_by:
      - test_suite: true

  - id: tests/test_clone_review.sh
    runtime: bash
    purpose: "Testa clone review workflow"
    referenced_by:
      - test_suite: true

  - id: tests/test_fidelity_score.sh
    runtime: bash
    purpose: "Testa calculo de fidelity score"
    referenced_by:
      - test_suite: true

  - id: tests/test_refresh_registry_contract.py
    runtime: python
    purpose: "Testa contrato de refresh-registry"
    referenced_by:
      - test_suite: true

  - id: tests/test_squad_analytics.py
    runtime: python
    purpose: "Testa squad-analytics.py"
    referenced_by:
      - test_suite: true

  - id: tests/test_validate_squad_contextual_lifecycle.py
    runtime: python
    purpose: "Testa validacao de lifecycle contextual de squad"
    referenced_by:
      - test_suite: true

  - id: tests/test_validate_squad_tested_inference.py
    runtime: python
    purpose: "Testa inferencia do campo tested em squads"

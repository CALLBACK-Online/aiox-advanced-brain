# ═══════════════════════════════════════════════════════════════════
# 4. CI/CD INTEGRATION
# ═══════════════════════════════════════════════════════════════════

ci_cd_integration:
  ci_gate_yml:
    path: ".github/workflows/ci-gate.yml"

    jobs_consuming_squad_creator:

      - job_id: validate-squads
        enforcement: hard-mandatory
        description: "Valida config.yaml pack: e name: de todos os squads"
        triggers_on: "squads changed (detected by detect-layers job)"
        scripts_consumed:
          - "infrastructure/scripts/runner-lib/squad-routing.yaml (routes to squad-creator entry)"
          - "squads/squad-creator/scripts/validate-squad-structure.py"
        npm_command: "npm run validate:squads"
        allowed_failure: true
        note: "Listed in allowed-failures but enforcement is hard-mandatory when squads layer is changed"

      - job_id: validate-yaml
        enforcement: soft-mandatory
        description: "Valida todos os arquivos YAML/YML do repositorio"
        triggers_on: "any YAML file changed"
        scope: "All YAML files including squads/squad-creator/**/*.yaml"
        npm_command: "npm run validate:yaml"

  squad_validation_yml:
    path: ".github/workflows/squad-validation.yml"
    description: "Dedicated squad validation workflow"
    command: "npm run validate:squads"

  runner_registry:
    path: "infrastructure/scripts/runner-lib/runner-registry.yaml"
    entries:
      - id: validate-squad
        script_path: "squads/squad-creator/scripts/validate-squad.sh"
        squad: squad-creator

  squad_routing:
    path: "infrastructure/scripts/runner-lib/squad-routing.yaml"
    entries:
      - squad: squad-creator
        entry: "squads/squad-creator/scripts/validate-squad-structure.py"
        runners:
          - validate-squad

  local_ci_parity:
    validate_squads: "npm run validate:squads"
    validate_squad_structure: "npm run validate:squad-structure"
    validate_yaml_changed: "npm run validate:yaml:changed"

# ═══════════════════════════════════════════════════════════════════
# 5. EXTERNAL TOOL DEPENDENCIES
# ═══════════════════════════════════════════════════════════════════
#
# Tools used by squad-chief agent tasks at runtime.
# These are Claude Code built-in tools and MCP capabilities.
#

external_tool_dependencies:

  filesystem_tools:
    - tool: Glob
      usage: "File pattern discovery (squads/*/config.yaml, templates, tasks)"
      consumed_by:
        - task: create-squad-discover
        - task: upgrade-squad-inventory
        - task: detect-gaps
        - task: next-squad
      criticality: high

    - tool: Grep
      usage: "Content search across files (capability matching, reference validation)"
      consumed_by:
        - task: upgrade-squad-gap
        - task: qa-check-references
        - task: validate-squad-preflight
      criticality: high

    - tool: Read
      usage: "File content reading (config.yaml, agent personas, task definitions)"
      consumed_by:
        - task: "virtually all tasks"
      criticality: critical

    - tool: Write
      usage: "File creation (new squads, agents, tasks, workflows, reports)"
      consumed_by:
        - task: create-squad-build
        - task: create-agent-generate
        - task: create-task-generate
        - task: create-workflow-generate
      criticality: critical

    - tool: Edit
      usage: "File modification (config.yaml updates, registry entries)"
      consumed_by:
        - task: create-squad-publish
        - task: create-agent-publish
        - task: upgrade-squad-apply
      criticality: high

  research_tools:
    - tool: WebSearch
      usage: "External tool discovery and domain research"
      consumed_by:
        - workflow: wf-discover-tools
        - task: discover-tools-search
        - task: discover-tools-classify
      criticality: medium
      note: "Only used in discover-tools workflow family; not required for core creation"

  agent_tools:
    - tool: Agent
      usage: "Spawning sub-agents for composed tasks and parallel execution"
      consumed_by:
        - workflow: wf-discover-tools (parallel category research)
        - workflow: wf-ecosystem-analysis (multi-agent analysis)
        - workflow: wf-cross-provider-qualification (baseline vs candidate)
      criticality: medium

  bash_tool:
    - tool: Bash
      usage: "Script execution (validation scripts, sync scripts, generators)"
      consumed_by:
        - task: validate-squad-preflight (runs 6 Python validators)
        - task: validate-squad-deep-review (runs validate-squad-deep.sh)
        - task: create-greeting-script-validate (runs generate-squad-greeting.js)
        - task: install-skills (runs sync-ide-skills.py)
        - task: sync-chief-codex-skill (runs sync-chief-codex-skill.js)
        - workflow: wf-ecosystem-analysis (runs audit + healing scripts)
      criticality: critical

# ═══════════════════════════════════════════════════════════════════
# 6. RESOURCE CONSTRAINTS
# ═══════════════════════════════════════════════════════════════════

resource_constraints:

  quality_thresholds:
    quality_threshold: 8.5
    aiox_native_score: 8.0
    aiox_tier: Enterprise
    error_behavior: fail_loud
    on_validation_fail: block_publish
    on_generation_fail: emit_handoff
    on_runtime_error: persist_evidence

  workflow_scale:
    total_tasks: 140
    total_workflows: 24
    total_agents: 1
    total_checklists: 17
    total_data_files: 25
    supported_modes: 8

  artifact_lifecycle:
    states: [draft, pending_validation, validated, approved, rejected, consumed, superseded, archived]
    tracking_enabled: true
    state_persistence: ".aiox/squad-runtime/{squad-name}/artifact-state.yaml"

  instance_lifecycle:
    states: [CRIADA, EM_EXECUCAO, COMPLETA, PAUSADA, BLOQUEADA, CANCELADA, ARQUIVADA]
    tracking_enabled: true

  token_contract:
    tokens_declared: 29
    central_registry_family: squad_creator
    prefix: "TK-SC"
    range: "TK-SC-001..TK-SC-029"

  pro_mode_detection:
    enabled: true
    pro_path: "squads/squad-creator-pro/config.yaml"
    note: "Pro mode auto-detected; adds ecosystem-analyst agent, advanced scoring, mind cloning"

# ═══════════════════════════════════════════════════════════════════
# 7. KNOWN GAPS
# ═══════════════════════════════════════════════════════════════════

gaps:

  - id: GAP-SC-001
    area: scripts
    description: "export-antigravity-workflows.cjs has no active task/workflow consumer"
    impact: low
    recommendation: "Evaluate if still needed; remove or wire into wf-squad-overview if useful"

  - id: GAP-SC-002
    area: ci_cd
    description: "No dedicated CI job runs squad-creator test suite (tests/ directory)"
    impact: medium
    recommendation: "Add a validate-squad-creator-tests job to ci-gate.yml or integrate into validate-squads"

  - id: GAP-SC-003
    area: quality_policy
    description: "No explicit timeout or max creation window defined in config.yaml"
    impact: low
    recommendation: "Add quality_policy section with workflow timeouts (e.g., max_creation_window: 30m, analysis_timeout: 10m)"

  - id: GAP-SC-004
    area: scripts
    description: "Python scripts lack a requirements.txt or pyproject.toml for dependency pinning"
    impact: low
    recommendation: "Scripts appear to use only stdlib; document this explicitly or add a minimal requirements.txt"

  - id: GAP-SC-005
    area: ci_cd
    description: "validate-squads is in allowed-failures list despite being hard-mandatory"
    impact: medium
    recommendation: "Remove from allowed-failures to enforce hard gate, or downgrade enforcement label"

  - id: GAP-SC-006
    area: observability
    description: "No runtime metrics collection for script execution times"
    impact: low
    recommendation: "Add timing instrumentation to validate-squad.sh and scoring.py for performance baseline"

  - id: GAP-SC-007
    area: scripts
    description: "on-specialist-complete.py callback mechanism lacks documentation on trigger contract"
    impact: low
    recommendation: "Document expected callback payload and invocation context in script header"


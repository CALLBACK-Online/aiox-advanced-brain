schema: sinkra.eval-suite.fixtures.v1
experiment_id: EXP-RA-001
story: STORY-RA-EXP.1
created: "2026-05-19"

fixtures:
  - id: F1
    type: academic
    subtype: citation-heavy
    label: "Evidence grading for LLM-generated clinical summaries"
    query: >
      What is the current state of evidence grading systems applied to
      LLM-generated clinical summaries? Compare Sackett levels of evidence,
      GRADE framework, and Oxford CEBM with respect to applicability in
      automated research pipelines. Include systematic reviews and RCTs from
      2022-2026.
    primary_discriminating_dimensions:
      - citation_quality
      - claim_verifiability
    specialist_under_test: Sackett
    rationale: >
      Academic citation-heavy queries maximally exercise the citation_quality and
      claim_verifiability rubric dimensions. Sackett specialist (evidence grading)
      is the treatment arm's primary differentiator. If spawn provides quality uplift,
      it should be most visible here.
    expected_control_profile:
      coverage: 11
      citation_quality: 10
      claim_verifiability: 10
      narrative_coherence: 12
      actionability: 9
      total: 52
    expected_treatment_profile:
      coverage: 12
      citation_quality: 14
      claim_verifiability: 13
      narrative_coherence: 12
      actionability: 10
      total: 61
    expected_delta_percent: 17.3

  - id: F2
    type: product-discovery
    subtype: jtbd-premortem
    label: "Jobs-to-be-done analysis for AI research assistants: pre-mortem failure modes"
    query: >
      What are the primary jobs-to-be-done for knowledge workers using AI
      research assistants in 2025-2026? Apply pre-mortem analysis: what are the
      top 5 failure modes that would cause a deployed AI research assistant to be
      abandoned within 6 months? Include practitioner case studies and product
      teardowns.
    primary_discriminating_dimensions:
      - actionability
      - narrative_coherence
    specialist_under_test: Klein
    rationale: >
      Product-discovery queries maximally exercise actionability and narrative_coherence.
      Klein pre-mortem specialist (anticipatory failure analysis) is the treatment arm's
      primary differentiator for this fixture type. Recommendations from Klein spawn
      should be more concrete and failure-mode-specific than inline persona.
    expected_control_profile:
      coverage: 11
      citation_quality: 9
      claim_verifiability: 10
      narrative_coherence: 11
      actionability: 10
      total: 51
    expected_treatment_profile:
      coverage: 11
      citation_quality: 9
      claim_verifiability: 10
      narrative_coherence: 14
      actionability: 14
      total: 58
    expected_delta_percent: 13.7

selection_rationale: >
  F1 and F2 cover 2 of the 5 specialist types relevant to Sprint C (Sackett + Klein).
  Together they cover 4 of the 5 rubric dimensions as primary discriminators:
  citation_quality, claim_verifiability (F1) and narrative_coherence, actionability (F2).
  Coverage remains a secondary dimension in both — no fixture was added solely for coverage
  because inline persona already handles breadth well (KISS principle: test the riskiest
  dimension differentials only).

fixture_assignment_to_runs:
  control:
    run-1: F1
    run-2: F2
    run-3: F1
    run-4: F2
    run-5: F1
  treatment:
    run-1: F1
    run-2: F2
    run-3: F1
    run-4: F2
    run-5: F1

poc_mini:
  control_run: F1
  treatment_run: F1
  outcome: delta_zero_early_fail
  d3_triggered: true

# cost-latency.yaml — Run cost and latency aggregate
# Template: cost-latency.v1 | STORY-RA-0.1
# Generated by: cost_tracker.py aggregate
# Location when emitted: docs/research/{slug}/cost-latency.yaml
#
# Schema fields:
#   run_id                      : identifier (slug of the research run)
#   generated_at                : ISO-8601 timestamp
#   total_cost_usd              : float | null (null when cost_confidence_aggregate=unavailable)
#   cost_confidence_aggregate   : exact | approximate | unavailable
#       exact        = all phases counted via Anthropic SDK
#       approximate  = all phases counted, at least one via tiktoken
#       unavailable  = at least one phase had no counting method
#   total_wallclock_sec         : int (sum of phase wallclock_sec)
#   total_tokens.in             : int
#   total_tokens.out            : int
#   phases[]                    : per-phase cost entries (cost_per_phase from pipeline-state.yaml)
#   tool_calls[]                : per-phase tool-call entries (tool_calls_per_phase)
#
# cost_per_phase entry schema:
#   phase_id          : str
#   tokens_in         : int | null
#   tokens_out        : int | null
#   cost_usd_estimate : float | null  (NEVER 0 as fallback — use null for unavailable)
#   cost_confidence   : exact | approximate | unavailable
#   wallclock_sec     : float
#   recorded_at       : ISO-8601
#
# tool_calls_per_phase entry schema:
#   phase_id          : str
#   tool_name         : str   (WebSearch | WebFetch | Read | Write | Grep | Glob | ...)
#   count             : int
#   total_latency_ms  : int
#   failures          : int
#   recorded_at       : ISO-8601
#
# IMPORTANT: cost_usd_estimate and total_cost_usd are NEVER set to 0 as a
# fallback. Use null (Python None) when no counting method succeeded.
# This prevents false-positive cost signals in downstream heartbeat (RA-A.1).
# See extraction-no-fallbacks rule.


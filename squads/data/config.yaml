      - tasks/design-learning-outcomes.md
      - tasks/run-growth-experiment.md
      - tasks/build-attribution.md
  molecules:
    description: "Multi-clone tasks composing 2+ atoms"
    paths:
      - tasks/analyze-cohort.md
      - tasks/create-dashboard.md
  organisms:
    description: "End-to-end workflows orchestrating molecules"
    paths:
      - workflows/implement-customer-360.yaml
      - workflows/create-churn-system.yaml
      - workflows/implement-attribution.yaml
      - workflows/cohort-analysis-workflow.yaml
      - workflows/fix-completion-rate.yaml
      - workflows/optimize-community-workflow.yaml
      - workflows/cohorts-diagnostic.yaml
  templates:
    description: "Output templates for canonical artifacts"
    paths:
      - templates/customer-360-tmpl.yaml
      - templates/health-score-report-tmpl.yaml
      - templates/cohort-analysis-tmpl.yaml
      - templates/attribution-report-tmpl.yaml
      - templates/executive-report-tmpl.yaml
      - templates/community-health-tmpl.yaml
      - templates/learning-outcomes-tmpl.yaml
      - templates/churn-alert-tmpl.yaml
      - templates/dmmm-tmpl.yaml
      - templates/clv-report-tmpl.yaml
      - templates/cohorts/segmentation-rfm-tmpl.yaml
      - templates/cohorts/learning-journey-tmpl.yaml
      - templates/cohorts/community-health-cohort-tmpl.yaml
      - templates/cohorts/student-health-score-tmpl.yaml
      - templates/cohorts/icp-deep-analysis-tmpl.yaml
      - templates/cohorts/executive-summary-tmpl.yaml
  instances:
    description: "Per-business canonical outputs"
    paths_pattern: "docs/strategy/analytics/"


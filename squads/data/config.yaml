    clones: [avinash-kaushik, sean-ellis, peter-fader]
    phases: 4

  - id: cohort-analysis-workflow
    name: "Cohort Analysis Completo"
    clones: [peter-fader, sean-ellis, wes-kao, avinash-kaushik]

# ═══════════════════════════════════════════════════════════════════════════════
# OS 10 MANDAMENTOS (W3-02) — see data/governance-rules-registry.yaml for enforcement
# ═══════════════════════════════════════════════════════════════════════════════
governance_rules:
  ten_mandamentos:
    M1_uma_task_um_executor:
      description: "Each task has exactly one responsavel_type"
      enforcement: "responsavel_type field in AIOX_TASK_METADATA block (all 13 tasks)"
    M2_criterio_conclusao_pre_definido:
      description: "Every task declares acceptance_criteria before execution"
      enforcement: "acceptance_criteria field in AIOX_TASK_METADATA block"
    M3_logging_obrigatorio:
      description: "No silent failures — errors logged and escalated"
      enforcement: "error_handling field per task; output to outputs/data/{slug}/errors.log"
    M4_output_schema_validado:
      description: "Outputs follow declared schema"
      enforcement: "AIOX_TASK_METADATA + AIOX_CONTRACT blocks; templates/*.yaml"
    M5_quality_gates_threshold_numerico:
      description: "Every quality gate has numeric threshold"
      enforcement: "checkpoints[] with thresholds (see quality_gates section below)"
    M6_executor_types_4_canonical:
      description: "responsavel_type must be one of: Worker, Agent, Clone, Human"
      enforcement: "responsavel_type enum constraint in AIOX_TASK_METADATA"
    M7_desvios_formalizados:
      description: "Deviations from rules require formal registry entry"
      enforcement: "data/deviation-registry.yaml"
    M8_pipeline_sequencial:
      description: "Workflow phases execute in declared order"
      enforcement: "workflow.state_machine.transitions in workflows/*.yaml"
    M9_handoff_formal:
      description: "Inter-domain handoffs are explicit (no implicit context passing)"
      enforcement: "workflow.task_ref + agents_involved fields"
    M10_observabilidade_e2e:
      description: "Every execution writes a journey log entry"
      enforcement: "data/pipeline-execution-log.yaml — populated per execution"

  golden_rule:
    description: "Nunca implementar metrica sem passar por pelo menos 1 fundamentador (Tier 0)"
    enforced_by: "All workflows whose category in [analysis, alerts, reporting] MUST include peter-fader OR sean-ellis in clones[]"
    deviations_allowed_via: "data/deviation-registry.yaml"

# ═══════════════════════════════════════════════════════════════════════════════
# QUALITY GATES (W3-03) — numeric thresholds with 3-state model
# ═══════════════════════════════════════════════════════════════════════════════
quality_gates:
  states: [APPROVE, REVIEW, VETO]

  checkpoints:
    PV_PA_001_clv_quality:
      description: "CLV calculation passes Fader Customer Centricity checklist"
      checklist: "checklists/customer-centricity-checklist.md"
      threshold: 0.85  # 85% of items pass
      verdicts:
        APPROVE: ">= 0.85"
        REVIEW: ">= 0.70 AND < 0.85"
        VETO: "< 0.70"
      blocking: true
      applies_to: [calculate-clv, segment-rfm, analyze-cohort]

    PV_PM_001_health_score_quality:
      description: "Health Score model passes DEAR + threshold validation"
      checklist: "checklists/health-score-checklist.md"
      threshold: 0.80
      verdicts:
        APPROVE: ">= 0.80"
        REVIEW: ">= 0.65 AND < 0.80"
        VETO: "< 0.65"
      blocking: true
      applies_to: [design-health-score, predict-churn]

    META_AXIOMAS_data:
      description: "Data squad output coherence (Truth + Completeness + Coherence)"
      threshold: 7.0  # /10
      verdicts:
        APPROVE: ">= 7.0"
        REVIEW: ">= 5.5 AND < 7.0"
        VETO: "< 5.5"
      applies_to: "all_workflows"
      logged_to: "data/pipeline-execution-log.yaml"

    AIOX_QA_GATE:
      description: "Final AIOX compliance gate before artifact promotion to APPROVED"
      threshold: 80  # /100
      verdicts:
        APPROVE: ">= 80 AND 0 CRITICAL findings"
        REVIEW: ">= 70 OR has CRITICAL"
        VETO: "< 70"
      applies_to: "all_canonical_artifacts"

  fallback_mechanism:
    description: "If automated checkpoint fails, escalate to Clone+Human review"
    primary: "Clone (data-chief)"
    secondary: "Human:Squad_Operator"

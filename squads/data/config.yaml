    name: "Design Health Score"
    category: alerts
    clones: [nick-mehta, peter-fader]
    tier: 1
    file: "tasks/design-health-score.md"

  - id: predict-churn
    name: "Predict Churn"
    category: alerts
    clone: nick-mehta
    tier: 1
    file: "tasks/predict-churn.md"

  # Reporting

# Data Intelligence - Analytics Clone Squad v2.0
# Squad Configuration

pack:
  name: data
  title: "Data Intelligence - Analytics Clone Squad"
  version: "2.0.0"
  author: "AIOX Team"
  description: "Time de especialistas em analytics organizados por Tier para decisoes baseadas em dados"
  icon: "📊"
  slash_prefix: "data"

entry_agent: data-chief
tested: true

metadata:
  # MIGRATION-SCHEMA-001 backfill
  name: data
  status: active
  domain: data
  version: "2.0.0"
  score: 10.0

mmos_integration:
  enabled: false
  log_source: true
  fallback_behavior: "graceful"

  mind_mapping:
    # Tier 0 - Fundamentacao
    peter-fader: peter_fader
    sean-ellis: sean_ellis

    # Tier 1 - Operacionalizacao
    nick-mehta: nick_mehta
    david-spinks: david_spinks
    wes-kao: wes_kao

    # Tier 2 - Comunicacao
    avinash-kaushik: avinash_kaushik

# ═══════════════════════════════════════════════════════════════════════════════
# AGENTS - Organized by Tier
# ═══════════════════════════════════════════════════════════════════════════════
agents:
  - id: data-chief
    executor_profile:
      executor_type: Agent
      human_in_the_loop: true
      output_schema: "deliverable definido pela task ativa"
      story_role: executor
      can_execute: true
      core_replaces: null
      work_contexts: ["general"]
      can_review: []
    name: "Data Chief"
    role: "Orquestrador do squad - roteamento por tier e governança local"
    tier: orchestrator
    is_orchestrator: true

  # Tier 0 - Fundamentacao (ALWAYS first)
  # @peter-fader is the ORCHESTRATOR - CLV is the foundation of everything
  - id: peter-fader
    executor_profile:
      executor_type: Agent
      human_in_the_loop: true
      output_schema: "deliverable definido pela task ativa"
      story_role: executor
      can_execute: true
      core_replaces: null
      work_contexts: ["general"]
      can_review: []
    name: "Peter Fader"
    role: "Orquestrador & Customer Lifetime Value Expert"
    tier: 0
    is_orchestrator: true
    institution: "Wharton School"
    specialty: "CLV, RFM, Customer Segmentation, Tier Delegation"
    citations: "16,000+ (Google Scholar)"
    frameworks:
      - "Customer Centricity (4 pilares)"
      - "RFM Analysis"
      - "CLV Projection"
      - "Clone Selection Matrix"
    use_for:
      - "Orquestrar time e delegar para clone correto"
      - "Definir quem sao os melhores clientes"
      - "Calcular e projetar CLV"
      - "Segmentacao baseada em valor"
      - "Definir pesos do Health Score"
    not_for:
      - "Alertas operacionais de churn (delegar @nick-mehta)"
      - "Attribution de marketing (delegar @avinash-kaushik)"
      - "Metricas de comunidade (delegar @david-spinks)"

  - id: sean-ellis
    executor_profile:
      executor_type: Agent
      human_in_the_loop: true
      output_schema: "deliverable definido pela task ativa"
      story_role: executor

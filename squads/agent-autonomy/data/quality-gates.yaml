quality_gates:
  audit:
    evidence_queries:
      threshold: 3.0
    score_completeness:
      threshold: 1.0
    failure_mode_coverage:
      threshold: 1.0
    handoff_accuracy:
      threshold: 0.9
  diagnosis:
    root_cause_depth:
      threshold: 0.85
    evidence_backing:
      threshold: 0.8
    measurable_fix_ratio:
      threshold: 0.75
  architecture:
    autonomy_checklist_score:
      threshold: 0.72
    det_prob_split:
      threshold: 1.0
    halt_condition_defined:
      threshold: 1.0
  operations:
    aci_compliance:
      threshold: 1.0
    security_score:
      threshold: 0.8
    report_traceability:
      threshold: 0.9

veto_conditions:
  - id: AA_QG_001
    condition: "evidence_queries < 3.0"
    action: "HALT recommendation delivery"
  - id: AA_QG_002
    condition: "autonomy_checklist_score < 0.72"
    action: "Return to architecture phase"
  - id: AA_QG_003
    condition: "aci_compliance < 1.0"
    action: "Block tool recommendation"

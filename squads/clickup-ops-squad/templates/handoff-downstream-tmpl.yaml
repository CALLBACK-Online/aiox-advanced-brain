# Handoff Downstream Template — SINKRA Squad
# IMP-009: Formalizar handoff downstream como Worker deterministico
#
# Template usado pela task handoffDownstream (sinkra-task-011)
# para criar arquivo de handoff padronizado entre sinkra-squad
# e o downstream squad (squad-creator ou clickup-ops-squad).
#
# Placeholders: {{variable}} — resolvidos pelo Worker em runtime

handoff:
  id: "{{handoff_id}}"
  from: sinkra-squad
  to: "{{downstream_squad}}"  # squad-creator | clickup-ops-squad
  mode: "{{pipeline_mode}}"  # process | mission
  date: "{{date}}"
  status: pending  # pending | accepted | consumed

  # Routing metadata
  routing:
    pipeline_mode: "{{pipeline_mode}}"
    downstream_squad: "{{downstream_squad}}"
    downstream_entry_agent: "{{downstream_entry_agent}}"  # squad-chief | clickup-chief

  # Reference to the SINKRA output artifact (NOT duplicated — reference only)
  artifact:
    path: "{{sinkra_output_path}}"
    type: "{{artifact_type}}"  # sinkra-process-output | mission-output
    format: yaml

  # Artifact lifecycle state at handoff time
  lifecycle:
    state: draft
    created_at: "{{date}}"
    created_by: sinkra-squad/handoffDownstream
    accepted_at: null
    accepted_by: null
    consumed_at: null
    consumed_by: null

  # Compliance snapshot at handoff time
  compliance:
    qa_validation: PASS
    compliance_score: "{{compliance_score}}"

  # Process/Mission context for downstream consumption
  context:
    process_name: "{{process_name}}"
    pipeline_version: "{{pipeline_version}}"
    phases_completed: "{{phases_completed}}"

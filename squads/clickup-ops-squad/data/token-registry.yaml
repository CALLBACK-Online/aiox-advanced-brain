Time:
  description: Janela operacional, SLA e deadlines por Mission.
  examples:
  - mission_due_at
  - gate_deadline
Capacity:
  description: Limites de throughput e paralelismo dos runners.
  examples:
  - max_parallel_lists
  - runner_capacity
Threshold:
  description: Thresholds numéricos usados por gates e readiness.
  examples:
  - gate_score_min
  - health_signal_min
Priority:
  description: Priorização operacional e ordenação do DAG.
  examples:
  - critical_path
  - execution_priority
Permission:
  description: Permissões necessárias para escrita no ClickUp e sistemas adjacentes.
  examples:
  - clickup_write_scope
  - drive_publish_scope
Taxonomy:
  description: Convenções de nomenclatura e classificação de entidades.
  examples:
  - mission_phase
  - list_kind
Behavior:
  description: Comportamentos esperados dos automations e fallbacks.
  examples:
  - retry_policy
  - fallback_route
Accountability:
  description: Accountability humana explícita por atom e gate.
Mode:
  description: Modos canônicos SINKRA suportados pelo squad.
  allowed_values:
  - CRIAR
  - RESOLVER
  - GERENCIAR
  - ENTENDER
  - VALIDAR
  - CONFIGURAR
  - PLANEJAR
  - EXPLORAR
tokens:
- token_type: data
  token_name: handoffNormalizadoPronto
  token_value: handoff_normalizado disponível
  produced_by: atm_ingest_handoff
  consumed_by:
  - atm_validate_contract
  - atm_build_preflight
  domain: Operacional
  family: Taxonomy  # remapped: Data → Taxonomy [HUB-003]
- token_type: control

# QA Rubric — Slides Creator Squad
# Mission: MSN-2026-SLIDES-NARRATIVE-DESIGN (T-001)
# Created: 2026-05-17
# Version: 3.0.0
#
# SOT for all qa-inspector evaluations. Replaces the prior contracts/qa-rubric.md
# from docs/bench/slides-creator-open-source-absorption/ which was research-tier (15/100
# design weight). v3 reflects post-Mission rebalance + case-study learnings from
# Primeiro Servico de IA webinar.
#
# Approved by Mission Lead (Human:alan-nicolas) in mission-pitch.yaml.

meta:
  version: "3.0.0"
  status: active
  applies_to: "decks generated by /slide-creator post-GA-2026-05-19"
  grandfathering: "decks generated pre-GA use legacy PPTEval composite gates from config.yaml#quality_gates"
  schema_ref: "data/checkpoint-schema.yaml"

# ─────────────────────────────────────────────────────
# 6 DIMENSIONS (sum = 100)
# Rebalanced per Mission Lead approval:
#   Narrativa  25  (unchanged)
#   Design     25  (was 15 — promoted to peer of Narrativa)
#   Acuracia   20  (unchanged — sources, citations, factual fidelity)
#   Editabilidade 10  (was 20 — out-of-scope desta Mission)
#   Brand      10  (unchanged)
#   Tecnica    10  (was 10 — PPTEval composite kept here as legacy fallback)
# ─────────────────────────────────────────────────────
dimensions:

  narrativa:
    weight: 25
    description: "Pyramid + SCQA + Action Titles + Vertical Test + Story Arc + Slide Function"
    invariants_enforced: [P3, P4]
    sub_dimensions:
      - id: pyramid_mece
        weight_within: 4
        validator_ref: tasks/validate-pyramid.md
        scoring: "score 0-10; PASS >= 7"
      - id: vertical_flow
        weight_within: 4
        validator_ref: tasks/validate-vertical-flow.md
        scoring: "score 0-10; PASS >= 7"
      - id: action_title_rhetoric
        weight_within: 4
        validator_ref: tasks/validate-action-title-rhetoric.md
        scoring: "classification: executive_strong | executive_weak | descriptive_violation"
        gate: "0 descriptive_violation; <=20% executive_weak"
      - id: governing_thought_strength
        weight_within: 4
        validator_ref: tasks/validate-governing-thought-strength.md
        scoring: "score 0-10 com decomposicao claim/magnitude/implicacao"
      - id: scqa_depth
        weight_within: 3
        validator_ref: tasks/validate-scqa-depth.md
        scoring: "score 0-10 por bloco S/C/Q/A; composite avg"
      - id: story_arc
        weight_within: 3
        validator_ref: tasks/validate-story-arc.md
        scoring: "score 0-10; arco completo (tensao/prova/mecanismo/demo/CTA)"
      - id: slide_function_map
        weight_within: 3
        validator_ref: tasks/validate-slide-function-map.md
        scoring: "100% slides com funcao declarada; 0% slides funcao 'explicar topico'"

  design:
    weight: 25
    description: "Densidade, Hierarquia, Contraste, Legibilidade, Coerencia Visual"
    invariants_enforced: [P2]
    sub_dimensions:
      - id: density
        weight_within: 5
        validator_ref: tasks/validate-density.md
        scoring: "score 0-10; claims_per_slide vs grid_bound"
        gate: "max 1 governing claim + 3 supporting per slide"
      - id: hierarchy
        weight_within: 5
        validator_ref: tasks/validate-hierarchy.md
        scoring: "score 0-10; typography_scale + visual_weight ordering"
      - id: contrast
        weight_within: 5
        validator_ref: tasks/validate-contrast.md
        scoring: "score 0-10; WCAG AA per text/bg pair"
        gate: "contrast_ratio >= wcag_aa (text fg vs bg)"
      - id: readability
        weight_within: 5
        validator_ref: tasks/validate-readability.md
        scoring: "score 0-10; line_length + font_size_min + viewing_distance"
      - id: visual_coherence
        weight_within: 5
        validator_ref: tasks/validate-visual-coherence.md
        scoring: "score 0-10; cross-slide consistency (paddings/alignment/motif)"

  acuracia:
    weight: 20
    description: "Fontes APA, evidencia validada, P1 fidelity sampling, sem invencao"
    invariants_enforced: [P1, P5, P6]
    sub_dimensions:
      - id: fontes_apa
        weight_within: 8
        validator_ref: tasks/validate-fontes-apa.md
        scoring: "100% claims com source_ref APA-complete"
      - id: p1_fidelity
        weight_within: 5
        validator_ref: tasks/p1-fidelity-sampling.md
        scoring: "sample claims >= 10%; zero invented data"
      - id: enumeration_universal
        weight_within: 2
        validator_ref: tasks/validate-enumeration-universal.md
        scoring: "100% visuals com ID (Grafico N, Tabela N.M)"
        invariant_enforced: P5
      - id: evidence_ledger
        weight_within: 5
        validator_ref: tasks/validate-evidence-ledger.md
        scoring: "verdict PASS=10, CONCERNS=6, FAIL=0; coverage < 80% caps score at 6"
        gate: "verdict != FAIL AND coverage >= 80%"
        invariant_enforced: P1
    evidence_freshness_thresholds:
      global_default_years: 5
      _comment: >-
        Per-domain overrides deferred to ADR-054-amendment-1 after 20 production runs.
        Track via outputs/slides-creator/_monitoring/evidence-freshness-runs.jsonl.

  editabilidade:
    weight: 10
    description: "PPTX editavel - mantido com peso reduzido pois out-of-scope desta Mission"
    note: "Apenas validacao basica: PPTX abre sem repair, action titles em camada de texto"
    sub_dimensions:
      - id: opens_without_repair
        weight_within: 5
        scoring: "binary PASS/FAIL"
        gate: "PowerPoint abre sem prompt de repair"
      - id: action_title_text_layer
        weight_within: 5
        scoring: "binary PASS/FAIL per slide"
        gate: "action title nao rasterizado (texto editavel preservado)"
      - id: native_pptx_editability
        weight_within: 5
        scoring: "binary PASS/FAIL — gated only when enable_native_pptx_emission == true"
        gate: "verdict == PASS AND text_layer_preserved == true AND no_rasterized_action_titles == true"
        validator_ref: tasks/emit-native-pptx.md
        invariants_enforced: [P2, P4]
        note: "Mirrors KI-01 (opens without repair) + KI-02 (action title text layer) analogues for native PPTX path."

  brand:
    weight: 10
    description: "Brand tokens compliance, palette adherence, asset resolution"
    sub_dimensions:
      - id: brand_token_compliance
        weight_within: 5
        scoring: "token_usage percentage"
        gate: ">=95% AND 0 custom violations"
      - id: palette_adherence
        weight_within: 3
        validator_ref: tasks/resolve-active-palette.md
        scoring: "active_palette aplicada sem override nao registrado"
      - id: asset_resolution
        weight_within: 2
        scoring: "0 broken assets, 0 placeholder leftovers"

  tecnica:
    weight: 10
    description: "PPTEval composite legacy + export e diagramas tecnicos"
    note: "Mantida como fallback legacy. Dimensoes granulares novas (design) tem precedencia."
    sub_dimensions:
      - id: ppteval_composite
        weight_within: 5
        scoring: "Design, Content, Coherence, GAD scores 0-10"
        gate: "each >= 7 (legacy threshold preserved)"
      - id: export_integrity
        weight_within: 3
        scoring: "no broken links, all media embeds resolve"
      - id: diagrams_math
        weight_within: 2
        scoring: "diagrams render; math formulas legible"

# ─────────────────────────────────────────────────────
# KILLER ITEMS (any blocks release regardless of score)
# ─────────────────────────────────────────────────────
killer_items:
  - id: KI-01
    description: "PPTX nao abre OR pede repair"
    detected_by: opens_without_repair
    severity: blocking
    enforced_by: [emit-native-pptx, export-editable-pptx]
    enforcement_point: P06
    wired: true

  - id: KI-02
    description: "Action title rasterizado sem camada editavel"
    detected_by: action_title_text_layer
    severity: blocking
    enforced_by: [emit-native-pptx, validate-action-title]
    enforcement_point: P06
    wired: true

  - id: KI-03
    description: "Claim critico sem fonte APA-complete"
    detected_by: fontes_apa
    severity: blocking
    invariant: P6
    enforced_by: [validate-fontes-apa, validate-evidence-ledger]
    enforcement_point: P05
    wired: true

  - id: KI-04
    description: "Texto cortado em slide principal"
    detected_by: hierarchy
    severity: blocking
    enforced_by: [validate-hierarchy, validate-density]
    enforcement_point: P05
    wired: true

  - id: KI-05
    description: "Contraste ilegivel (texto principal abaixo do AA)"
    detected_by: contrast
    severity: blocking
    enforced_by: [validate-contrast]
    enforcement_point: P05
    wired: true

  - id: KI-06
    description: "Deck viola briefing aprovado (escopo divergente)"
    detected_by: human_visual_approval
    severity: blocking
    enforced_by: [review-presentation]
    enforcement_point: P05
    wired: true

  - id: KI-07
    description: "Action title classificado como descriptive_violation"
    detected_by: action_title_rhetoric
    severity: blocking
    invariant: P4
    enforced_by: [validate-action-title-rhetoric, validate-action-title]
    enforcement_point: P05
    wired: true

  - id: KI-08
    description: "Slide sem funcao narrativa declarada OR funcao = 'explicar topico'"
    detected_by: slide_function_map
    severity: blocking
    case_study_ref: "outputs/webinars/primeiro-servico-ia/ — draft v1 falha"
    enforced_by: [validate-slide-function-map, run-design-critique]
    enforcement_point: P04_5
    wired: true

  - id: KI-09
    description: "Numero de slides excede 2x do slide-function-map planejado"
    detected_by: slide_function_map
    severity: blocking
    rationale: "Outline-to-deck literalism (lesson Primeiro Servico de IA)"
    enforced_by: [validate-slide-function-map, run-design-critique]
    enforcement_point: P04_5
    wired: true

  - id: KI-10
    description: "Design direction artifact ausente OR identidade aplicada como skin (sem deck-stage real)"
    detected_by: visual_coherence + design_direction_yaml_present
    severity: blocking
    case_study_ref: "outputs/webinars/primeiro-servico-ia/"
    enforced_by: [validate-visual-coherence, run-design-critique]
    enforcement_point: P04_5
    wired: true

  - id: KI-11
    description: "Evidence Ledger verdict == FAIL OR contradicting_evidence_count > 0"
    detected_by: validate-evidence-ledger
    severity: blocking
    invariant: P1
    enforced_by: [validate-evidence-ledger]
    enforcement_point: P05
    wired: true
    rationale: >-
      P1 exige mais que formato APA. KI-11 verifica se a claim tem evidência
      semanticamente compatível, fresca o suficiente e sem contradição entre fontes.
    threshold_overrides:
      freshness_threshold_years: 5
      stale_evidence_max_percent: 20
      contradicting_evidence_tolerance: 0
    feature_flag: enable_ki_11_blocking

  # ─────────────────────────────────────────────────────
  # ABSORBED CROSS-FIT KILLERS (KI-12..KI-15) — 2026-05-20
  # Source: .claude/skills/slide-creator/templates/qa/visual-gates.yaml + copy-gates.yaml
  # Authority: .claude/rules/design-absolute-bans.md
  # ─────────────────────────────────────────────────────
  - id: KI-12
    description: "Font monoculture — render-lock uses Inter/Inter Tight in brand|pitch|marketing|creative register, OR italic-serif hero (Fraunces/Recoleta), OR generic AI font (Mona Sans, Plus Jakarta Sans, Space Grotesk, Instrument Sans)"
    detected_by: visual_gates.font_monoculture_gate
    severity: blocking
    score_weight: 20
    rationale: "Pre-publish refusal pattern. Cross-fit absorption from tasteskill.dev v2 Rule 1 + impeccable.style v3.0.7."
    pass_if:
      - "Fonts from allowed_sans (Geist | Outfit | Cabinet Grotesk | Satoshi)"
      - "Mono fonts from allowed_mono (Geist Mono | JetBrains Mono | IBM Plex Mono)"
      - "Inter allowed ONLY in technical product/dashboard registers"
    enforced_by: [validate-visual-coherence, run-design-critique]
    enforcement_point: P04_5
    wired: true
    invariant: P2
    absorbed_at: "2026-05-20"

  - id: KI-13
    description: "Eight absolute bans — deck violates any of the 8 canonical refuse-and-rewrite design patterns (side-stripe borders, gradient text, glassmorphism default, hero-metric template, identical card grids, modal-as-first-thought, em dashes, pure black/white)"
    detected_by: visual_gates.eight_absolute_bans_gate
    severity: blocking
    score_weight: 25
    rationale: "Cross-fit absorption from impeccable.style v3.1.1 absolute bans + tasteskill.dev v2 anti-patterns."
    bans:
      - "ban_01_side_stripe_borders: border-left/right >1px as colored accent"
      - "ban_02_gradient_text: background-clip:text + gradient background"
      - "ban_03_glassmorphism_default: decorative glass panels/blurs as default"
      - "ban_04_hero_metric_template: big number + small label + supporting stats SaaS cliché"
      - "ban_05_identical_card_grids: 3+ same-sized cards repeating without variation"
      - "ban_06_modal_as_first_thought: modal where inline/progressive disclosure was viable"
      - "ban_07_em_dashes: em dashes (—) or double-hyphens (--) in copy"
      - "ban_08_pure_black_or_white: #000 or #fff without brand tint (min_chroma 0.005)"
    enforced_by: [validate-visual-coherence, validate-density, run-design-critique]
    enforcement_point: P04_5
    wired: true
    invariant: P2
    absorbed_at: "2026-05-20"

  - id: KI-14
    description: "Jane Doe effect — copy uses generic AI-cliché placeholders (John Doe / Sarah Chen, fake numbers like 99.99%, startup-slop company names like Acme/Nexus, filler verbs like Elevate/Unlock, placeholder images, lorem ipsum)"
    detected_by: copy_gates.jane_doe_effect_gate
    severity: blocking
    score_weight: 20
    rationale: "Cross-fit absorption from tasteskill.dev v2 Jane Doe Effect (Section 7)."
    pass_if:
      - "Names are real or marked '[TODO: real name from {source}]'"
      - "Numbers feel organic (47.2%, +1 (312) 847-1928, $1,247,892) or are confirmed real"
      - "Companies have contextual brand names tied to the deck topic"
      - "Headlines use concrete verbs (e.g., 'Cut churn 31%', 'Ship 2x faster')"
      - "Images use picsum.photos/seed/{stable-string}/X/Y or branded SVG avatars"
    enforced_by: [validate-action-title-rhetoric, run-design-critique, review-presentation]
    enforcement_point: P04_5
    wired: true
    invariant: P4
    detection_regex:
      generic_names: '\b(John Doe|Jane Doe|Sarah (Chen|Chan)|Jack Su|Test User|Lorem User)\b'
      fake_numbers: '\b(99\.99%|99,99%|1234567|555-1234|\$1,000,000|\$99\.99|\$100)\b'
      startup_slop: '\b(Acme(\s+Corp)?|Nexus|SmartFlow|FlowSync|DataSync|ExampleCo|TestCo|StartupCo|TechFlow|CloudSync|AISync)\b'
      filler_words: '\b(Elevate|Unlock|Unleash|Seamless|Next-Gen|Best-in-class|Revolutionary|Disruptive|Cutting-edge|State-of-the-art|Empower|Streamline|Game-changing|Industry-leading|World-class)\b'
      placeholder_images: '(placeholder\.jpg|via\.placeholder\.com|unsplash\.com/random)'
      lorem_ipsum: '\bLorem ipsum\b'
    absorbed_at: "2026-05-20"

  - id: KI-15
    description: "Persona walkthrough failure — at least one declared persona (Alex/Jordan/Sam/Maria/Luis or briefing-specific personas) flags a red-flag during deck walkthrough (objection unanswered, evidence unconvincing, jargon barrier, CTA confusion)"
    detected_by: visual_gates.persona_walkthrough_gate
    severity: blocking
    score_weight: 15
    rationale: "Cross-fit absorption from tasteskill.dev v2 persona red-flag review. Forces audience-aware QA before delivery."
    pass_if:
      - "Each declared persona has a walkthrough record (persona_name, primary_objection, response_in_deck, verdict)"
      - "No persona produces 'red_flag' verdict on any of the 5 decisive slides (cover, reframe, mechanism, proof, CTA)"
      - "Persona-specific jargon barriers documented or removed"
    enforced_by: [review-presentation, run-design-critique]
    enforcement_point: P05
    wired: true
    invariant: P4
    absorbed_at: "2026-05-20"

# ─────────────────────────────────────────────────────
# RELEASE CRITERIA (gate aggregation)
# ─────────────────────────────────────────────────────
#
# SOT DECLARATION (Wave W2-06 — Mandamento 5)
# ─────────────────────────────────────────────────────
# This block is the CANONICAL SOURCE OF TRUTH for PPTEval thresholds.
# All other declarations (config.yaml#quality_gates, workflows/generate-presentation.yaml#qa_verdict,
# data/quality-gates.yaml) MUST $ref this file or remain advisory consumers.
#
# Scale: 0-10 sub-dimensions, 0-100 composite (overall_score).
# Why qa-rubric.yaml is SOT: most expressive (per-dim weights, killer items, rationale, calibration).
# ─────────────────────────────────────────────────────
sot:
  canonical: true
  consumers:
    - "squads/slides-creator/config.yaml#quality_gates"
    - "squads/slides-creator/workflows/generate-presentation.yaml#gates.qa_verdict"
    - "squads/slides-creator/data/quality-gates.yaml"
    - "squads/slides-creator/data/token-registry.yaml#quality_gate"

release_criteria:
  passed:
    overall_score_min: 85
    killer_items_max: 0
    narrativa_min: 7
    design_min: 7
    acuracia_min: 7
    pass_criteria: "overall_score >= 85 AND killer_items == 0 AND narrativa >= 7 AND design >= 7 AND acuracia >= 7 AND KI-11 != FAIL"
    evidence_ledger_gate: "verdict != FAIL AND KI-11 != FAIL"

  concerns:
    overall_score_range: [75, 84]
    killer_items_max: 0
    requires_human_ack: true

  failed:
    overall_score_max: 74
    OR_killer_items_min: 1
    auto_route_per: data/qa-routing-table.yaml

# ─────────────────────────────────────────────────────
# SCORING FORMULA
# ─────────────────────────────────────────────────────
scoring_formula:
  overall: "weighted_sum(dimension_score * dimension_weight) where dimension_score is mean(sub_dimensions)"
  scale: "0-100"
  precision: 1  # decimal places

  example_pass:
    narrativa: 9.2  # weighted_contribution = 23.0
    design: 8.8    # weighted_contribution = 22.0
    acuracia: 9.0  # weighted_contribution = 18.0
    editabilidade: 7.0  # weighted_contribution = 7.0
    brand: 9.0     # weighted_contribution = 9.0
    tecnica: 8.5   # weighted_contribution = 8.5
    overall_score: 87.5
    killer_items: 0
    verdict: PASS

# ─────────────────────────────────────────────────────
# VERSIONING & TRACEABILITY
# ─────────────────────────────────────────────────────
versioning:
  current: "3.0.0"
  previous: null  # squad never had a formal qa-rubric.yaml; v3 is canonical
  research_baseline: "docs/bench/slides-creator-open-source-absorption/contracts/qa-rubric.md (deprecated)"
  approved_by: "Human:alan-nicolas (Mission Lead, MSN-2026-SLIDES-NARRATIVE-DESIGN)"
  approved_date: "2026-05-17"
  bump_policy: "major bump requires Mission Lead approval + roundtable"

emission_protocol:
  emit_task: "emit-pipeline-log"
  emit_script: "squads/slides-creator/scripts/emit-pipeline-log.js"   # YOLO-5: implemented 2026-05-20
  emit_script_invocation: |
    node squads/slides-creator/scripts/emit-pipeline-log.js \
      --run-id <run_id> \
      --event <event_type> \
      --payload '<json>'
  valid_events: [workflow_started, phase_transition, gate_verdict, meta_axiom_breach, deviation_logged, killer_item_fired, workflow_completion]
  emit_frequency: "on phase transition + on gate verdict + on completion + on deviation log"
  storage_location: "outputs/slides-creator/{run_id}/pipeline-execution-log.yaml"
  retention_days: 30
  ci_check:
    rule: "Every workflow run MUST append at least 1 execution record"
    enforcement: "validate:pipeline-emission (CI advisory → blocking after grace period)"
    fail_condition: "workflow_run_id has no corresponding pipeline-execution-log record after T+1h"
  contract:
    record_required_on:
      - workflow_completion
      - gate_verdict (D01, D02, D03, D04, qa_verdict)
      - meta_axiom_breach (any of truth/completeness/coherence < 75)
      - deviation_logged (deviation-registry.yaml updated)
      - killer_item_fired (KI-01..KI-11)

consumers:
  - name: finops-chief
    purpose: "Cost aggregation per run, per business, per model"
    query_pattern: "cost_ledger.total_cost_usd GROUP BY squad, date"
  - name: kaizen-chief
    purpose: "Quality trend analysis, invariant-failure patterns"
    query_pattern: "compliance.invariants_enforced OVER time"
  - name: replay-tooling
    purpose: "Deterministic replay for debugging"
    query_pattern: "input.hash + correlation_id reconstructs phase sequence"

meta:
  gap_closed: GAP-002
  compatible_with: sinkra-v3.2
  observability_ready: true

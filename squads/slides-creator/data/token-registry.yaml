  - { id: ACTIVE_PALETTE,      template: "inline active-palette.yaml", producer: resolve-active-palette, consumer: [compose-grid-layout, emit-deck-spec, emit-native-pptx], lifecycle: [draft, approved] }
  - { id: VISUAL_STYLE_SIGNATURE, template: "inline visual-style-signature.yaml", producer: clone-visual-style-signature, consumer: [define-design-direction, register-palette-override], lifecycle: [draft, validated, approved], conditional: "reference_deck_or_brandbook provided" }

# ═══════════════════════════════════════════════════════════════════════
# FAMILY 5: Checkpoint Tokens
# ═══════════════════════════════════════════════════════════════════════
checkpoint:
  - id: D01
    phase: P01
    type: Human
    verdict_enum: [APPROVED, REJECTED, WAIVED]
    artifact_template: templates/checkpoint-schema.yaml
    sla_ladder_hours: [24, 72, 168]
  - id: D02
    phase: P02
    type: Human
    verdict_enum: [APPROVED, REJECTED, WAIVED]
    non_overridable_preconditions: ["vertical-test == PASS"]
  - id: D03
    phase: P03
    type: Human
    verdict_enum: [APPROVED, REJECTED, WAIVED]
    co_sign_required_on: "brand override present"
    co_signer: STK-10
  - id: D04
    phase: P04_5
    type: Computed
    verdict_enum: [PASS, ESCALATE, REVISE]
    source: "{output_dir}/critique-reports/iteration-{N}.yaml"
    pass_criteria: "critique_report.verdict in [PASS, ESCALATE]"
    iteration_cap: 2
    on_iteration_cap_reached: escalate_to_human
    killer_items_enforced: [KI-08, KI-09, KI-10]
    rationale: "Design Critique Loop verdict — auto-resolved by run-design-critique chain"
  - id: qa_verdict
    phase: P05
    type: Computed
    verdict_enum: [PASS, FAIL]
    pass_criteria: "narrative_dim >= 7 AND ppteval_composite >= 7"
    fail_router: { narrative: P01, spec: P03, vertical: P02 }


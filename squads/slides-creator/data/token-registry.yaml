  - { id: DESIGN_DIRECTION,     template: "inline design-direction.yaml", producer: define-design-direction, consumer: [compose-grid-layout, run-design-critique, emit-deck-spec], lifecycle: [draft, validated] }
  - { id: CRITIQUE_REPORT,      template: "inline critique-report.yaml", producer: run-design-critique, consumer: [apply-design-revision, qa_verdict], lifecycle: [draft, validated] }

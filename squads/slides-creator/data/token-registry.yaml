# AIOX Token Registry — slides-creator
# GAP-001 closure — 9 canonical AIOX families
# Version: 1.1.0
# Generated: 2026-04-20 | Last upgrade: 2026-05-20 Wave W4-04

schema_version: "1.1"
name: slides-creator-token-registry
owner_squad: slides-creator
aiox_framework: v3.2

# Wave W4-04 — Taxonomy reconciliation
# The 9 canonical AIOX families (tokens: section below) are the PRIMARY SOT.
# Additional top-level keys (process, task, executor, artifact, checkpoint, pattern,
# decision, quality_gate, handoff) are SPECIALIZATIONS — task-specific aspects of
# the canonical families. They do NOT compete; they refine.
taxonomy_relationship:
  primary: "tokens.{Family} — canonical 9 AIOX families (Time/Capacity/Threshold/Priority/Permission/Taxonomy/Behavior/Accountability/Mode)"
  specializations:
    process:      "Time × Mode — workflow phase contracts"
    task:         "Behavior × Accountability — task-level executor/output contracts"
    executor:     "Permission × Taxonomy — executor type metadata"
    artifact:     "Taxonomy — artifact registry entries"
    checkpoint:   "Threshold × Permission — gate verdicts"
    pattern:      "Behavior — reusable pattern catalog (SC-* namespace)"
    decision:     "Mode × Behavior — agent heuristic namespaces"
    quality_gate: "Threshold — numeric gate definitions (mirror of qa-rubric.yaml SOT)"
    handoff:      "Accountability × Mode — inter-task handoff contracts"
  rule: "When a token appears in BOTH primary family AND a specialization, the specialization MUST trace back via family field."

tokens:
  Time:
    examples: [phase_deadline, session_sla, render_timeout]
  Capacity:
    examples: [max_slide_count, source_batch_limit, qa_iteration_budget]
  Threshold:
    examples: [qa_pass_score, density_limit, evidence_gap_ratio]
  Priority:
    examples: [p0_blocker, p1_revision, p2_polish]
  Permission:
    examples: [human_approval_required, brand_override_cosign, devops_release_only]
  Taxonomy:
    examples: [slide_function, source_type, delivery_format]
  Behavior:
    examples: [fail_fast, no_fabrication, explicit_blocker]
  Accountability:
    examples: [producer, consumer, reviewer]
  Mode:
    examples: [CRIAR, VALIDAR, RESOLVER]

token_definitions:
  - { token_id: SLIDES_TIME_PHASE_DEADLINE, family: Time, name: phase_deadline }
  - { token_id: SLIDES_CAPACITY_MAX_SLIDES, family: Capacity, name: max_slide_count }
  - { token_id: SLIDES_THRESHOLD_QA_PASS, family: Threshold, name: qa_pass_score }
  - { token_id: SLIDES_PRIORITY_P0_BLOCKER, family: Priority, name: p0_blocker }
  - { token_id: SLIDES_PERMISSION_HUMAN_APPROVAL, family: Permission, name: human_approval_required }
  - { token_id: SLIDES_TAXONOMY_SLIDE_FUNCTION, family: Taxonomy, name: slide_function }
  - { token_id: SLIDES_BEHAVIOR_NO_FABRICATION, family: Behavior, name: no_fabrication }
  - { token_id: SLIDES_ACCOUNTABILITY_PRODUCER, family: Accountability, name: accountability_producer }
  - { token_id: SLIDES_MODE_CRIAR, family: Mode, name: mode_criar }

# ═══════════════════════════════════════════════════════════════════════
# FAMILY 1: Process Tokens
# ═══════════════════════════════════════════════════════════════════════
process:
  - id: SLIDES_CREATOR
    producer: squad meta
    consumers: [all atoms]
    description: "Root process identity"
  - id: GENERATE_PRESENTATION
    producer: workflow v2.0.0
    consumers: [slide-chief, create-presentation]
    description: "Main workflow Organism"

# ═══════════════════════════════════════════════════════════════════════
# FAMILY 2: Task Tokens (workflow + lifecycle atoms)
# ═══════════════════════════════════════════════════════════════════════
task:
  # Intake
  - { id: confirm-delivery-format,      phase: P00, session: null, producer: slide-chief, consumer: [normalize-briefing, decide-slide-architecture], artifact: delivery-format-decision.yaml }
  - { id: decide-slide-architecture,    phase: P00, session: null, producer: Worker, consumer: [define-design-direction, handoff-render-request], artifact: architecture-decision.yaml, conditional: "feature_flags.ENABLE_HTML_STANDALONE_RENDER == true" }
  - { id: load-kb-bundle,               phase: P00, session: null, producer: Worker, consumer: [content-architect, template-curator] }
  - { id: youtube-to-briefing,          phase: P00, session: null, producer: Worker, consumer: [normalize-briefing, route-sources], artifact: briefing-skeleton.json, conditional: "input_type == youtube" }
  - { id: normalize-briefing,           phase: P00, session: null, producer: slide-chief, consumer: [route-sources, catalog-sources-apa, distill-governing-thought] }
  - { id: route-sources,                phase: P00, session: null, producer: Worker, consumer: [ingest-multimodal-sources, ingest-prior-deck], artifact: routing-decisions.yaml, schema_ref: apps/squad-engine/openapi/slides.yaml#/components/schemas/RoutingDecision, wires: packages/slides-core/src/sources/router.ts }
  - { id: ingest-multimodal-sources,    phase: P00.5, session: null, producer: Worker, consumer: [extract-evidence-from-ingestions, validate-ingestion-bundle, catalog-sources-apa], artifact: ingestion-bundle.yaml, wires: packages/slides-core/src/ingestion/pipeline.ts }
  - { id: extract-evidence-from-ingestions, phase: P00.5, session: null, producer: Worker, consumer: [validate-ingestion-bundle, validate-evidence-ledger, catalog-sources-apa], artifact: claims-draft.yaml, wires: packages/slides-core/src/evidence/extract.ts }
  - { id: validate-ingestion-bundle,    phase: P00.5, session: null, producer: Worker, consumer: [catalog-sources-apa, distill-governing-thought, P00.5_gate], artifact: ingestion-bundle-report.json }
  - { id: ingest-prior-deck,            phase: P00.5, session: null, producer: Worker, consumer: [define-design-direction, select-chart-type], artifact: prior_deck_signals.yaml, conditional: "briefing.references[].extension == '.pptx'", wires: packages/slides-core/src/ingestion/pptx-reverse/index.ts#parsePptx }

  # Narrative
  - { id: catalog-sources-apa,          phase: P01, session: SESSION-NARR, producer: content-architect, consumer: [validate-fontes-apa, p1-fidelity-sampling] }
  - { id: distill-governing-thought,    phase: P01, session: SESSION-NARR, producer: content-architect, consumer: [build-pyramid] }
  - { id: build-pyramid,                phase: P01, session: SESSION-NARR, producer: content-architect, consumer: [apply-scqa, write-action-titles, validate-pyramid, emit-deck-spec] }
  - { id: apply-scqa,                   phase: P01, session: SESSION-NARR, producer: content-architect, consumer: [write-action-titles, validate-vertical-flow] }
  - { id: write-action-titles,          phase: P02, session: SESSION-NARR, producer: content-architect, consumer: [run-vertical-test, validate-action-title, emit-deck-spec] }
  - { id: compress-outline-to-slide-functions, phase: P02_5, session: SESSION-NARR, producer: content-architect, consumer: [validate-story-arc, validate-slide-function-map, define-design-direction, emit-deck-spec], artifact: story-arc.yaml + slide-function-map.yaml }
  - { id: run-vertical-test,            phase: P02, session: SESSION-QA,   producer: qa-inspector,     consumer: [D02_gate] }
  # Spec
  - { id: classify-slide-type,          phase: P03, session: SESSION-SPEC, producer: template-curator, consumer: [select-chart-type, compose-grid-layout] }
  - { id: select-chart-type,            phase: P03, session: SESSION-SPEC, producer: template-curator, consumer: [compose-grid-layout] }
  - { id: define-design-direction,      phase: P03_DIRECTION, session: SESSION-SPEC, producer: design-renderer, consumer: [compose-grid-layout, run-design-critique, emit-deck-spec], artifact: design-direction.yaml }
  - { id: compose-grid-layout,          phase: P03, session: SESSION-SPEC, producer: design-renderer,  consumer: [emit-deck-spec] }
  - { id: emit-deck-spec,               phase: P04, session: SESSION-SPEC, producer: design-renderer,  consumer: [P05_validators, handoff-render-request] }
  # Brand
  - { id: detect-brand-override,        phase: P03, session: SESSION-SPEC, producer: visual-scout,     consumer: [register-palette-override, resolve-active-palette] }
  - { id: clone-visual-style-signature, phase: P03, session: SESSION-SPEC, producer: Clone,            consumer: [define-design-direction, register-palette-override], artifact: visual-style-signature.yaml, conditional: "reference_deck_or_brandbook provided" }
  - { id: register-palette-override,    phase: P03, session: null,         producer: Human (STK-10),   consumer: [resolve-active-palette] }
  - { id: resolve-active-palette,       phase: P03, session: SESSION-SPEC, producer: visual-scout,     consumer: [compose-grid-layout, emit-deck-spec, handoff-render-request] }
  # QA
  - { id: validate-pyramid,             phase: P05, session: SESSION-QA,   producer: qa-inspector,     consumer: [qa_verdict] }
  - { id: validate-vertical-flow,       phase: P05, session: SESSION-QA,   producer: qa-inspector,     consumer: [qa_verdict] }
  - { id: validate-enumeration-universal, phase: P05, session: SESSION-QA, producer: qa-inspector,     consumer: [qa_verdict] }
  - { id: validate-fontes-apa,          phase: P05, session: SESSION-QA,   producer: qa-inspector,     consumer: [qa_verdict] }
  - { id: validate-evidence-ledger,     phase: P05, session: SESSION-QA,   producer: qa-inspector,     consumer: [qa_verdict, dimension_router], artifact: evidence-ledger.yaml, wires: packages/slides-core/src/evidence/validate.ts#buildEvidenceLedger }
  - { id: validate-action-title,        phase: P05, session: SESSION-QA,   producer: qa-inspector,     consumer: [qa_verdict] }
  - { id: validate-density,             phase: P05, session: SESSION-QA,   producer: qa-inspector,     consumer: [qa_verdict, dimension_router] }
  - { id: validate-hierarchy,           phase: P05, session: SESSION-QA,   producer: qa-inspector,     consumer: [qa_verdict, dimension_router] }
  - { id: validate-contrast,            phase: P05, session: SESSION-QA,   producer: qa-inspector,     consumer: [qa_verdict, dimension_router] }
  - { id: validate-readability,         phase: P05, session: SESSION-QA,   producer: qa-inspector,     consumer: [qa_verdict, dimension_router] }
  - { id: validate-visual-coherence,    phase: P05, session: SESSION-QA,   producer: qa-inspector,     consumer: [qa_verdict, dimension_router] }
  - { id: validate-governing-thought-strength, phase: P05, session: SESSION-QA, producer: qa-inspector, consumer: [qa_verdict, dimension_router] }
  - { id: validate-action-title-rhetoric, phase: P05, session: SESSION-QA, producer: qa-inspector, consumer: [qa_verdict, dimension_router] }
  - { id: validate-scqa-depth,          phase: P05, session: SESSION-QA,   producer: qa-inspector,     consumer: [qa_verdict, dimension_router] }
  - { id: validate-story-arc,           phase: P05, session: SESSION-QA,   producer: qa-inspector,     consumer: [qa_verdict, dimension_router] }
  - { id: validate-slide-function-map,  phase: P05, session: SESSION-QA,   producer: qa-inspector,     consumer: [qa_verdict, dimension_router] }
  - { id: p1-fidelity-sampling,         phase: P05, session: SESSION-QA,   producer: Human (reviewer), consumer: [qa_verdict] }
  # Critique Loop
  - { id: run-design-critique,          phase: P04_5, session: SESSION-DESIGN-CRITIQUE, producer: design-planner, consumer: [apply-design-revision, qa_verdict], artifact: critique-report.yaml }
  - { id: apply-design-revision,        phase: P04_5, session: SESSION-DESIGN-CRITIQUE, producer: design-renderer, consumer: [emit-deck-spec, validate-density, validate-hierarchy], artifact: design-revision.yaml }
  # Handoff
  - { id: handoff-render-request,       phase: P06, session: null, producer: design-renderer, consumer: [apps/ds runtime BLOCKED] }
  - { id: emit-native-pptx,             phase: P06, session: null, producer: Worker, consumer: [operator, qa_verdict], artifact: editability-report.json, conditional: "feature_flags.enable_native_pptx_emission == true", wires: packages/slides-renderer/src/index.ts#renderDeck }
  - { id: export-editable-pptx,         phase: P06, session: null, producer: Worker, consumer: [operator, qa_verdict], artifact: editable-pptx-export.yaml, conditional: "delivery_format.primary == 'C' OR delivery_format.secondary includes 'C'" }
  - { id: prepare-ds-presenter,         phase: P06, session: null, producer: Worker, consumer: [apps/ds runtime BLOCKED] }
  # CRUD
  - { id: create-presentation,          phase: P06, session: null, producer: Human (operator), consumer: [Human reviewer] }
  - { id: review-presentation,          phase: null, session: null, producer: Human (reviewer), consumer: [] }
  - { id: update-slides-creator,        phase: null, session: null, producer: Human (@architect), consumer: [] }
  - { id: delete-slides-creator,        phase: null, session: null, producer: Human (@devops), consumer: [] }


  - { id: validate-evidence-ledger, responsavel_type: Worker, session: SESSION-QA, phase: P05 }
  # --- EXISTING (referenced, not redefined)
  - { id: normalize-briefing,     responsavel_type: Agent,  phase: P00, existing: true }
  - { id: create-presentation,    responsavel_type: Agent,  phase: [P04, P06], existing: true }
  - { id: prepare-ds-presenter,   responsavel_type: Worker, phase: P06, existing: true }
  - { id: review-presentation,    responsavel_type: Agent,  phase: P05, existing: true }

# =============================================================================
# TRANSITIONS (condition-based edges)
# =============================================================================
transitions:
  - from: P00
    to: P00.5
    condition: "routing-decisions.yaml exists AND briefing.normalized.json exists"
    on_fail: halt_and_surface

  - from: P00.5
    to: P01
    condition: "ingestion-bundle-report.verdict == PASS AND claims-draft.yaml exists"
    on_fail: halt_and_surface

  - from: P01
    to: P02
    condition: "D01.status == approved"
    on_fail: halt_and_wait_for_approval

  - from: P02
    to: P03
    condition: "D02.status == approved AND vertical-test-result.verdict == PASS"
    on_fail: halt_and_wait

  - from: P03
    to: P04
    condition: "D03.status == approved AND active-palette.yaml exists"
    on_fail: halt_and_wait

  - from: P04
    to: P05
    condition: "deck-spec.yaml exists AND deck-manifest.json v2 valid"

  - from: P05
    to: P06
    condition: "qa-report.verdict == PASS"
    on_fail: dimension_router

  - from: P06
    to: complete
    condition: "deliverables emitted"

# =============================================================================
# DIMENSION ROUTER (QA FAIL fan-out)
# =============================================================================
dimension_router:
  narrative_fail:
    trigger: "validate-pyramid FAIL OR validate-vertical-flow FAIL OR validate-action-title FAIL"
    route_to: P01  # may re-run P02 if only action titles fail
  design_fail:
    trigger: "ppteval.design < 7 OR validate-enumeration-universal FAIL"
    route_to: P03
  spec_fail:
    trigger: "schema FAIL on deck-spec.yaml OR validate-fontes-apa FAIL"
    route_to: P04
  data_fidelity_fail:
    trigger: "p1-fidelity-sampling FAIL (10% spot-check)"
    route_to: P01  # re-extract with stricter prompt

# =============================================================================
# HANDOFF CONTRACTS (outbound)
# =============================================================================
handoffs:
  - to: downstream_renderer
    contract: render-request.yaml
    phase: P06
    bounded_context: BC-08
    consumer: slides-creator design-renderer (apps/ds runtime) OR slides-creator LLM-direct fallback
    fallback: handoff_only (render-request emitted, not consumed)

  - to: client
    contract: deliverables/
    phase: P06
    consumer: STK-01/STK-02/STK-03 audience + STK-07 client strategy team

# =============================================================================
# RELEASE CRITERIA
# =============================================================================
release:
  ready_when:
    - "All 6 phases completed"
    - "qa_verdict gate PASS"
    - "deliverables/ populated with 5 markdown files + deck-spec.yaml + render-request.yaml"
    - "Post-execution learning log written"

# =============================================================================
# BACK-COMPAT
# =============================================================================
back_compat:
  skip_narrative_mode:
    trigger: "flag --skip-narrative OR workflow.global.feature_flags.skip_narrative == true"
    bypass_phases: [P01, P02, P03_narrative_subset]
    reuses: "original v1.5 sequence (briefing → content → visual strategy → template → assets → render → qa → release)"
    version_marker: "workflow v1.5-compat"
    deprecation: "planned removal at v2.2 — 1 release after ADR-021 lands"

# =============================================================================
# PHASE EMIT MATRIX (Mandamento 10) — declarative emission for all phases + gates
# =============================================================================
# Every phase boundary and gate verdict emits a pipeline-execution-log.yaml record
# via squads/slides-creator/scripts/emit-pipeline-log.js. The orchestrator (slide-chief)
# is responsible for invoking this matrix when starting/ending each phase and after
# each gate verdict. The CI validator validate-pipeline-emission.js confirms every
# completed run has the expected records.
phase_emit_matrix:
  schema_version: "1.0.0"
  emitter: "squads/slides-creator/scripts/emit-pipeline-log.js"
  log_path: "outputs/slides-creator/{run_id}/pipeline-execution-log.yaml"

  phases:
    P00:
      on_enter: { event: workflow_started,  payload: { phase: P00, workflow_version: "4.1.0" } }
      on_exit:  { event: phase_transition,  payload: { from: P00, to: P00.5 } }
    P00.5:
      on_enter: { event: phase_transition,  payload: { from: P00, to: P00.5 } }
      on_exit:  { event: phase_transition,  payload: { from: P00.5, to: P01 } }
    P01:
      on_enter: { event: phase_transition,  payload: { from: P00.5, to: P01 } }
      on_exit:  { event: phase_transition,  payload: { from: P01, to: P02 } }
    P02:
      on_enter: { event: phase_transition,  payload: { from: P01, to: P02 } }
      on_exit:  { event: phase_transition,  payload: { from: P02, to: P02_5 } }
    P02_5:
      on_enter: { event: phase_transition,  payload: { from: P02, to: P02_5 } }
      on_exit:  { event: phase_transition,  payload: { from: P02_5, to: P03_DIRECTION } }
    P03_DIRECTION:
      on_enter: { event: phase_transition,  payload: { from: P02_5, to: P03_DIRECTION } }
      on_exit:  { event: phase_transition,  payload: { from: P03_DIRECTION, to: P03 } }
    P03:
      on_enter: { event: phase_transition,  payload: { from: P03_DIRECTION, to: P03 } }
      on_exit:  { event: phase_transition,  payload: { from: P03, to: P04 } }
    P04:
      on_enter: { event: phase_transition,  payload: { from: P03, to: P04 } }
      on_exit:  { event: phase_transition,  payload: { from: P04, to: P04_5 } }
    P04_5:
      on_enter: { event: phase_transition,  payload: { from: P04, to: P04_5 } }
      on_exit:  { event: phase_transition,  payload: { from: P04_5, to: P05 } }
    P05:
      on_enter: { event: phase_transition,  payload: { from: P04_5, to: P05 } }
      on_exit:  { event: phase_transition,  payload: { from: P05, to: P06 } }
    P06:
      on_enter: { event: phase_transition,  payload: { from: P05, to: P06 } }
      on_exit:  { event: workflow_completion, payload: { phase: P06, final_artifacts: deliverables_dir } }

  gates:
    D01:
      on_verdict: { event: gate_verdict, payload_template: { gate: D01, verdict: "{verdict}", approver: "{approver}", phase: P01 } }
    D02:
      on_verdict: { event: gate_verdict, payload_template: { gate: D02, verdict: "{verdict}", approver: "{approver}", phase: P02 } }
    D03:
      on_verdict: { event: gate_verdict, payload_template: { gate: D03, verdict: "{verdict}", approver: "{approver}", phase: P03 } }
    D04:
      on_verdict: { event: gate_verdict, payload_template: { gate: D04, verdict: "{verdict}", iteration: "{iteration}", phase: P04_5 } }
    qa_verdict:
      on_verdict: { event: gate_verdict, payload_template: { gate: qa_verdict, verdict: "{verdict}", ppteval: "{composite}", phase: P05 } }

  conditional_events:
    meta_axiom_breach:
      trigger: "validate-meta-axioms.js composite < 75"
      script: "squads/slides-creator/scripts/validate-meta-axioms.js"
      payload_template: { dim: "{dim_failed}", score: "{score}", threshold: 75 }
    deviation_logged:
      trigger: "advisory_mode gate bypass via data/deviation-registry.yaml"
      payload_template: { deviation_id: "{DEV-ID}", phase: "{phase}", gate: "{gate}" }
    killer_item_fired:
      trigger: "any KI-* failure during validation"
      payload_template: { ki_id: "{KI-NN}", phase: "{phase}", task: "{task}" }

  ci_gate:
    validator: "squads/slides-creator/scripts/validate-pipeline-emission.js"
    rule: "Every completed run must have pipeline-execution-log.yaml with >= 8 records (P00 workflow_started + 10 phase transitions + 1 qa_verdict minimum)"
    fail_workflow_if_missing: true
    npm_script: "validate:pipeline-emission"

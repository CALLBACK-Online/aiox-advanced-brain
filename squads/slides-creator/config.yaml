pack:
  name: slides-creator
  version: "9.1.0"
  description: >-
    Squad de agents especializados que automatizam o ciclo completo de geracao
    de slide decks profissionais: do briefing a entrega validada. Brand-agnostic
    por design -- gera slides para qualquer marca via {{handlebars}} e CSS variables.
    Baseado em SOP-SLIDES-003 (brand-agnostic), PPTEval (Design, Content, Coherence, GAD)
    e absorção v9 da disciplina narrativa McKinsey (Pyramid + SCQA + Action Titles + APA).

absorption_source: .aiox/squad-runtime/aiox-squad/criacao-slides-ia/

squad:
  name: slides-creator
  version: 9.1.0
  short-title: Slides Creator Squad
  description: >-
    Squad de agents especializados que automatizam o ciclo completo de geracao
    de slide decks profissionais: do briefing a entrega validada. Brand-agnostic
    por design -- gera slides para qualquer marca via {{handlebars}} e CSS variables.
    Baseado em SOP-SLIDES-003 (brand-agnostic) e PPTEval (Design, Content, Coherence, GAD).
  author: AIOX Community
  icon: "SC"
  entry_agent: slide-chief
  slashPrefix: SlidesCreator
  tested: true

metadata:
  # Canonical single-block metadata (MIGRATION-SCHEMA-001 legacy comment removed; collapsed duplicates)
  name: slides-creator
  status: active
  domain: slides-creator
  quality_score:
    value: 8.9
    scale: 0-10
    rubric: "internal AIOX assessment pre-upgrade"
    scored_at: "2026-04-18"
  # absorption_source removed (duplicate — canonical declaration at top-level line 11)

invariants:
  reference: data/principios-invioláveis.md
  items:
    - id: P1
      name: Fidelidade aos dados
      enforcement_level: code
      failure_mode: "Qualquer número/citação não rastreável à fonte = QA FAIL"
    - id: P2
      name: Especificação obsessiva
      enforcement_level: schema
      failure_mode: "SlideSpec sem hex/grid_coord/pt_size = schema validation FAIL"
    - id: P3
      name: Pyramid Principle + MECE
      enforcement_level: validator
      failure_mode: "Vertical test falha OU MECE violado = QA FAIL"
    - id: P4
      name: Action titles obrigatórios
      enforcement_level: validator
      failure_mode: "Título descritivo (ex: 'Análise de market share') = QA FAIL"
    - id: P5
      name: Enumeração universal
      enforcement_level: validator
      failure_mode: "Qualquer visual sem ID (Gráfico N, Tabela N.M) = QA FAIL"
    - id: P6
      name: Citação completa APA
      enforcement_level: schema
      failure_mode: "Citação sem {org, title, date, url, access_date} = schema FAIL"
    - id: P7
      name: Prompts de IA completos (10 componentes)
      enforcement_level: schema
      failure_mode: "Prompt IA com <10 componentes = schema FAIL"

# Pattern Library (SC-xxx)
pattern_library:
  prefix: SC
  naming_convention:
    format: "{PREFIX}-{CATEGORY}-{NUMBER}"
    example: "SC-TP-001"
  categories:
    - id: TP
      name: "Task Patterns"
      description: "Patterns for slide generation task structure"
    - id: EP
      name: "Executor Patterns"
      description: "Patterns for executor types and selection"
    - id: PP
      name: "Process Patterns"
      description: "Patterns for presentation workflow processes"
    - id: IP
      name: "Integration Patterns"
      description: "Patterns for brand config and template integration"
    - id: AP
      name: "Automation Patterns"
      description: "Patterns for automated slide generation"
    - id: DP
      name: "Documentation Patterns"
      description: "Patterns for slide documentation and SOPs"
  patterns: []

# Task Standards (SC-TP-001) — aligned 2026-05-20 (Wave W3-04) to actual task file structure
task_standards:
  enforce_anatomy: true
  validator: "SC-TP-001"
  # AIOX canonical 8 fields per Mandamento 1+2 (matches actual squads/slides-creator/tasks/*.md)
  required_fields:
    - task                # canonical task slug
    - atomic_layer        # Atom | Molecule | Organism
    - responsavel_type    # Human | Agent | Worker | Clone
    - Inputs              # array of {name, type, source, schema_ref}
    - Outputs             # array of {name, type, destination, lifecycle}
    - Pre_conditions      # array of preconditions
    - Post_conditions     # array of postconditions
    - Acceptance_criteria # array of completion predicates (Mandamento 2)
  required_when_automated:
    - Performance         # required when responsavel_type ∈ {Agent, Worker, Clone}
    - Error_handling      # required when responsavel_type ∈ {Agent, Worker, Clone}
  optional_fields:
    - Domain              # Strategic | Tactical | Operational (declared via HTML comment OR standalone)
    - session             # SESSION-* binding
    - bounded_context     # BC-* binding
    - invariants_enforced # P1-P7 list
    - phase               # P00..P06
    - duration            # qualitative range
    - handoff_token       # outbound handoff identifier
    - schema_ref          # external schema reference
    - feature_flag        # feature_flags gate
    - conditional         # conditional execution rule
    - conditional_on      # legacy alias for conditional
  # Legacy fields (pre-2026-05-20) — retained in some tasks; not enforced
  legacy_fields_alias:
    task_name: "→ task (slug form)"
    status: "moved to deviation-registry.yaml lifecycle (active/deprecated)"
    responsible_executor: "→ responsavel_type"
    execution_type: "→ responsavel_type"
    input: "→ Inputs"
    output: "→ Outputs"
    action_items: "→ Pre_conditions + Post_conditions"
    acceptance_criteria: "→ Acceptance_criteria (canonical capitalization)"
    estimated_time: "→ Performance.duration_target"
    dependencies: "→ Pre_conditions"
    templates: "moved to composition_mapping.templates"
    quality_gate: "moved to data/qa-rubric.yaml#release_criteria"
    handoff: "→ handoff_token"

# Executor Types
executor_types:
  human:
    id: "SC-EP-001"
    name: "Human Executor"
    characteristics:
      - judgment
      - creativity
      - brand_alignment
    cost: "$$$"
    speed: slow
    use_for:
      - "Brand config definition"
      - "Briefing creation"
      - "Final visual approval"
  agent:
    id: "SC-EP-002"
    name: "Agent Executor (AI)"
    characteristics:
      - analysis
      - generation
      - pattern_recognition
    cost: "$$$$"
    speed: fast
    use_for:
      - "Outline generation"
      - "TSX component generation"
      - "Quality evaluation"
      - "Template matching"
  hybrid:
    id: "SC-EP-003"
    name: "Hybrid Executor"
    status: deprecated   # Mandamento 1 — exactly 1 canonical executor per task. Migrate to sequential Agent+Worker or single Agent.
    deprecated_at: "2026-05-20"
    deprecation_rationale: "Violates AIOX Mandamento 1 (one executor per task). Replaced by sequential composition (Worker structural check + Agent reasoning) or single Agent if reasoning subsumes structural validation."
    characteristics:
      - ai_assisted
      - human_validated
    cost: "$$"
    speed: moderate
    use_for:
      - "Content review (LEGACY — use Agent)"
      - "Visual QA (LEGACY — use Agent)"
      - "Brand compliance check (LEGACY — use Agent)"
  worker:
    id: "SC-EP-004"
    name: "Worker Executor"
    characteristics:
      - deterministic
      - api_integration
      - file_operations
    cost: "$"
    speed: very_fast
    use_for:
      - "Image search and validation"
      - "WCAG contrast calculation"
      - "Lint and typecheck execution"

executor_selection:
  requires_creativity: human
  requires_judgment: [human, agent]      # hybrid removed (deprecated)
  requires_speed: [agent, worker]
  requires_consistency: worker
  requires_validation: agent             # hybrid → agent (Mandamento 1)
  requires_learning: agent

# Workflow Configuration
workflow_config:
  checkpoint_policy: always_active
  checkpoint_modes:
    always_active: "Every checkpoint MUST pass"
    skip_on_override: "Can skip with manual approval"
    advisory: "Only alerts, doesn't block"
  fail_fast: true
  allow_manual_override: false

# ═══════════════════════════════════════════════════════════════════════════════
# QUALITY GATES (Numeric Thresholds)
# ═══════════════════════════════════════════════════════════════════════════════
# SOT: PPTEval composite + sub-dimension thresholds = data/qa-rubric.yaml#release_criteria
# This block defines pipeline-stage gates (Worker-executable). PPTEval scoring is owned by qa-rubric.yaml.
# ═══════════════════════════════════════════════════════════════════════════════
quality_gates:
  - name: brand-token-compliance
    executor: Worker
    threshold: "token_usage >= 95% AND 0 custom violations"
    description: "Validates design token usage against brand config"
  - name: visual-regression
    executor: Worker
    threshold: "< 2% pixel diff from reference"
    description: "Pixel-level comparison with reference renders"
  - name: accessibility
    executor: Worker
    threshold: "0 WCAG AA violations"
    description: "Automated WCAG AA compliance scan"
  - name: ppteval-composite
    executor: Agent
    threshold: "Design >= 7, Content >= 7, Coherence >= 7, GAD >= 7"
    description: "PPTEval 4-dimension quality gate (existing slides-creator standard)"
  - name: human-visual-approval
    executor: Human
    threshold: "Explicit approval"
    required_for: "external-facing artifacts only"

# ═══════════════════════════════════════════════════════════════════════════════
# HANDOFF CONTRACT
# ═══════════════════════════════════════════════════════════════════════════════
handoff_contract:
  imports:
    - source: "docs/tactical/brand/"
      provides: "Brand config (colors, fonts, spacing, logo)"
    - source: "data/template-registry.yaml"
      provides: "56 canonical slide templates with provenance"
    - source: "data/SOP-SLIDES-003.md"
      provides: "Brand-agnostic generation rules"
  exports:
    - "Rendered slide deck (TSX/HTML)"
    - "QA report (PPTEval scores)"
    - "Normalized briefing (JSON)"


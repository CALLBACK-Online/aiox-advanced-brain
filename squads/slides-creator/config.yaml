    kb_bundle_ref: SESSION-SPEC
  - id: SESSION-QA
    owner: qa-inspector
    scope: independent_quality_gate
    kb_bundle_ref: SESSION-QA
  - id: SESSION-DESIGN-CRITIQUE
    owner: design-planner
    scope: critique_loop_and_revision_governance
    kb_bundle_ref: SESSION-DESIGN-CRITIQUE

# ═══════════════════════════════════════════════════════════════════════════════
# COMPOSITION MAPPING (AIOX v3.2 — GAP-003 closure)
# ═══════════════════════════════════════════════════════════════════════════════
composition_mapping:
  # Wave W4-05 — Token level added for AIOX hierarchy traceability (Token → Atom → Molecule → Organism)
  tokens:
    registry_ref: "squads/slides-creator/data/token-registry.yaml"
    canonical_families:
      - Time          # SLA, duration
      - Capacity      # parallel, iteration_cap
      - Threshold     # numeric gates
      - Priority      # P0..P3
      - Permission    # human approval, codeowners
      - Taxonomy      # domain, atomic_layer, executor enums
      - Behavior      # routing rules, error strategies
      - Accountability # producer/consumer/approver
      - Mode          # briefing|youtube|operator-driven
    note: "Tokens declared via token-registry.yaml#token_definitions; this section enables Token→Atom traceability for validators."
  atoms:
    narrative:
      - tasks/catalog-sources-apa.md
      - tasks/distill-governing-thought.md
      - tasks/build-pyramid.md
      - tasks/apply-scqa.md
      - tasks/write-action-titles.md
      - tasks/compress-outline-to-slide-functions.md
      - tasks/run-vertical-test.md
    spec:
      - tasks/define-design-direction.md
      - tasks/classify-slide-type.md
      - tasks/select-chart-type.md
      - tasks/compose-grid-layout.md
      - tasks/emit-deck-spec.md
    brand:
      - tasks/detect-brand-override.md
      - tasks/clone-visual-style-signature.md
      - tasks/register-palette-override.md
      - tasks/resolve-active-palette.md
    qa:
      - tasks/validate-pyramid.md
      - tasks/validate-vertical-flow.md
      - tasks/validate-enumeration-universal.md
      - tasks/validate-fontes-apa.md
      - tasks/validate-evidence-ledger.md
      - tasks/validate-action-title.md
      - tasks/validate-density.md
      - tasks/validate-hierarchy.md
      - tasks/validate-contrast.md
      - tasks/validate-readability.md
      - tasks/validate-visual-coherence.md
      - tasks/validate-governing-thought-strength.md
      - tasks/validate-action-title-rhetoric.md
      - tasks/validate-scqa-depth.md
      - tasks/validate-story-arc.md
      - tasks/validate-slide-function-map.md
      - tasks/p1-fidelity-sampling.md
    intake:
      - tasks/load-kb-bundle.md
      - tasks/youtube-to-briefing.md
      - tasks/confirm-delivery-format.md
      - tasks/decide-slide-architecture.md
      - tasks/normalize-briefing.md
      - tasks/route-sources.md
    ingestion:
      - tasks/ingest-multimodal-sources.md
      - tasks/extract-evidence-from-ingestions.md
      - tasks/validate-ingestion-bundle.md
      - tasks/ingest-prior-deck.md
    handoff:
      - tasks/handoff-render-request.md
      - tasks/prepare-ds-presenter.md
    render:
      - tasks/emit-native-pptx.md
      - tasks/export-editable-pptx.md
    critique:
      # Note: run-design-critique is a Molecule (orchestrates 10 sub-validators + aggregates verdict).
      # Listed here only as filesystem reference. Authoritative placement is composition_mapping.molecules.MOL-DESIGN-CRITIQUE below.
      # Resolved 2026-05-20 via /aiox-upgrade-squad R3 polish (Atom/Molecule duality eliminated).
      - tasks/apply-design-revision.md
    crud:
      # Note: create-presentation is an Organism entry-point (atomic_layer: Organism in task).
      # Listed here as user-facing CRUD operation; the actual Organism is ORG-GENERATE-PRESENTATION (workflows/generate-presentation.yaml).
      - tasks/create-presentation.md  # Organism alias — orchestrator atom
      - tasks/review-presentation.md
      - tasks/update-slides-creator.md
      - tasks/delete-slides-creator.md
  molecules:
    - { id: MOL-NARR-PYRAMID, atoms: [catalog-sources-apa, distill-governing-thought, build-pyramid, apply-scqa, write-action-titles, compress-outline-to-slide-functions] }
    - { id: MOL-INTAKE-ROUTING, atoms: [load-kb-bundle, youtube-to-briefing, confirm-delivery-format, decide-slide-architecture, normalize-briefing, route-sources] }
    - { id: MOL-INGESTION, atoms: [route-sources, ingest-multimodal-sources, extract-evidence-from-ingestions, validate-ingestion-bundle, ingest-prior-deck] }
    - { id: MOL-SPEC-EMISSION, atoms: [define-design-direction, classify-slide-type, select-chart-type, compose-grid-layout, emit-deck-spec] }
    - { id: MOL-BRAND-RESOLUTION, atoms: [detect-brand-override, clone-visual-style-signature, register-palette-override, resolve-active-palette] }
    - { id: MOL-QA-NARRATIVE, atoms: [validate-pyramid, validate-vertical-flow, validate-enumeration-universal, validate-fontes-apa, validate-evidence-ledger, validate-action-title, validate-density, validate-hierarchy, validate-contrast, validate-readability, validate-visual-coherence, validate-governing-thought-strength, validate-action-title-rhetoric, validate-scqa-depth, validate-story-arc, validate-slide-function-map, p1-fidelity-sampling, run-vertical-test] }
    # MOL-DESIGN-CRITIQUE: run-design-critique IS this molecule (orchestrating layer); apply-design-revision is its sole composed Atom. Updated 2026-05-20 R3.
    - { id: MOL-DESIGN-CRITIQUE, orchestrator: run-design-critique, atoms: [apply-design-revision] }
    - { id: MOL-HANDOFF, atoms: [handoff-render-request, prepare-ds-presenter] }
    - { id: MOL-RENDER-NATIVE, atoms: [emit-native-pptx, export-editable-pptx] }
  organisms:
    - { id: ORG-GENERATE-PRESENTATION, path: workflows/generate-presentation.yaml, molecules: [MOL-INTAKE-ROUTING, MOL-INGESTION, MOL-NARR-PYRAMID, MOL-SPEC-EMISSION, MOL-BRAND-RESOLUTION, MOL-DESIGN-CRITIQUE, MOL-QA-NARRATIVE, MOL-HANDOFF, MOL-RENDER-NATIVE] }
  templates:
    - templates/briefing.normalized.json
    - templates/deck-manifest.json
    - templates/qa-report.json
    - templates/README.md
    - templates/slide-archetypes/  # 7 archetypal spec templates (Wave B absorption)
    - data/template-registry.yaml
  instances:
    location: "outputs/slides-creator/{run_id}/"
    retention_days: 30
    pattern: "Per-execution instances indexed by correlation_id"


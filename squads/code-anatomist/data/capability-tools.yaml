# -------------------------------------------------------------------
# Capabilities (continued)
# -------------------------------------------------------------------

  semantic_code_search:
    priority: 6.0
    description: "Search code by structural patterns, not just text"
    tools:
      primary:
        - name: ast-grep
          type: cli
          note: "Already listed in ast_parsing. Dual-purpose tool."
          usage: "ast-grep -p 'if ($COND) { return $VAL; }' --lang js"

        - name: semgrep
          type: cli
          github: "semgrep/semgrep"
          stars: 14174
          last_commit: "2026-02-19"
          license: LGPL-2.1
          install: "pip install semgrep"
          languages: "30+"
          features: ["pattern_matching", "taint_analysis", "supply_chain", "custom_rules"]
          usage: "semgrep --config auto /path/to/code"

      advanced:
        - name: CodeQL
          type: cli
          github: "github/codeql"
          stars: 9246
          last_commit: "2026-02-18"
          license: MIT
          install: "Download from github.com/github/codeql-cli-binaries"
          features: ["semantic_analysis", "data_flow", "taint_tracking", "variant_analysis"]
          note: "Most powerful semantic search. Free for open-source/research. Commercial license for closed-source."

      ai_powered:
        - name: SeaGOAT
          type: cli
          github: "kantord/SeaGOAT"
          stars: 1265
          last_commit: "2026-02-18"
          license: MIT
          install: "pip install seagoat"
          features: ["natural_language_query", "vector_embeddings", "local_first"]
          note: "Search code with natural language. 100% local."

      alternative:
        - name: comby
          type: cli
          install: "brew install comby"
          features: ["structural_search", "structural_replace"]
          usage: "comby 'if :[cond] { :[body] }' '' -match-only /path/to/code"

# Squad Phase -> Tool Integration
phase_integration:
  phase_0_discovery:
    agent: ["eric-evans", "ronald-ross"]
    pre_analysis:
      - tool: scc
        purpose: "Codebase overview (languages, SLOC, complexity)"
        command: "scc --format json {source_path}"
      - tool: madge
        purpose: "Quick dependency visualization"
        command: "madge {source_path}/src --image deps.svg"
      - tool: ast-grep
        purpose: "Discover patterns and rule candidates"
        command: "ast-grep -p 'if ($COND) { throw $ERR }' --lang ts {source_path}"

  phase_1_characterization:
    agent: ["martin-fowler", "michael-feathers"]
    pre_analysis:
      - tool: code-maat
        purpose: "Identify hotspots and temporal coupling"
        command: "java -jar code-maat.jar -l project.log -c git -a revisions"
      - tool: lizard
        purpose: "Function-level complexity"
        command: "lizard {source_path} --csv > complexity.csv"
      - tool: dependency-cruiser
        purpose: "Architectural rule validation"
        command: "npx depcruise {source_path}/src --output-type dot | dot -T svg > arch.svg"
      - tool: gitinspector
        purpose: "Knowledge distribution across team"
        command: "gitinspector {source_path} --format json"

  phase_2_extraction:
    agent: ["michael-feathers", "ronald-ross"]
    pre_analysis:
      - tool: ast-grep
        purpose: "Extract rule patterns from code"
        command: "ast-grep -p 'validate($ARGS)' --json {source_path}"
      - tool: semgrep
        purpose: "Find complex rule patterns with taint analysis"
        command: "semgrep --pattern 'if ($COND1) { ... } else if ($COND2) { ... }' {source_path}"
      - tool: joern
        purpose: "Deep data flow analysis for complex rules"
        command: "joern --script extract-rules.sc"
        note: "Optional - for complex codebases only"

  phase_3_modeling:
    agent: ["barbara-von-halle", "james-taylor"]
    tools:
      - tool: dmn-js
        purpose: "Render and validate DMN decision tables"
      - tool: dmn-moddle
        purpose: "Generate DMN 1.3 XML from extracted rules"
      - tool: dmn-eval-js
        purpose: "Execute decision tables with test data in Node.js"

  phase_5_validation:
    agent: ["decoder-chief"]
    tools:
      - tool: pyDMNrules
        purpose: "Execute decision tables with test data"
      - tool: ast-grep
        purpose: "Verify rule patterns against source"
      - tool: semgrep
        purpose: "Validate pattern coverage across codebase"

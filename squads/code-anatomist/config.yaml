# AIOX v3.2 (RT-ARCH-BRIDGE-001 + AIOX audit 2026-04-04)
aiox_tier: "Pro"
process_id: SP-CODE-ANATOMIST-001

entity_bindings:
  tier: "Pro"
  entities_owned: []  # code-anatomist does not own domain entities — it extracts them
  entities_consumed:
    - entity_ref: "outputs/decoded/{slug}/"
      role: "reader"
      description: "Reads extraction outputs as baseline for compare/audit/adopt operations"
  domain_model_ref: "squads/aiox-squad/data/domain-model.yaml"

supported_modes:
  - ENTENDER
  - EXPLORAR
  - RESOLVER
  - PLANEJAR
  - VALIDAR
  - CRIAR


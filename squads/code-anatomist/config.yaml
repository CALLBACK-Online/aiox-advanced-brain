squad:
  name: code-anatomist
  title: "Code Anatomist Squad"
  version: "3.0.0"
  description: "Squad especializado em engenharia reversa completa de software — extrai arquitetura (C4/Arc42), domínio (DDD/SBVR), dados (ER/schema), API (OpenAPI), dependências e infraestrutura de qualquer codebase, com pipeline de 9 fases e mapeamento para AIOX Tokens"
  domain: software-reverse-engineering
  author: "AIOX Squad Creator"
  score: 7.5
  status: active
  created_at: "2026-02-18"
  last_updated: "2026-03-31"

capabilities:
  - "Extração de regras de negócio de sistemas brownfield (SBVR, DMN)"
  - "Mapeamento de domínios e bounded contexts (DDD)"
  - "Classificação de regras com taxonomia Ross (5 tipos)"
  - "Modelagem de decisões com Decision Model e DMN tables"
  - "Expressão de regras em RuleSpeak (zero ambiguidade)"
  - "Caracterização de código legado com testes de caracterização"
  - "Padronização de regras existentes (docs, spreadsheets, wiki)"
  - "Validação SBVR (45 itens) e qualidade de extração (54 itens)"
  - "Mapeamento de regras extraídas para AIOX Tokens"
  - "Architecture recovery and C4 diagramming (Arc42, Horseshoe Model)"
  - "Dependency graph extraction and module boundary detection"
  - "Data model extraction (ER diagrams, schema introspection)"
  - "API surface extraction (OpenAPI, GraphQL, gRPC contracts)"
  - "Infrastructure blueprint (Docker, CI/CD, env vars, deploy targets)"
  - "Conformance checking and architectural drift detection (Reflexion Models)"

tier_system:
  orchestrator: decoder-chief
  tier_0:

# Delta Report Template — *compare output
# Code Anatomist v3.0.0 — Molecule M2-Analyze
# Generated by: compare.md task

comparison:
  slug_a: "{baseline slug}"
  slug_b: "{reference slug}"
  date: "{ISO date}"
  analyst: "code-anatomist v3.0.0"
  objective: "{feature inspiration | refactor guidance | architecture benchmark | pattern adoption}"
  comparability_score: 0.0  # 0-1 based on stack similarity

dimensions_compared:
  - name: "{architecture | dependencies | data | domain | api | infra}"
    phase_a: "{phase dir in slug_a}"
    phase_b: "{phase dir in slug_b}"
    files_compared:
      - a: "{file in slug_a}"
        b: "{file in slug_b}"

deltas:
  patterns_in_b_not_a:
    - id: "DELTA-001"
      dimension: "{dimension}"
      pattern: "{pattern name}"
      description: "{what B has that A doesn't}"
      evidence_b: "{file:line in slug_b extraction}"
      severity: "{CRITICAL | HIGH | MEDIUM | LOW}"
      effort_to_adopt: "{S | M | L | XL}"
      value_if_adopted: "{description of benefit}"
      recommendation: "{adopt | investigate | skip}"

  patterns_in_a_not_b:
    - id: "DELTA-002"
      dimension: "{dimension}"
      pattern: "{pattern name}"
      description: "{what A has that B doesn't}"
      interpretation: "{competitive advantage | over-engineering | domain-specific}"

  patterns_different:
    - id: "DELTA-003"
      dimension: "{dimension}"
      concern: "{what both address differently}"
      approach_a: "{how A does it}"
      approach_b: "{how B does it}"
      tradeoff: "{analysis of pros/cons}"
      recommendation: "{keep_a | adopt_b | hybrid}"

  patterns_same:
    - id: "DELTA-004"
      dimension: "{dimension}"
      pattern: "{shared pattern}"
      confidence: "{HIGH — both use same approach}"

summary:
  total_deltas: 0
  patterns_in_b_not_a: 0
  patterns_in_a_not_b: 0
  patterns_different: 0
  patterns_same: 0
  top_adoption_candidates:
    - "{DELTA-ID}: {pattern} (severity: X, effort: Y)"
  overall_assessment: "{A is ahead | B is ahead | comparable | different domains}"

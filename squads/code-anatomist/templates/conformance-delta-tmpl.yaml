# Conformance Delta Template — *audit output
# Code Anatomist v3.0.0 — Molecule M2-Analyze
# Generated by: audit.md task (Gail Murphy Reflexion Model)

audit:
  slug: "{project slug}"
  date: "{ISO date}"
  baseline_date: "{date of extraction used as baseline}"
  baseline_age_days: 0
  analyst: "gail-murphy"
  scope: "{all | specific module}"

freshness:
  baseline_extraction_date: "{ISO date}"
  days_since_extraction: 0
  status: "{fresh (<30d) | aging (30-90d) | stale (>90d) | expired (>180d)}"
  recommendation: "{ok | consider re-extraction | re-extraction required}"

architecture_drift:
  reflexion_model:
    high_level_model_source: "phase-3-fusion/c4-container.md"
    mapping_rules:
      - source_pattern: "{glob}"
        module: "{module name}"
    convergences:
      - module_a: "{module}"
        module_b: "{module}"
        evidence: "{file:line}"
        status: "CONVERGENCE"
    divergences:
      - module_a: "{module}"
        module_b: "{module}"
        evidence: "{file:line}"
        status: "DIVERGENCE"
        severity: "{HIGH | MEDIUM | LOW}"
        category: "{structural | interface | layering | convention}"
        description: "{what changed since extraction}"
        recommendation: "{update extraction | fix code | accept}"
    absences:
      - module_a: "{module}"
        module_b: "{module}"
        status: "ABSENCE"
        description: "{expected dependency not found — was it removed?}"
  drift_ratio: "0%"
  risk_level: "{LOW | MEDIUM | HIGH | CRITICAL}"

dependency_drift:
  new_dependencies:
    - name: "{package}"
      added_in: "{file}"
      risk: "{LOW | MEDIUM | HIGH}"
  removed_dependencies:
    - name: "{package}"
      was_used_by: "{module}"
  version_changes:
    - name: "{package}"
      baseline_version: "{version}"
      current_version: "{version}"
      breaking: "{true | false}"

data_model_drift:
  new_tables:
    - name: "{table}"
      migration: "{migration file}"
  modified_tables:
    - name: "{table}"
      changes: ["{column added}", "{constraint changed}"]
  new_rls_policies: 0
  removed_rls_policies: 0

domain_drift:
  new_bounded_contexts: []
  modified_contexts:
    - name: "{context}"
      change: "{description}"
  new_business_rules: 0
  modified_business_rules: 0

summary:
  total_convergences: 0
  total_divergences: 0
  total_absences: 0
  overall_drift_ratio: "0%"
  risk_level: "{LOW | MEDIUM | HIGH | CRITICAL}"
  top_concerns:
    - "{description of most critical drift}"
  recommendation: "{code is aligned | minor drift acceptable | re-extraction needed | architecture review needed}"

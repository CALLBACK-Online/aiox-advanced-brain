# Static Fact Database Template — Phase 2
# Code Anatomist v3.0.0
# Generated by: data-specialist + michael-feathers

extraction:
  system: "{system_name}"
  slug: "{slug}"
  date: "{ISO date}"
  stack: "{detected stack}"
  tools_used: ["{tool1}", "{tool2}"]

modules:
  - name: "{module name}"
    path: "{directory path}"
    type: "{app | package | service | library}"
    language: "{primary language}"
    files_count: 0
    loc_estimate: 0

dependencies:
  internal:
    - from: "{module A}"
      to: "{module B}"
      type: "{import | call | data}"
      files:
        - "{file_path}:{line}"
  external:
    - name: "{package name}"
      version: "{version}"
      used_by: ["{module}"]

data_model:
  source: "{tbls | prisma | orm_inference | migration_replay}"
  confidence: "{HIGH | MEDIUM | LOW}"
  tables:
    - name: "{table_name}"
      columns_count: 0
      has_pk: true
      has_fk: true
      rls_policies: 0
  relationships:
    - from: "{table_a}"
      to: "{table_b}"
      type: "{1:1 | 1:N | M:N}"
      via: "{column_name}"

api_surface:
  source: "{openapi | fastapi_auto | route_scan | llm_inference}"
  confidence: "{HIGH | MEDIUM | LOW}"
  endpoints:
    - method: "{GET | POST | PUT | DELETE}"
      path: "{/api/resource}"
      handler: "{file_path}:{function}"
      auth_required: true

import_map:
  total_imports: 0
  cross_module_imports: 0
  circular_dependencies: []

confidence_summary:
  tool_extracted: "{percentage}%"
  llm_inferred: "{percentage}%"
  overall: "{HIGH | MEDIUM | LOW}"

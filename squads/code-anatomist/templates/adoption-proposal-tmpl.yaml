# Adoption Proposal Template — *adopt output
# Code Anatomist v3.0.0 — Molecule M3-Adopt
# Generated by: adopt.md task
# Handoff scope: inter_bu (requires human signoff)

adoption:
  id: "ADOPT-{NNN}"
  date: "{ISO date}"
  analyst: "code-anatomist v3.0.0"
  status: "draft"  # draft → proposed → approved → implementing → completed | rejected

source:
  project: "{source slug}"
  pattern: "{pattern name}"
  description: "{what the pattern does}"
  evidence:
    - file: "{path in source extraction}"
      detail: "{what this file shows about the pattern}"
  components:
    - name: "{component}"
      role: "{what it does in the pattern}"
      technology: "{tech used}"

target:
  project: "{target slug — usually allfluence}"
  module: "{target module — e.g., apps/worker}"
  current_state: "{description of how target currently handles this concern}"
  gap: "{what's missing compared to the pattern}"

impact_analysis:
  compatibility:
    score: "{HIGH | MEDIUM | LOW}"
    notes: "{stack compatibility assessment}"
  breaking_changes:
    - interface: "{what changes}"
      consumers: ["{affected modules}"]
      mitigation: "{how to handle}"
  effort:
    estimate: "{S (<2d) | M (2-5d) | L (5-10d) | XL (10-20d)}"
    breakdown:
      - task: "{sub-task}"
        effort: "{days}"
  risk:
    - risk: "{what can go wrong}"
      probability: "{HIGH | MEDIUM | LOW}"
      impact: "{HIGH | MEDIUM | LOW}"
      mitigation: "{how to mitigate}"
  value:
    quality_attribute: "{performance | modifiability | security | availability | deployability}"
    improvement: "{description of expected improvement}"
    measurable: "{metric before → after}"

adaptation:
  keep_from_source:
    - "{aspect to keep as-is}"
  change_for_target:
    - original: "{how source does it}"
      adapted: "{how we'll do it for AllFluence}"
      reason: "{why the change}"
  discard:
    - aspect: "{what to NOT adopt}"
      reason: "{why it doesn't apply}"

c4_diagrams:
  before: |
    ```mermaid
    C4Component
      title {module} — BEFORE adoption
    ```
  after: |
    ```mermaid
    C4Component
      title {module} — AFTER adoption
    ```

story_candidates:
  - title: "{feat/refactor: description}"
    type: "{feat | refactor | chore}"
    effort: "{S | M | L}"
    depends_on: []
    acceptance_criteria:
      - "{AC 1}"

handoff:
  from: "@decoder-chief"
  to: "@architect"
  scope: inter_bu
  signoff:
    required: true
    approver: "{human name}"
    approved_at: null
    approved: false
  lifecycle_state: created  # created → pending_acceptance → accepted → completed | rejected
  artifacts:
    - id: "adoption-proposal"
      type: "adoption-proposal"
      status: draft

adr_draft:
  title: "ADR-XXX: Adopt {pattern} from {source} for {target module}"
  status: Proposed
  context: "{why we're considering this}"
  decision: "{what we're proposing}"
  consequences:
    positive: ["{benefit}"]
    negative: ["{cost}"]
    neutral: ["{trade-off}"]

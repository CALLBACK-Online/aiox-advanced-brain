      source_path: "docs/getting-started.md"
      manifest: "sources/SOURCE-MANIFEST.yaml"
      type: documentation
    - title: "AIOX User Guide"
      source_path: "docs/guides/user-guide.md"
      manifest: "sources/SOURCE-MANIFEST.yaml"
      type: documentation
    - title: "Story Development Cycle"
      source_path: "docs/aiox-workflows/story-development-cycle-workflow.md"
      manifest: "sources/SOURCE-MANIFEST.yaml"
      type: documentation

validation:
  alignment_score: 98
  completeness_score: 100
  cognitive_load_balanced: true
  duration_realistic: true


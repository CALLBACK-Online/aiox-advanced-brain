version: 1
gates:
  - id: offer_clarity_gate
    gate: The offer is legible as outcome, mechanism, deliverables, guarantee, and next step.
    blocks_if:
      - Offer is only a feature list.
      - CTA is ambiguous.
      - Guarantee or risk reversal is missing for a paid offer.
    pass_if:
      - Buyer can answer what they get, why it works, why now, and what to do next.
    score_weight: 15
    absorbed_from: [copy_hormozi_offer_systems]

  - id: ethical_persuasion_gate
    gate: Persuasion is strong without fake urgency or manipulation.
    blocks_if:
      - Scarcity is not tied to real capacity, time, cohort, or bonus constraint.
      - Pain is amplified without empathy or solution path.
      - Claims exceed what evidence supports.
    pass_if:
      - Urgency, proof, and promise are honest and decision-helpful.
    score_weight: 15
    absorbed_from: [copy_jon_benson_vsl_frameworks, copy_hormozi_offer_systems]

  - id: avatar_language_gate
    gate: The deck uses the prospect's actual language where possible.
    blocks_if:
      - Copy uses generic marketing language while user supplied calls, DMs, surveys, or notes.
      - Objections are written from seller perspective only.
    pass_if:
      - Key slides mirror audience language, stage of awareness, and decision criteria.
    score_weight: 10
    absorbed_from: [copy_ry_schwartz_course_launch_frameworks, copy_mappings]

  - id: objection_gate
    gate: Objections are handled before the close.
    blocks_if:
      - Price, trust, time, ability, fit, or risk objections are ignored.
      - Objection slide argues instead of facilitating decision.
    pass_if:
      - Each major objection has a reframe, proof, or fit filter.
    score_weight: 10
    absorbed_from: [copy_ry_schwartz_course_launch_frameworks]

  - id: jane_doe_effect_gate
    gate: Slide copy uses real / contextual / organic content — never generic AI-cliché placeholders.
    authority: .claude/rules/design-absolute-bans.md §5
    blocks_if:
      - generic_names_detected: Copy contains "John Doe | Jane Doe | Sarah Chen | Sarah Chan | Jack Su | Test User | Lorem User"
      - fake_numbers_detected: Stats use "99.99% | 50% | 100%" round-or-too-clean, OR "1234567" sequential, OR "555-1234" lazy phone, OR "$1,000,000 / $99.99" round-money
      - startup_slop_names_detected: Company names include "Acme | Acme Corp | Nexus | SmartFlow | FlowSync | DataSync | ExampleCo | TestCo | StartupCo | TechFlow | CloudSync | AISync"
      - filler_words_detected: Headlines/CTA contain "Elevate | Unlock | Unleash | Seamless | Next-Gen | Best-in-class | Revolutionary | Disruptive | Cutting-edge | State-of-the-art | Empower | Transform (as filler) | Streamline | Game-changing | Industry-leading | World-class"
      - placeholder_images_detected: Image URLs match "placeholder.jpg | via.placeholder.com | unsplash.com/random" OR avatars are SVG egg / Lucide user icon
      - lorem_ipsum_detected: Body copy contains "Lorem ipsum dolor sit amet"
    pass_if:
      - Names are real or marked "[TODO: real name from {source}]"
      - Numbers feel organic (47.2%, +1 (312) 847-1928, $1,247,892) or are confirmed real
      - Companies have contextual brand names tied to the deck topic
      - Headlines use concrete verbs ("Cut churn 31%", "Ship 2x faster") — not filler abstractions
      - Images use picsum.photos/seed/{stable-string}/X/Y or branded SVG avatars
    score_weight: 20
    severity: P0
    absorbed_from: [tasteskill.dev v2 — Jane Doe Effect (Section 7)]
    detection_regex:
      generic_names: '\b(John Doe|Jane Doe|Sarah (Chen|Chan)|Jack Su|Test User|Lorem User)\b'
      fake_numbers: '\b(99\.99%|99,99%|1234567|555-1234|\$1,000,000|\$99\.99|\$100)\b'
      startup_slop: '\b(Acme(\s+Corp)?|Nexus|SmartFlow|FlowSync|DataSync|ExampleCo|TestCo|StartupCo|TechFlow|CloudSync|AISync)\b'
      filler_words: '\b(Elevate|Unlock|Unleash|Seamless|Next-Gen|Best-in-class|Revolutionary|Disruptive|Cutting-edge|State-of-the-art|Empower|Streamline|Game-changing|Industry-leading|World-class)\b'
      placeholder_images: '(placeholder\.jpg|via\.placeholder\.com|unsplash\.com/random)'
      lorem_ipsum: '\bLorem ipsum\b'

  - id: ai_slop_score_gate
    gate: Overall AI-slop probability score across deck copy is below threshold.
    authority: .claude/rules/design-absolute-bans.md §3
    blocks_if:
      - score_above_60: Deck-wide ai_slop_score (computed from jane_doe_effect_gate + visual gates) exceeds 60
    pass_if:
      - score_below_40: Deck-wide ai_slop_score < 40 (target)
    score_weight: 15
    severity: P0
    absorbed_from: [impeccable.style v3.1.1 + tasteskill.dev v2]
    threshold_actions:
      0-20: pass
      21-40: warn
      41-60: review (manual gate)
      61-80: block (rebrief required)
      81-100: hard-block (full rebrief)


$schema: https://json-schema.org/draft-07/schema#
$id: https://sinkra/slide-creator/job-state.schema
title: SlideCreator Job State
version: 3
description: >
  JSON Schema for the slide-creator JobState persisted per run. Aligned with
  the shipping runtime in packages/slides-core/src/types/index.ts. Required
  governance fields are implemented on the runtime; deferred capabilities
  live in runtime-gap-absorption-corpus.yaml, not in this schema.

x-changelog:
  - version: 3
    date: 2026-05-19
    summary: >
      PR-W3f — naming/versioning alignment. Promotes command, mode, inputs,
      source_of_truth_policy, stage, export_report_path, and render_lock_path
      into the schema because they are now implemented in slides-core runtime.
      Adds explicit runtime-info surface contract via packages/slides-core/src/runtime-info.ts.
    references:
      - packages/slides-core/src/types/index.ts
      - packages/slides-core/src/runtime-info.ts
      - packages/slides-core/src/render-lock/enforce.ts
      - packages/slides-core/src/export/verify.ts
    changes:
      - "x-deferred-fields emptied; implemented fields moved into required/properties"
      - "artifacts.export_report_path and artifacts.render_lock_path documented"
      - "stage enum documented for pipeline boundary observability"
      - "schema remains data schema_version 1.0.0; document version bumped to 3"
  - version: 2
    date: 2026-05-19
    summary: >
      Realign schema to shipping JobState (Decision #1 Option B, UNANIMOUS
      6/6). Source: docs/architecture/roundtable-slide-creator-alignment-2026-05-19.md.
    references:
      - docs/architecture/roundtable-slide-creator-alignment-2026-05-19.md
      - docs/architecture/ADR-SLDC-CT-001-contract-alignment.md
      - docs/audits/slide-creator-runtime-audit-2026-05.md
      - packages/slides-core/src/types/index.ts
    changes:
      - "status enum realigned to [queued, running, reflecting, rendering, completed, failed, cancelled] per packages/slides-core/src/types/index.ts lines 8-15 (collapsed planning+drafting → running; reviewing → reflecting; removed waiting and partial; deferred packaging)"
      - "required fields realigned to those actually persisted on JobState today (run_id, schema_version, status, created_at, updated_at, provider, artifacts, progress, errors, reflection_iterations)"
      - "removed v1 fields (job_id, job_type, task_records, progress_events, export_policy, policy, error_details, final_verdict) that do not exist on the shipping JobState; the live runtime keys are documented under properties"
      - "command, mode, inputs, source_of_truth_policy moved to x-deferred-fields per GAP-RT-002 / GAP-RT-012 (constitutional Art IX, governance finding GF-02)"
      - "schema converted to JSON-Schema draft-07 with explicit $id for tooling reuse (was untyped YAML object before)"
  - version: 1
    date: 2026-04
    summary: >
      Original aspirational JobState schema (with job_type union, task_records,
      progress_events, final_verdict). Superseded by v2 after runtime audit
      revealed JobState type ships a much narrower surface.

type: object
required:
  - schema_version
  - run_id
  - status
  - created_at
  - updated_at
  - provider
  - artifacts
  - progress
  - errors
  - reflection_iterations
  - command
  - mode
  - inputs
  - source_of_truth_policy

properties:
  schema_version:
    type: string
    const: "1.0.0"
    description: >
      Pinned to "1.0.0" by the runtime type. Bump only via coordinated
      type-level migration in packages/slides-core/src/types/index.ts.
  run_id:
    type: string
    description: Stable identifier for the run; primary key across all artifacts.
  status:
    type: string
    enum:
      - queued
      - running
      - reflecting
      - rendering
      - completed
      - failed
      - cancelled
    description: >
      Job lifecycle state per packages/slides-core/src/types/index.ts:8-15.
      Phase-level granularity within 'running' is observable via
      stage_started events with phase substrings (normalize_briefing /
      compose_deck_spec / critique_loop / compile_native_ir).
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  provider:
    type: object
    description: ProviderConfig per packages/slides-core/src/types/index.ts:17-33.
    required:
      - mode
    properties:
      mode:
        type: string
        enum: [dummy, codex, ollama, byok]
      model:
        type: string
      base_url:
        type: string
      api_key_env:
        type: string
        description: >
          Always read from environment, never persisted on disk. The runtime
          never logs this field. Secret-safe by design.
      codex_bin:
        type: string
        description: Optional binary override; used by tests to inject mocks.
      codex_timeout_ms:
        type: integer
        description: Optional hard timeout for codex calls. Default 90s.
  artifacts:
    type: object
    description: >
      File-path map of artifacts produced during this run. Keys reflect the
      pipeline outputs persisted to disk by the runtime; values are
      filesystem paths (typically inside the run directory).
    properties:
      briefing_path:
        type: string
      deck_spec_path:
        type: string
      native_ir_path:
        type: string
      pptx_path:
        type: string
      editability_report_path:
        type: string
      reflection_log_path:
        type: string
      qa_report_path:
        type: string
      export_report_path:
        type: string
        description: Path to export-report.yaml written by the export verification gate.
      render_lock_path:
        type: string
        description: Path to render-lock.yaml written at job creation and consulted at edit/export gates.
  progress:
    type: object
    required:
      - phase
      - pct
    properties:
      phase:
        type: string
        description: >
          Free-text phase label emitted by the pipeline. Canonical substrings
          today: normalize_briefing, compose_deck_spec, critique_loop,
          compile_native_ir. Use stage_started events for boundary signals.
      pct:
        type: number
        minimum: 0
        maximum: 100
  errors:
    type: array
    items:
      type: object
      required:
        - phase
        - message
        - at
      properties:
        phase:
          type: string
        message:
          type: string
        at:
          type: string
          format: date-time
  reflection_iterations:
    type: integer
    minimum: 0
    description: >
      Provenance counter for the reflection loop (how many critique
      iterations ran).
  command:
    type: string
    enum: [generate, review, export, edit, ingest, show]
    description: Invoking command for deterministic replay and Journey Log audit.
  mode:
    type: string
    enum: [prompt, document, youtube, pptx, url, briefing, topic, webinar, sales_narrative]
    description: Briefing/source mode associated with the job.
  inputs:
    type: object
    description: Opaque resolved input payload for deterministic replay. Secrets must never be stored here.
    additionalProperties: true
  source_of_truth_policy:
    type: string
    enum: [evidence_required, evidence_optional, evidence_disabled]
    description: Source-of-truth policy enforced by edit/export gates.
  stage:
    type: string
    enum:
      - normalize_briefing
      - compose_deck_spec
      - critique_loop
      - compile_native_ir
      - render
      - done
    description: Optional current pipeline stage boundary.

x-deferred-fields: []

x-safety-rules:
  - rule: api_key_env never persisted to disk in job-state files
    enforced: true
    rationale: >
      Runtime reads provider credentials from environment; api_key_env
      stores only the variable NAME, not the value (packages/slides-core/src/types/index.ts:21-25).
  - rule: schema_version pinned at 1.0.0 — bump only via type migration
    enforced: true
    rationale: Const value matches runtime literal type.
  - rule: errors append-only; never rewrite historical error entries
    enforced: true
    rationale: >
      Errors carry phase/message/at provenance; rewriting would destroy
      Journey Log evidence (Art IX).
